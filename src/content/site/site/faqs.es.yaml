faqs:
  - q: ¿Dónde están ubicadas su empresa y su fábrica?
    a: >-
      Estamos en Qingdao, China. Vectoflare es la marca B2B de Vectoflare, la
      división de fabricación de Qingdao Vatrad Group Co., Ltd. — una planta
      de fabricación de inflables de 12.500 m² en la Zona de Desarrollo
      Económico de Laixi, en producción desde 2012. El soporte comercial y
      técnico es global; la producción está en Qingdao, China.
  - q: ¿Proporciona Vectoflare servicios OEM/ODM para equipos hinchables de deportes acuáticos?
    a: >-
      Sí. Vectoflare (respaldo de Qingdao Vatrad Group Co., Ltd.) ofrece
      personalización OEM y ODM a gran escala — desde planos 3D y selección de
      material drop-stitch hasta la producción en volumen para marcas globales.
      Gestionamos la etiqueta privada, el embalaje personalizado y la documentación
      de cumplimiento para BSCI, CE y otras certificaciones
  - q: ¿Qué certificaciones mantiene Vectoflare para la fabricación de equipos hinchables de deportes acuáticos?
    a: >-
      La fábrica de Vectoflare está certificada y todos los productos cumplen las
      normas CE. También mantenemos la certificación de cumplimiento social BSCI
      exigida por los principales minoristas europeos y norteamericanos. Cumplimiento
      REACH y RoHS disponible bajo petición.
  - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para paddle boards hinchables OEM?
    a: >-
      El MOQ se confirma según la configuración del proyecto, no con un número
      fijo: cada proyecto pasa por las etapas de muestra (1–2 unidades) y piloto
      (20–50 unidades), con una producción de volumen estándar de 90–100+
      unidades por lote a partir de un rollo completo de drop-stitch de 150 m.
      El co-branding de lotes pequeños parte de menos de 20 unidades. Consulta
      nuestra Guía de MOQ y Branding Flexible para la lógica de cálculo completa.
  - q: ¿Qué materiales utiliza Vectoflare para la producción de SUP hinchables?
    a: >-
      Utilizamos PVC de grado marino (0,9 mm–1,2 mm) con núcleo drop-stitch de
      doble capa para los SUP. Los materiales se obtienen de proveedores
      cualificados y se ensayan en cuanto a resistencia a la tracción,
      resistencia UV y flexibilidad a baja temperatura antes de la producción.
  - q: ¿Puede Vectoflare gestionar pedidos mayoristas de gran volumen para compradores internacionales?
    a: >-
      Sí. Nuestra fábrica de 12.500 m² produce más de 120.000 unidades al año con
      un equipo dedicado de más de 200 trabajadores cualificados. Enviamos a más de
      50 países y gestionamos la logística, incluidos FOB Qingdao, CIF a los
      principales puertos y la entrega puerta a puerta a través de nuestros socios
      de transporte.
  - q: ¿Cuál es el plazo de entrega para la producción OEM de SUP hinchables?
    a: >-
      El plazo estándar de producción OEM es de 25–35 días desde la confirmación
      del pedido y el depósito. El desarrollo del molde personalizado añade
      15–20 días para el utillaje, y las muestras de prototipo se envían en
      7–12 días. Pedidos urgentes disponibles para socios establecidos con stock
      de material confirmado.
  - q: ¿Suministra Vectoflare material drop-stitch de grado militar para paddle boards?
    a: >-
      Sí. Nuestro núcleo drop-stitch utiliza tejido de PVC de especificación
      marina con una resistencia a la tracción superior a 2000 N/5cm. El proceso
      de laminación de doble capa logra una retención de aire a 18,0 PSI con una
      caída de presión inferior a 0,50 PSI en 24 horas — el estándar de integridad de
      retención de aire de la fábrica.
  - q: ¿Cómo garantiza Vectoflare la estanqueidad y la resistencia UV de sus hinchables?
    a: >-
      Cada tubo hinchable se somete a un ensayo de retención de presión de 24 horas
      a 18,0 PSI antes del envío; las cámaras que superan una caída de presión de
      0,50 PSI se rechazan automáticamente. La resistencia UV se valida
      mediante meteorización acelerada con umbrales de degradación de la
      resistencia a la tracción. Nuestro compuesto de PVC incluye estabilizadores
      UV y aditivos antioxidantes para una durabilidad exterior a largo plazo.
  - q: ¿Puede Vectoflare ayudar con el diseño del embalaje y la marca de etiqueta privada?
    a: >-
      Sí. Ofrecemos embalaje de etiqueta privada llave en mano: cajas minoristas
      de diseño personalizado, colgantes, manuales de instrucciones y cartones de
      envío con el arte de tu marca. Nuestro equipo de diseño interno puede
      desarrollar una identidad visual completa para nuevos entrantes al mercado —
      desde la aplicación del logotipo hasta la experiencia de unboxing.
  - q: ¿Acepta Vectoflare auditorías de fábrica de compradores internacionales?
    a: >-
      Por supuesto. Damos la bienvenida a las auditorías de fábrica in situ y de
      terceros, incluidas BSCI, SMETA e inspecciones de cumplimiento social
      específicas del cliente. Nuestra instalación de 12.500 m² está lista para
      auditorías con procesos de control de calidad documentados, trazabilidad de
      materiales y registros de salud y seguridad de los trabajadores. Visitas
      virtuales a la fábrica disponibles para la cualificación inicial.
  - q: ¿Qué es la tecnología drop-stitch utilizada en las tablas SUP de Vectoflare?
    a: >-
      El drop-stitch es una construcción de tejido en la que miles de hilos de
      poliéster conectan las capas superior e inferior de PVC. Al inflarse a
      12–15 PSI, estos hilos separan los paneles a una distancia fija, creando una
      plataforma rígida y plana. Vectoflare utiliza drop-stitch con laminación por
      fusión — donde los hilos se unen térmicamente al PVC — para una resistencia
      a la delaminación superior frente a los núcleos tradicionales encolados.
  - q: ¿Qué plataformas necesitan los principiantes y los huéspedes de alquiler?
    a: >-
      Los compradores que planifican flotas de alquiler, resort o escuelas suelen
      empezar con plataformas all-around anchas y de alto volumen, estables para
      los principiantes y versátiles para el uso comercial diario. También podemos
      configurar tablas para varios riders para clases en grupo. La selección de
      la plataforma se revisa contra tu perfil de usuarios antes de las muestras.
  - q: ¿En qué condiciones de agua pueden operar los programas comerciales de SUP?
    a: >-
      Las tablas Vectoflare están construidas para uso en mar, lago y río. Las
      plataformas Touring soportan el oleaje costero y todas las tablas utilizan
      PVC de grado marino que resiste la corrosión del agua salada. Para flotas
      de agua salada recomendamos la rutina estándar de aclarado con agua dulce
      entre usos, e incluimos esta pauta en la guía del operador que acompaña a
      los kits comerciales.
  - q: ¿Suministran bombas y accesorios de inflado para kits comerciales?
    a: >-
      Sí. Los kits comerciales incluyen bombas manuales de doble acción, con
      opción de bomba eléctrica para resorts y operadores de alquiler que
      gestionan varias tablas al día. La selección de bomba, pala, leash, quilla,
      mochila y kit de reparación se confirma como parte de la configuración de
      accesorios de cada proyecto.
  - q: ¿Cómo se empaquetan las tablas para el envío y la entrega al cliente?
    a: >-
      La producción en volumen se envía en embalaje al vacío para reducir el peso
      volumétrico entre un 50–60 %. Para programas minoristas proporcionamos
      cartones con tu marca, manuales, código de barras y el marcado de cartón
      por mercado, y podemos preparar kits completos separados con divisores para
      que cada caja llegue con el mismo conjunto de accesorios.
  - q: ¿Qué rango de peso del rider soportan sus tablas?
    a: >-
      Las plataformas All-Around soportan hasta 220 lbs; las plataformas Touring
      y Yoga soportan hasta 250 lbs, con opciones de mayor capacidad en las
      tablas más grandes. El peso del rider, la construcción y la presión se
      especifican por plataforma en la ficha técnica antes de comprometer una
      serie de producción.
  - q: ¿Qué incluye un kit comercial completo?
    a: >-
      Un kit completo incluye normalmente la tabla, la mochila de viaje, la bomba
      manual de doble acción, la quilla extraíble, el leash de bobina y el kit de
      reparación, con opciones de mejora a pala y a bomba eléctrica. El contenido
      del kit queda fijado en la lista de materiales aprobada para que la muestra
      y la producción en volumen coincidan exactamente.
  - q: ¿Pueden combinar tablas, accesorios y embalaje en un solo programa?
    a: >-
      Sí. Los programas multi-SKU cubren tablas, accesorios y embalaje minorista
      bajo un único contrato de fábrica — los kits de accesorios compartidos
      reducen el inventario por SKU, un único sistema de diseño mantiene la
      coherencia de marca y un único responsable de calidad gestiona las
      reclamaciones de garantía. Así es como nuestros distribuidores y socios
      minoristas gestionan líneas SUP completas.
  - q: ¿Cuál es la diferencia entre OEM, ODM y etiqueta privada?
    a: >-
      OEM significa que fabricamos según tu especificación y diseño. ODM
      significa que desarrollamos el producto por ti — forma, construcción,
      gráficos y embalaje — a partir de tu concepto o brief de mercado. Etiqueta
      privada significa que tomas una plataforma existente y le pones tu marca
      con un cambio técnico mínimo. La mayoría de los proyectos se sitúa entre
      estos modos, y presupuestamos la configuración que encaja con cuánto del
      diseño del producto quieres mantener en tu control.
  - q: ¿Cuánto cuesta una muestra de prototipo y se puede descontar del pedido?
    a: >-
      El precio de la muestra sigue la configuración del proyecto: tamaño,
      construcción, arte y embalaje afectan a la cotización. Para proyectos que
      pasan a producción en volumen, la cuota de muestra suele acreditarse contra
      el primer pedido de producción — las condiciones del crédito se confirman
      por escrito en la fase de cotización para que no haya sorpresas después.
  - q: ¿Cuántas paddle boards hinchables caben en un contenedor de 20 pies?
    a: >-
      Con tablas de 11 ft estándar en embalaje al vacío con kits de accesorios, un
      contenedor de 20 pies transporta típicamente entre 150 y 200 juegos
      completos — el número exacto depende del diseño del embalaje, la mezcla de
      accesorios y el tamaño de los cartones. Nuestro equipo de embalaje calcula
      el plan de carga a partir de tu lista de materiales real, de modo que el
      número con el que planificas es el número que se envía.
  - q: ¿Qué incluyen sus cotizaciones mayoristas — FOB o CIF?
    a: >-
      Las cotizaciones están desglosadas: producto, embalaje estándar y flete
      bajo tu incoterm elegido. FOB Qingdao es la base por defecto, con CIF a los
      principales puertos y entrega puerta a puerta disponibles a través de
      nuestros socios de transporte. Cada cotización indica el alcance exacto de
      lo que incluye, de modo que no compares ofertas de proveedores distintos
      con criterios diferentes.
  - q: ¿Cobran tarifas de utillaje o moldes para tablas personalizadas?
    a: >-
      Los montajes gráficos y las planchas de impresión son de bajo coste y
      reutilizables; el utillaje estructural (nuevas formas, raíles
      personalizados o construcciones exclusivas) se detalla en la fase de
      cotización. Cuando aplica el utillaje, el coste se amortiza normalmente
      en la primera serie de producción en lugar de cobrarse como un cargo
      puntual inesperado.
  - q: ¿Qué condiciones de pago aplican a los pedidos de producción?
    a: >-
      Las condiciones estándar son un depósito para fijar la producción, con el
      saldo pagadero antes del envío. El porcentaje del depósito y el calendario
      del saldo se acuerdan por pedido y se indican en el contrato. Los socios
      establecidos con historial de pedidos constante pueden hablar de
      condiciones ampliadas — preferimos pocas condiciones claras antes que
      estructuras financieras complicadas.
  - q: ¿Qué garantía ofrecen en pedidos por volumen?
    a: >-
      Cada tabla pasa una prueba de retención de presión de 24 horas a 18,0 PSI
      antes del envío, y las condiciones de garantía se escriben en cada contrato
      de pedido — cubren defectos de fabricación como delaminación, fallos de
      costura y fugas de válvula, y excluyen los daños por uso. El período de
      garantía y el procedimiento de reclamación se confirman en la orden de
      compra, no se descubren después.
  - q: ¿Qué pasa si las tablas llegan dañadas o con defectos de fabricación?
    a: >-
      Informa del problema dentro del plazo acordado (normalmente 7–15 días desde
      la llegada) con fotos o vídeo como prueba. Evaluamos la reclamación contra
      los registros de inspección pre-envío de tu lote y luego se re-elabora,
      repone o abona en consecuencia. Las fotos documentadas de control de
      calidad de tu stock hacen que este proceso sea rápido y justo para ambas
      partes.
  - q: ¿Cómo se aprueba el arte personalizado antes de la producción?
    a: >-
      Los gráficos pasan por una cadena de aprobación controlada: mockup digital,
      prueba impresa, inspección de primeras piezas sobre la tabla de producción
      y después la producción en serie. Cada paso se comprueba contra tu arte
      firmado, por eso los colores impresos, la disposición del EVA y la
      colocación del logotipo coinciden con tu archivo de marca cuando llegan
      las tablas.
  - q: ¿Qué piezas de repuesto suministran para flotas comerciales?
    a: >-
      Los operadores de flotas pueden pedir piezas reparables con sus tablas o en
      pedidos de reorden: válvulas de repuesto, kits de reparación (parches de
      PVC y adhesivo), cajas de quilla y quillas, y los accesorios que más se
      sustituyen. Las piezas de repuesto se envían junto con la producción o
      como pequeños envíos, de modo que un componente roto no deje una tabla
      fuera de servicio durante mucho tiempo.
  - q: ¿Qué información debería preparar antes de solicitar una cotización?
    a: >-
      Cuanto mejor sea el brief, más rápida la cotización: mercado objetivo y
      uso, especificaciones deseadas (tamaño, construcción, presión), cantidad y
      precio objetivo, necesidades de marca y embalaje, y tu calendario de
      lanzamiento. Nuestro formulario de consulta recoge exactamente esta lista
      — compartirla ahorra rondas de cotización y te da una estimación más firme
      a la primera.
  - q: ¿Cuánto tarda el muestreo antes de la producción?
    a: >-
      Las muestras de prototipo se envían en 7–12 días desde que se congela la
      especificación. Añade el tiempo de revisión para tus pruebas y cualquier
      ronda de ajustes — la mayoría de los proyectos completan el muestreo en
      unas dos o tres semanas. La producción comienza tras la aprobación de la
      muestra, así que la fase de muestras es el lugar donde el cuidado extra
      se traduce en tiempo ahorrado más adelante.