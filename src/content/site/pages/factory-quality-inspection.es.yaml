faqs:
  tagline: FAQ
  title: Preguntas frecuentes sobre el control de calidad de los SUP
  items:
    - q: '¿Cómo controla QINGDAO VATRAD GROUP.,LTD. la calidad de las tablas de SUP hinchables?'
      a: 'La calidad se controla mediante inspección de materiales entrantes, puntos de control en el proceso de producción, verificación final del producto, inspección del embalaje y trazabilidad de la producción, cada uno ejecutado según muestras, especificaciones y criterios de inspección aprobados por proyecto.'
    - q: '¿Qué inspecciones de calidad se realizan durante la producción de los SUP?'
      a: 'Las inspecciones incluyen verificación de materiales, controles de corte e impresión, inspección de la construcción de la tabla, verificación de la instalación de válvulas, inspección de accesorios, pruebas de estanqueidad al aire, inspección de aspecto y verificación del embalaje.'
    - q: '¿Pueden los clientes OEM solicitar los registros de inspección de los SUP?'
      a: 'Sí. Los registros de inspección y la documentación de calidad pueden facilitarse según los requisitos del proyecto y los acuerdos de calidad con el cliente, incluidos informes de muestra de inspección de pre-embarque.'
    - q: '¿Cómo garantiza la fábrica la consistencia de la producción OEM?'
      a: 'La consistencia de la producción se mantiene mediante muestras aprobadas, especificaciones técnicas, puntos de control de fabricación, procedimientos de inspección y procesos documentados de control de calidad vinculados a cada pedido.'
    - q: '¿Puedo organizar una inspección de terceros con SGS, BV, Intertek o QIMA?'
      a: 'Sí. Recibimos a los inspectores de terceros con una zona de inspección dedicada, manómetros calibrados, briefs de inspección precumplimentados y registros accesibles. Comparte tu especificación, muestra aprobada, arte, requisitos de embalaje y criterios de defectos — o utiliza nuestra plantilla de brief de inspección de terceros.'
    - q: '¿Cómo se gestionan los cambios de arte, BOM o embalaje durante la producción?'
      a: 'Los cambios se registran en nuestro registro de control de cambios con la revisión del documento afectado, el resumen del cambio, el motivo, la evaluación de impacto, el estado de aprobación del cliente y el lote efectivo. Las versiones obsoletas se retiran para que producción e inspección utilicen siempre los documentos aprobados vigentes.'
    - q: '¿La fábrica admite proyectos de SUP hinchables personalizados?'
      a: 'Sí. Se admiten proyectos OEM/ODM de SUP hinchables personalizados según las especificaciones del cliente, los requisitos de arte, las configuraciones de accesorios y las necesidades de embalaje, con criterios de inspección específicos por proyecto acordados antes de la producción.'
    - q: '¿Puede retrabajarse en fábrica una tabla de SUP con fugas?'
      a: 'Sí — bajo condiciones controladas. La tabla se coloca en HOLD y se vincula a un NCR, la fuga se localiza con un método de diagnóstico aprobado y el retrabajo solo se realiza tras la autorización de Calidad/Ingeniería y únicamente dentro de las clases de defecto aprobadas para retrabajo. La tabla se reinspecciona después contra los mismos criterios de aceptación que una tabla conforme antes de su liberación.'
    - q: '¿Cuántas veces puede retrabajar la fábrica una tabla?'
      a: 'Una misma ubicación puede retrabajarse una sola vez bajo una instrucción autorizada. Si la reinspección sigue fallando, la tabla se escala a sustitución, rechazo, desecho o concesión del cliente — no se permite repetir el retrabajo sin aprobación documentada.'

