hero:
  tagline: Soluciones B2B
  title: '24 soluciones B2B adaptadas a tu negocio'
  subtitle: 'Desde fundadores de startups hasta distribuidores globales: encuentra la solución Vectoflare exacta diseñada para tu modelo de negocio, tu sector y tus objetivos.'
  image:
    src: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-factory-aerial-1.webp
    alt: Fábrica e instalaciones de fabricación de Vectoflare

answer:
  label: 'Respuesta directa'
  text: 'Una sola fábrica sirve todas las vías B2B: fabricación OEM/ODM con MOQ confirmado por proyecto (muestra 1–2 unidades, piloto 20–50, volumen estándar 90–100+ por rollo de 150 m; co-branding desde menos de 20 unidades), marca privada sobre plataformas probadas, distribución mayorista y programas de flotas para resorts, clubes y escuelas. Muestras en 7–12 días; producción en 25–35 días tras el PO y el depósito.'
  verified: '2026-08'

