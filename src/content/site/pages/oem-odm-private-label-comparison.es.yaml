ip_rules:
  tagline: 'Protección de propiedad intelectual'
  title: 'Cómo protegemos tus diseños y marca'
  subtitle: 'Independientemente del modelo de colaboración, tus archivos de arte, utillaje y especificaciones siguen siendo de tu propiedad.'
  body: |
    **NDA antes del intercambio de archivos.** Firmamos un acuerdo de confidencialidad antes de cualquier intercambio de archivos técnicos — plazo estándar de respuesta en 4 horas laborables.

    **Sin reutilización de diseños.** Tus archivos de arte, utillaje y especificaciones nunca se comparten ni se venden a otros clientes. Los moldes OEM son exclusivamente tuyos. Los diseños ODM son aprobados por ti antes de la producción. Las plataformas de Marca Privada son estructuras compartidas, pero tus gráficos y marca son exclusivos.

    **Solo B2B.** Fabricamos exclusivamente bajo las marcas de nuestros clientes. No vendemos a consumidores finales y no competimos con nuestros clientes en ningún mercado.

    **Propiedad del molde.** Los moldes a medida pagados por el comprador son propiedad del comprador. Los almacenamos y mantenemos, pero no podemos usarlos para otros clientes sin autorización escrita.

faqs:
  tagline: 'Preguntas frecuentes'
  title: 'Preguntas comunes sobre OEM, ODM y Marca Privada'
  items:
    - q: '¿Puedo pasar de marca privada a OEM más adelante?'
      a: 'Sí. Muchos clientes empiezan con un lote de marca privada o piloto para validar el mercado, luego invierten en utillaje a medida para un programa OEM completo una vez demostrada la demanda. La misma planta y sistema de QC soporta ambas vías.'
    - q: '¿ODM significa que la fábrica es dueña de mi marca?'
      a: 'No. Bajo ODM, tú eres propietario de tu marca, gráficos y embalaje. La fábrica desarrolla la estructura de la tabla a partir de tu brief y tú apruebas el diseño antes de la producción. La fábrica retiene la PI del proceso de desarrollo, pero la especificación de producto aprobada es tuya.'
    - q: '¿Es la marca privada de menor calidad que OEM?'
      a: 'No. Las tres vías pasan por la misma planta, el mismo sistema de QC y el mismo equipo de exportación. Las tablas de marca privada se fabrican sobre plataformas probadas y validadas con prueba completa de presión 18 PSI / 24h y el mismo checklist de ensamblaje de 100 puntos.'
    - q: '¿Qué tal si no estoy seguro de qué modelo elegir?'
      a: 'Contáctanos con tu situación — nuestro equipo de ingeniería recomendará la vía más práctica según tus requisitos de producto, plazo y objetivos de volumen. Sin compromiso antes de la revisión de especificaciones.'
    - q: '¿Puedo obtener muestras antes de comprometerme con algún modelo?'
      a: 'Sí. 1–2 muestras de prototipo salen en 7–12 días. El coste de la muestra se descuenta del pedido de volumen. Esto te permite evaluar la construcción y calidad antes de cualquier compromiso de volumen.'

