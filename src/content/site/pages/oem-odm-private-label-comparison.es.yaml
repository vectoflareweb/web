hero:
  tagline: 'Elige tu vía de colaboración'
  title: 'OEM vs ODM vs Marca Privada — ¿Qué modelo se adapta a tu proyecto?'
  subtitle: 'Tres formas de trabajar con una fábrica de SUP, cada una con diferentes compromisos de propiedad, inversión y velocidad. Esta guía explica las diferencias para que elijas la vía correcta antes de tu primera consulta.'

answer:
  label: 'Comparación rápida'
  text: 'OEM: tú eres propietario del diseño y la especificación — fabricamos según tus planos. ODM: nuestro equipo de ingeniería desarrolla la tabla a partir de tu brief — tú apruebas antes de la producción. Marca privada: tu marca sobre una plataforma existente validada sin cambios estructurales — la vía más rápida al mercado. Las tres rutas pasan por la misma planta, el mismo sistema de QC y el mismo equipo de exportación en Qingdao, China.'
  verified: '2026-08'

comparison_table:
  tagline: 'Lado a lado'
  title: 'Comparativa OEM / ODM / Marca Privada'
  subtitle: 'Diferencias clave en propiedad de diseño, MOQ, utillaje, plazos y propiedad intelectual.'
  headers:
    dimension: Dimensión
    oem: Fabricación OEM
    odm: Desarrollo ODM
    pl: Marca Privada
  rows:
    - dimension: '¿Quién diseña la tabla?'
      oem: 'Tú aportas la especificación, planos o tabla de referencia'
      odm: 'El equipo de ingeniería de fábrica desarrolla desde tu brief'
      pl: 'Plataforma existente de fábrica — sin trabajo de diseño'
    - dimension: 'Propiedad del diseño y PI'
      oem: 'Tú eres propietario de todos los diseños, moldes y propiedad intelectual'
      odm: 'Tú eres propietario del diseño final aprobado; la fábrica retiene la PI del proceso de desarrollo'
      pl: 'La fábrica es propietaria del diseño de la plataforma; tú eres propietario de tu marca y gráficos'
    - dimension: 'Molde / utillaje'
      oem: 'Molde a medida necesario para formas nuevas — cuota de utillaje única, 15–20 días adicionales'
      odm: 'Puede requerir molde a medida según la especificación — mismo plazo de utillaje'
      pl: 'Sin molde nuevo — se usa el utillaje de la plataforma existente'
    - dimension: 'Cantidad mínima de pedido'
      oem: '90–100+ unidades por configuración aprobada'
      odm: '90–100+ unidades por configuración aprobada; lotes piloto desde 20–50'
      pl: '5–10 unidades (co-branding) o 20–50 (lote piloto sobre plataforma existente)'
    - dimension: 'Plazo típico de entrega'
      oem: '25–35 días + 15–20 días de utillaje si molde nuevo'
      odm: '25–35 días + tiempo de iteración de desarrollo (varía por complejidad)'
      pl: '25–35 días (sin retraso de utillaje)'
    - dimension: 'Nivel de personalización'
      oem: 'Total — forma, construcción, materiales, gráficos, embalaje'
      odm: 'Total — la fábrica propone, tú apruebas cada elemento'
      pl: 'Solo gráficos y embalaje — sin cambios estructurales'
    - dimension: 'Proceso de muestras'
      oem: '1–2 muestras de prototipo en 7–12 días tras aprobación de especificación'
      odm: '1–2 muestras de prototipo en 7–12 días tras aprobación del diseño'
      pl: '1–2 muestras en 7–12 días — plataforma ya validada'
    - dimension: 'Mejor para'
      oem: 'Compradores con diseños existentes, tablas de referencia o especificaciones detalladas'
      odm: 'Compradores con ideas de producto o requisitos de mercado sin especificación detallada'
      pl: 'Compradores que necesitan tablas con marca rápidamente sin desarrollo de producto'

