traceability:
  tagline: 'Un Lote, Seguido Del Rollo A La Tabla'
  title: 'Cómo Es La Trazabilidad Real'
  body: |
    Cada lote recibe un **código de lote ERP de 10 años**. La cadena registrada bajo un mismo lote:

    - **Rollo entrante** — certificado de material, número de rollo, lote de tela probada (tracción, desgarro, costuras)
    - **Corte** — trabajo de anidado CNC contra el archivo de diseño, porcentaje de desperdicio registrado
    - **Soldadura y laminación** — línea, operario, parámetros de máquina por cámara
    - **Ensamblaje** — número de serie de la tabla, tipo de válvula, lote del piso EVA
    - **Prueba** — 18.0 PSI × 24 h de retención por cámara, auto-rechazo por encima de 0.50 PSI de caída
    - **Liberación** — checklist de 100 puntos por tabla, firma del Director de QA por lote
    - **En adelante** — Certificado de Conformidad con el envío; derecho de auditoría reservado en el contrato

    Pide el registro de control de calidad de muestra antes de tu primer pedido: es el mismo formato que recibes con tu envío.

faqs:
  tagline: 'FAQ'
  title: 'Preguntas De Evidencia Que Hacen Los Compradores'
  items:
    - q: '¿Esta página es solo para verificación y no sustituye la diligencia debida?'
      a: 'Correcto — esta página muestra dónde se puede verificar cada afirmación: registro de la entidad, certificados, máquinas, registros y una planta abierta a auditorías. Tus pasos habituales de diligencia debida (comprobación del registro, auditoría, inspección externa) siguen aplicándose y son bienvenidos.'
    - q: '¿Qué entidad debe aparecer en la documentación de mi pedido?'
      a: 'Los pedidos se formalizan con Qingdao Vatrad Group Co., Ltd., que opera como Vectoflare (división de fabricación), con Vectoflare como línea de producto SUP. Los contratos se firman por el Vicepresidente Comercial, el Ingeniero Jefe y el Director de QA.'
    - q: '¿Puedo obtener copias de los certificados antes de pedir?'
      a: 'Sí: los números de certificado y los registros de auditoría se facilitan bajo petición o durante una auditoría. La lista está publicada, nunca es "solo disponible bajo petición".'
    - q: '¿Cómo verifico yo mismo los registros de prueba del lote?'
      a: 'Cada cámara se prueba a 18.0 PSI durante 24 horas con auto-rechazo por encima de 0.50 PSI de caída; los registros se vinculan a los números de serie y viajan con el Certificado de Conformidad por lote. Puedes programar inspección previa al envío SGS, TÜV, BV o Intertek según ISO 2859-1 Nivel II.'
    - q: '¿Los certificados cubren también los accesorios?'
      a: 'La documentación de materiales REACH/RoHS aplica a tablas y accesorios del mismo pedido, y los checklists de control de calidad cubren el kit completo: tabla, remo, bomba, correa y bolsa.'
    - q: '¿Qué pasa con la evidencia después del pedido?'
      a: 'La trazabilidad ERP del lote se conserva durante 10 años. Los SOP del SGC y las normas de inspección siguen descargables, y el comprador reserva un derecho de auditoría durante la producción según el contrato.'

