answer:
  label: 'Respuesta directa'
  text: 'La cadena afirmación-evidencia es: cada afirmación de este sitio está respaldada por un registro, un certificado, una máquina, un documento o un registro de prueba — y cada uno de ellos puede revisarse. Vectoflare es la división de desarrollo y fabricación de SUP de Vectoflare, la división de fabricación de Qingdao Vatrad Group Co., Ltd. (registrada en Qingdao desde 2012). La planta de 12,500 m² cuenta con gestión de calidad ISO 9001:2015, cumplimiento ISO 25649, documentación de conformidad CE, cumplimiento social BSCI (informe de auditoría bajo petición) y documentación de materiales REACH/RoHS por pedido. Cada cámara hinchable se prueba a 18.0 PSI durante 24 horas con auto-rechazo por encima de 0.50 PSI de caída, y los registros de lote se conservan con trazabilidad ERP de 10 años. La documentación se publica o se comparte, y la fábrica misma está abierta a auditorías.'
  verified: '2026-08'

