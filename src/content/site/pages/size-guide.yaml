how_to_choose:
  title: How to Choose the Right Size
  cards:
    - title: SUP Boards
      description: Choose length based on your weight and intended use. Wider boards (32"+) offer more stability. Longer boards (11-12 ft) track better for touring. Heavier paddlers need higher volume boards.
    - title: Touring SUPs
      description: Longer boards (11–12 ft) are best for covering distance and touring. Wider boards (32"+) offer more stability. Check weight capacity for total load including gear.
    - title: All-Around SUPs
      description: Choose length by rider weight and intended use. All-around boards work for recreation, fitness, and yoga. Smaller boards are more maneuverable.

