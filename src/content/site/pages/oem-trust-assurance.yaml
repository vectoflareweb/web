trust_steps:
  tagline: 'A Real Case Study'
  title: 'How a Northern European Rental Fleet Verified Us Before Ordering'
  subtitle: 'Seven verification steps a commercial rental operator completed before placing a 90–100+ unit fleet order —the same checklist is open to you.'
  steps:
    - step: '01'
      title: 'Official Entity Verification'
      desc: 'The buyer requested the Chinese Business Registration and export trade license. The legal entity behind Vectoflare is Qingdao Vatrad Group Co., Ltd., a manufacturer registered since 2012 in Qingdao, Shandong —verified via the national registry under NDA.'
    - step: '02'
      title: 'Physical Factory & Site Audit'
      desc: 'A factory audit (in person and via video walkthrough) confirmed the 12,500 m² plant: four specialized workshops, 350+ workers, four automated lines and a monthly output of about 10,000 boards. The audit report is filed with the contract records.'
    - step: '03'
      title: 'People: Real Engineers, Not Sales Scripts'
      desc: 'The buyer spoke directly with the engineering team —hull design, materials lab and QC. The project specification and NDA were exchanged within 4 business hours, and an engineering review came back within one business day.'
    - step: '04'
      title: 'Paper: QMS, Certificates & Third-Party Inspection'
      desc: 'ISO 9001:2015, ISO 25649 and CE compliance documentation, BSCI/REACH/RoHS records, and the QMS SOPs were reviewed. The buyer scheduled an SGS pre-shipment inspection per ISO 2859-1 Level II on the first volume order —and received a Certificate of Conformance per batch.'
    - step: '05'
      title: 'Data: Test Records Per Serial Number'
      desc: 'The buyer audited actual test records: every chamber tested at 18.0 PSI for 24 hours with auto-reject above 0.50 PSI pressure drop, 100-point assembly checklists, and 10-year ERP batch traceability. Sample QC records were provided before the order.'
    - step: '06'
      title: 'Contract Protection'
      desc: 'The order contract covered brand licensing, an agreed territory exclusivity period, mould ownership and buyout terms, and defined the data and records that transfer with the tooling. The buyer approved the mould at the factory before production.'
    - step: '07'
      title: 'Ongoing Governance'
      desc: 'Quarterly business reviews with the Sales VP and Chief Engineer, a reserved right to audit during production, and an escalation path to the QA Director for any quality dispute. The agreement was jointly signed by the Sales VP, Chief Engineer and QA Director.'

trust_faqs:
  tagline: 'FAQ'
  title: 'The 12 Concerns Buyers Ask Before Ordering'
  items:
    - q: 'Is Vectoflare really a factory, or a trading company?'
      a: 'Vectoflare is the SUP product development and manufacturing division of Vectoflare, the manufacturing division of Qingdao Vatrad Group Co., Ltd. We operate the 12,500 m² plant in Qingdao ourselves —design, cutting, welding, assembly and testing happen in one facility. There are no trading-company handoffs: the people who answer your questions are the people who build your boards.'
    - q: 'Who exactly will I deal with during my project?'
      a: 'A named project engineer and a named QC contact, plus the department heads who sign your documents. You can ask to speak with the Chief Engineer, the QA Director or the factory director directly —before and after the order. No account-manager layer sits between you and the people doing the work.'
    - q: 'Can I visit or audit the factory?'
      a: 'Yes. We host factory visits in the Laixi Economic Development Zone, Qingdao, and support remote audits with live video walkthroughs. Audits can be arranged independently (your inspector or a third party such as SGS, TÜV, BV or Intertek) and the audit schedule can be written into the contract.'
    - q: 'Will you sign an NDA before I share my design?'
      a: 'Yes. Our standard NDA is signed within 4 business hours of your request, before any proprietary specification, artwork or technical file is shared. Bilingual (English/Chinese) versions are available, and the document is countersigned by the factory director.'
    - q: 'How do I know your quality claims are real?'
      a: 'Every claim on this site has a document behind it: QMS SOPs and inspection standards are downloadable, anonymized quality-record samples are published, and test data is logged per serial number with 10-year ERP batch traceability. You can also schedule a third-party pre-shipment inspection at your choice.'
    - q: 'What happens if my boards arrive with defects?'
      a: 'Every board is tested before packing, and batch-level records allow root-cause tracing per serial number. The contract defines inspection, replacement and rework obligations, and the QA Director signs the batch release. Reworked boards are re-tested in full —never partially checked.'
    - q: 'Can you really test 100% of boards before shipping?'
      a: 'Yes —and the records prove it. Every chamber is inflated to 18.0 PSI and held for 24 hours with continuous sensor logging; any chamber exceeding 0.50 PSI of pressure drop over 24 hours is auto-rejected and re-inspected. Test logs are linked to each serial number and are part of the batch documentation.'
    - q: 'What certifications do you actually hold?'
      a: 'ISO 9001:2015 quality management, ISO 25649 and CE compliance for inflatable SUP products, plus BSCI, REACH and RoHS compliance for the facility and materials. Certificate numbers and audit records are supplied on request or during an audit —the list is published, not "available on request only".'
    - q: 'Will my brand be safe —design, moulds and market?'
      a: 'Yes. Your brand, designs and tooling are protected by NDA, brand licensing terms and mould ownership or buyout clauses written into the contract. Tooling is kept for the brand and transferable. Territory and exclusivity terms are agreed in writing before production starts.'
    - q: 'What is your real MOQ?'
      a: 'MOQ is project-specific and explained on our MOQ guide: samples 1–2 units, co-branding small bulk 5–10 units, pilot batches 20–50 units, and standard volume 90–100+ units per 150 m roll (about 180–220 boards). Custom-mould shapes run at the volume tier. The calculation is confirmed before quotation —no vague "low MOQ" numbers.'
    - q: 'What happens if production is late?'
      a: 'Lead time is confirmed after specification, artwork and packaging review —never promised beforehand. The contract covers scheduling, delay notification and the resolution path, and the quarterly business review tracks delivery performance against the agreed calendar.'
    - q: 'Who signs the contract documents on your side?'
      a: 'Orders and agreements are jointly signed by the Sales VP, the Chief Engineer and the QA Director —the three people accountable for commercial terms, engineering execution and quality release respectively. You receive the signed documents with the contract records.'

governance:
  tagline: 'Accountability Structure'
  title: 'Named Signatories & Reserved Rights'
  subtitle: 'Every commitment is tied to a named role —not to a sales department.'
  body: |
    **Joint sign-off.** Orders, quality plans and dispute resolutions are signed by three roles: the Sales VP (commercial terms), the Chief Engineer (engineering execution) and the QA Director (quality release). Bilingual SOPs are version-controlled and carry the same signature structure.

    **Reserved rights.** The buyer retains the right to audit production, review test records and hold batch release until inspection sign-off. Rework only happens under an approved change record, and release is validated by independent QC —never by the rework operators.

    **Records that transfer.** Batch test logs, certificates of conformance and inspection reports are delivered with each shipment, and ERP batch traceability is kept for 10 years. Tooling records and mould drawings transfer with the tooling when the contract so provides.

