answer:
  label: 'Straight answer'
  text: 'Trust is not a promise —it is documentation. We are a registered Chinese manufacturing entity (Qingdao Vatrad Group Co., Ltd.) with a physical 12,500 m² plant in Qingdao, 350+ workers and 120,000+ boards of annual capacity. You can verify the registration, audit the factory, review QMS SOPs, download sample quality records, schedule third-party inspections (SGS, TÜV, BV or Intertek) and have an NDA signed within 4 business hours. Every board is pressure-tested at 18.0 PSI for 24 hours with auto-reject above 0.50 PSI drop, and every batch keeps 10-year ERP traceability. If a claim cannot be documented, we do not make it.'
  verified: '2026-08'

