faqs:
  - question: ¿Puedes estar de pie y pescar sobre un SUP hinchable?
    answer: Sí. Los SUP hinchables más anchos (33 pulgadas o más) ofrecen la estabilidad suficiente para estar de pie y lanzar. Las alfombrillas de cubierta de EVA en toda su longitud aseguran un buen agarre incluso mojadas.
  - question: ¿Es un SUP hinchable adecuado para la pesca?
    answer: Sí. Los SUP hinchables son excelentes plataformas de pesca, sobre todo para pescar en bajos y recorrer aguas poco profundas. Los modelos anchos facilitan el acceso a los aparejos y al equipo.
  - question: ¿Cuánto equipo puedo llevar en un SUP hinchable?
    answer: La mayoría de los SUP hinchables soportan una capacidad total de 220 a 300 libras (el palista más el equipo). Una configuración de pesca típica, con caja de aparejos, nevera y equipo de seguridad, suma de 20 a 40 libras. Revisa el índice de volumen de la tabla para asegurarte de que la capacidad es suficiente.
body: |
  <h2>¿Por qué pescar desde una embarcación hinchable?</h2>
  <p>Los SUP hinchables ofrecen ventajas para los pescadores que los barcos tradicionales no pueden igualar. Su escaso calado permite acceder a aguas a las que no llegan las embarcaciones motorizadas, mientras que la aproximación silenciosa minimiza las molestias a los peces. La portabilidad te permite pescar en lagos, ríos y zonas costeras remotas sin remolque ni rampa de botadura.</p>
  <p>Las ventajas principales son:</p>
  <ul>
    <li><strong>Sigilo</strong> —Sin ruido de motor puedes acercarte a los peces sin espantarlos</li>
    <li><strong>Acceso a aguas poco profundas</strong> —El calado de solo unas pocas pulgadas permite pescar en marismas, arroyos y bajos</li>
    <li><strong>Portabilidad</strong> —Lleva tu embarcación a lugares remotos inaccesibles por barco</li>
    <li><strong>Posición de pie</strong> —Las tablas de SUP permiten estar de pie para ver mejor el agua</li>
  </ul>

  <h2>Requisitos de estabilidad</h2>
  <p>Pescar exige una plataforma estable. Al elegir una embarcación hinchable para pescar, prioriza:</p>
  <ul>
    <li><strong>Ancho</strong> —Las tablas más anchas (33-36 pulgadas) ofrecen una mejor estabilidad para estar de pie y lanzar</li>
    <li><strong>Grosor</strong> —Las tablas de 6 pulgadas ofrecen mayor rigidez y capacidad de carga para el equipo</li>
    <li><strong>Volumen</strong> —Un mayor volumen (300+ litros) soporta el peso combinado del pescador y del equipo</li>
    <li><strong>Superficie de la cubierta</strong> —La alfombrilla de espuma EVA de toda la longitud ofrece una tracción antideslizante cuando está mojada</li>
  </ul>

  <h2>Compatibilidad con el equipo</h2>
  <p>Las configuraciones de pesca hinchables suelen incluir:</p>
  <ul>
    <li><strong>Portacañas</strong> —Portacañas de clip o montados en la cubierta para remar sin usar las manos</li>
    <li><strong>Caja o nevera</strong> —Sujeta a la cubierta con tensores elásticos para el equipo y las capturas</li>
    <li><strong>Sistema de anclaje</strong> —Ancla plegable ligera o estaca de fondeo para mantener la posición en la corriente</li>
    <li><strong>Correa de la pala</strong> —Mantiene la pala sujeta cuando necesitas las dos manos para pescar</li>
    <li><strong>Dispositivo de flotación personal (PFD)</strong> —Equipo de seguridad imprescindible para todo pescador</li>
  </ul>

  <h2>Tipos de embarcación recomendados para la pesca</h2>
  <p>Los distintos escenarios de pesca se adaptan a distintos tipos de embarcación:</p>

  <h3>Tablas de SUP para pescar</h3>
  <p>Perfectas para: pescar en bajos, pesca de lubina en lagos y pesca a la vista en aguas poco profundas. La posición de pie elevada ofrece una visibilidad excelente. Elige una tabla de travesía o polivalente más ancha para ganar estabilidad.</p>

  <h3>Tablas de SUP para pescar</h3>
  <p>Perfectas para: jornadas de pesca en compañía, transportar equipo pesado y aguas costeras protegidas. Los SUP ofrecen espacio en cubierta y capacidad de carga sin perder portabilidad.</p>

  <h2>Consideraciones de seguridad</h2>
  <ul>
    <li>Lleva siempre un PFD —pescar implica estar de pie, lanzar y mover equipo, lo que aumenta el riesgo de caída</li>
    <li>Revisa las condiciones meteorológicas y del agua antes de salir</li>
    <li>Lleva un silbato, el móvil en una funda impermeable y un kit de reparación básico</li>
    <li>Avisa a alguien de dónde pescas y de la hora prevista de regreso</li>
  </ul>

  <h2>FAQ</h2>
  <h3>¿Puedo estar de pie y pescar sobre un SUP hinchable?</h3>
  <p>Sí. Los SUP hinchables más anchos (33 pulgadas o más) ofrecen la estabilidad suficiente para estar de pie y lanzar. Las alfombrillas de cubierta de EVA en toda su longitud ofrecen un agarre seguro cuando están mojadas.</p>

  <h3>¿Cuánto equipo puedo llevar en un SUP hinchable?</h3>
  <p>La mayoría de los SUP hinchables soportan una capacidad total de 220 a 300 libras (palista más equipo). Una configuración de pesca típica, con aparejos, nevera y equipo de seguridad, añade de 20 a 40 libras. Comprueba el índice de volumen de la tabla para asegurar una capacidad adecuada.</p>

