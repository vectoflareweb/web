  headline: 'SUP hinchables para el turismo y la recreación —fabricación OEM de Vectoflare'
  description: 'Vectoflare diseña y fabrica SUP hinchables premium para el turismo y la recreación: tablas de travesía, tablas de pesca y tablas de yoga. Fabricación OEM/ODM con certificación CE. MOQ por tramos: piloto desde 20–50 unidades; volumen estándar desde 90–100+ unidades por rollo de 150 m.'
