answer:
  label: 'Straight answer'
  text: 'QINGDAO VATRAD GROUP.,LTD. controls inflatable SUP quality through a 4-stage verification system: incoming material control (IQC), in-process quality control (IPQC), final board testing and inflation verification (FQC), and packing and pre-shipment release (OQC). Every order is inspected against the approved sample, technical specification, artwork proof, BOM, and packaging standards, with air-tightness verification, visual and dimensional checks, accessory confirmation, and batch traceability. Items failing acceptance criteria are placed under controlled hold or quarantine, reworked only under approved instructions, and re-inspected before authorized release.'
  verified: '2026-08'

intro: 'Our quality system is built for OEM/ODM projects: inspection criteria are defined per order, documented, and followed by production and quality teams from incoming material to packing. This keeps quality expectations aligned between the factory and your brand from the first sample to full container shipments.'

scope_note:
  tagline: Scope
  title: Project-Specific Inspection Criteria
  body: |
    Quality specifications may vary depending on board construction (e.g., single/double layer, woven drop-stitch, fused rail), intended end-use, target market regulations, and customer-approved parameters. Final release authorization is strictly based on the documented inspection criteria agreed upon for the order.

stages:
  tagline: Quality Framework
  title: Our 4-Stage Quality Verification System
  subtitle: A complete QC loop from raw material arrival to shipment release.
  steps:
    - title: '1. Incoming Material Control (IQC)'
      desc: 'Main materials and purchased components are checked against approved specifications and reference samples before entering the production line. Drop-stitch and PVC are verified for material identification, supplier batch, weight/density, thickness, colour match against approved swatches, and surface defects. EVA traction pads are checked for pattern, colour, thickness, cutting accuracy, and adhesive compatibility. Valves and hardware undergo functionality, thread, seal integrity, and fitment tests. Accessories and packaging (pumps, paddles, fins, leashes, bags, cartons) are matched for quantity, colour, branding, barcode accuracy, and artwork version against the approved BOM.'
    - title: '2. In-Process Quality Control (IPQC)'
      desc: 'Critical manufacturing steps are inspected to catch non-conformities before boards move to subsequent workstations. Cutting and printing are verified for panel dimensions, artwork layout, mirror orientation, and edge cleanliness against approved technical drawings. Board assembly and rail bonding are checked for outline symmetry, seam overlap continuity, and elimination of voids or air pockets along high-stress areas. Valve and accessory attachment, graphics, and branding are verified for position, orientation, adhesive coverage, logo spelling, and artwork version.'
    - title: '3. Final Board Testing & Inflation Verification (FQC)'
      desc: 'Completed boards undergo mandatory physical and structural testing before packaging approval. Boards are inflated to the project-approved inspection pressure and held to verify structural rigidity and pressure stability. Air-tightness scans cover the valve housing, rail seams, nose/tail cones, and stress joints using calibrated leak-detection methods (pressure-drop monitoring or bubble testing). Cosmetic and dimensional inspection verifies dimensions, rocker profile, and EVA pad alignment (tolerance ±2 mm) under daylight-standard lighting.'
    - title: '4. Packing & Pre-Shipment Release (OQC)'
      desc: 'Comprehensive pre-shipment verification ensures zero mismatch in SKU configuration or shipping marks. Kit completeness cross-checks board, fin, leash, paddle, pump, bag, repair kit, and user manual against the order BOM. Packaging and barcode checks verify carton marks, SKU labels, barcode readability, manual language, and carton structural integrity. Orders are released only after the final packaging audit is signed off by authorized quality personnel.'

inspection_points:
  tagline: Inspection Coverage
  title: Key Inspection Control Points
  subtitle: Every checkpoint is executed against documented acceptance criteria agreed per order.
  features:
    - icon: A
      icon_bg: blue
      title: Air-Tightness Verification
      desc: 'Completed boards are inflated to the approved inspection pressure and checked for pressure retention, valve base condition, rail seams, nose and tail areas, and high-stress locations. Where required by the inspection procedure, suspected leakage areas are examined with approved leak-detection methods.'
    - icon: B
      icon_bg: green
      title: Visual & Dimensional Inspection
      desc: 'Boards are inspected under suitable lighting for material surface condition, printing defects, colour variation, EVA alignment, wrinkles, scratches, contamination, and bonding appearance. Key dimensions and accessory positions are verified against approved drawings or specifications.'
    - icon: C
      icon_bg: purple
      title: Accessory & Packaging Verification
      desc: 'The complete product configuration is verified before shipment: board model, fin system, paddle, pump, leash, carry bag, repair kit, user manual, and customer-specific accessories —each matched to the approved sample, drawings, and BOM.'
    - icon: D
      icon_bg: orange
      title: Packing & Shipment Release
      desc: 'Packed units are checked for SKU configuration, accessory completeness, product labels, barcode information, instruction manual version, carton marking, packing quantity, and carton condition. Shipment release is authorized only after all inspection and packing requirements are completed.'

traceability_intro:
  tagline: Batch Traceability
  title: Project-Level & Batch Traceability System
  body: |
    Every custom SUP order is managed under a unified project code linking technical specifications, the approved BOM, artwork revisions, material lot numbers, packing references, and inspection records. Production and inspection records are maintained by the applicable project and production batch, and each batch can be linked back to the approved product specification, BOM, artwork, and packing references.

    This supports efficient review of product configuration, inspection status, and affected scope if a quality concern is identified —from finished product back to source records using the board or carton identification.

traceability_chain:
  tagline: Traceability Chain
  title: From Project Code to Shipment Release
  subtitle: One chain of controlled references from order confirmation to authorized dispatch.
  steps:
    - step: '01'
      title: Project Code
      desc: Unified project reference that links every controlled document to the order.
    - step: '02'
      title: Document Revisions
      desc: Current spec, BOM, artwork, and packing revision levels —only approved versions are valid for production.
    - step: '03'
      title: Batch & Materials
      desc: Material and component lots recorded against the production batch.
    - step: '04'
      title: Inspection Records
      desc: IQC, in-process, air-tightness, final, and packing inspection results per batch.
    - step: '05'
      title: Packing & Release
      desc: Packing batch, NCR closure status, and authorized shipment release summary.

