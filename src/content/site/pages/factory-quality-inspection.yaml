faqs:
  tagline: FAQ
  title: Frequently Asked Questions About SUP Quality Control
  items:
    - q: 'How does QINGDAO VATRAD GROUP.,LTD. control inflatable SUP board quality?'
      a: 'Quality is controlled through incoming material inspection, production process checkpoints, final product verification, packing inspection, and production traceability —each executed against project-approved samples, specifications, and inspection criteria.'
    - q: 'What quality inspections are performed during SUP production?'
      a: 'Inspections include material verification, cutting and printing checks, board construction inspection, valve installation verification, accessory inspection, air-tightness testing, appearance inspection, and packing verification.'
    - q: 'Can OEM customers request SUP inspection records?'
      a: 'Yes. Inspection records and quality documentation can be provided according to project requirements and customer quality agreements, including sample pre-shipment inspection reports.'
    - q: 'How does the factory ensure OEM production consistency?'
      a: 'Production consistency is maintained through approved samples, technical specifications, manufacturing checkpoints, inspection procedures, and documented quality control processes linked to each order.'
    - q: 'Can I arrange third-party inspection by SGS, BV, Intertek, or QIMA?'
      a: 'Yes. We host third-party inspectors with a dedicated inspection area, calibrated pressure gauges, pre-filled inspection briefs, and accessible records. Share your specification, approved sample, artwork, packaging requirements, and defect criteria —or use our Third-Party Inspection Brief template.'
    - q: 'How are artwork, BOM, or packaging changes handled during production?'
      a: 'Changes are logged in our Change Control Log with the affected document revision, change summary, reason, impact assessment, customer approval status, and effective batch. Obsolete versions are withdrawn so production and inspection always use the current approved documents.'
    - q: 'Does the factory support customized inflatable SUP projects?'
      a: 'Yes. Customized inflatable SUP OEM/ODM projects are supported based on customer specifications, artwork requirements, accessory configurations, and packaging needs, with project-specific inspection criteria agreed before production.'
    - q: 'Can a leaking SUP board be reworked at the factory?'
      a: 'Yes —under controlled conditions. The board is placed on HOLD and linked to an NCR, the leak is located with an approved diagnostic method, and rework proceeds only after QC/Engineering authorization and only within the defect classes approved for rework. The board is then re-inspected against the same acceptance criteria as a conforming board before release.'
    - q: 'How many times can the factory rework a board?'
      a: 'A single location may be reworked once under an authorized instruction. If re-inspection still fails, the board is escalated for replacement, rejection, scrap, or customer concession —repeated rework without documented approval is not permitted.'

