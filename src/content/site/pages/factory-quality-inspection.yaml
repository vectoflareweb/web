rework_intro:
  tagline: Rework Governance
  title: Controlled Air-Tightness Non-Conformance & Rework Governance
  body: |
    At QINGDAO VATRAD GROUP.,LTD., rework is defined strictly as restoring a non-conforming unit to full compliance with its original engineering specification — not as a quick fix. Any board identified with an air-tightness non-conformance is placed on controlled hold and linked to a Non-Conformance Report (NCR) before further processing; the leak source is located and recorded using the approved diagnostic method.

    Rework may proceed only when the defect is within the approved rework scope and an authorized method is available. The rework instruction identifies the product, batch, defect location, approved material, method, required conditions and re-inspection scope. After the required cure or stabilization period, the board is re-inspected against the same applicable acceptance criteria as a conforming board — rework never reduces the acceptance standard. Failure of re-inspection requires renewed engineering and quality disposition; repeated rework is not permitted without documented approval.

rework_decision:
  tagline: Interactive Flow
  title: Rework Decision Flow — Click Any Node
  subtitle: Follow how an air-tightness non-conformance is handled from detection to release or scrap. Click a node to expand the control requirements at that step.
  nodes:
    - id: detect
      type: start
      label: Leak Detected
      detail: 'An air-tightness non-conformance is identified during inspection — pressure-retention failure, visible leakage or a related air-system defect.'
    - id: hold
      type: step
      label: Stop Line · HOLD Label · NCR
      detail: 'Processing stops. Board ID, product code, batch, workstation, date and inspector are recorded; a HOLD / QUARANTINE label is attached and an NCR is opened against the applicable specification revision.'
    - id: locate
      type: step
      label: Locate Leak Source
      detail: 'The board is inflated to the project-approved diagnostic pressure and the source is located with an approved method — pressure retention, calibrated bubble testing, acoustic or leak-detection equipment.'
    - id: classify
      type: step
      label: Classify Defect (A–G)
      detail: 'The defect is classified against the approval matrix: A valve interface, B valve base seam, C surface pin-hole, D local rail seam, E large rail failure, F recurring leakage, G structural damage.'
    - id: authorize
      type: decision
      label: Rework Authorized?
      yes: rework
      no: escalate
      detail: 'QC confirms the defect category and Engineering reviews whether the board can be restored to its original specification. The authorization records the method card, materials, conditions and re-inspection scope — or routes to replacement, rejection, scrap or customer concession.'
    - id: rework
      type: step
      label: Controlled Rework
      detail: 'Executed only within the approved defect boundary using the approved method card, material batch and tooling — never altering dimensions, construction, graphics, accessories or packing requirements.'
    - id: cure
      type: step
      label: Cure & Stabilization
      detail: 'The board remains on HOLD through the cure and stabilization period defined by the approved material and process instruction, then receives a visual and workmanship pre-check.'
    - id: reinspect
      type: decision
      label: Re-Inspection Passed?
      yes: release
      no: escalate
      detail: 'The board is inflated to the project-approved re-inspection pressure and the original failure plus all potentially affected characteristics are re-verified — leak location, valve, rails, seams, high-stress areas, accessories and appearance. Rework never reduces the acceptance standard.'
    - id: release
      type: release
      label: Quality Release
      detail: 'Quality reviews the closed NCR, rework record and re-inspection result and authorizes release. No reworked board is packed or shipped without authorized quality release.'
    - id: escalate
      type: escalate
      label: Escalate — Replace / Scrap / Concession
      detail: 'No repeat rework without documented approval. The board routes to replacement, rejection, scrap, or a written customer concession where the original specification cannot be restored.'

defect_matrix:
  tagline: Defect Classification
  title: Air-Tightness Defect Classification & Approval Matrix
  subtitle: Not every leak is reworked — each defect is classified and its disposition approved at the right level, from QC inspector up to plant manager.
  headers:
    category: Defect Category
    area: Typical Area
    eligibility: Rework Eligibility
    approval: Required Approval
  rows:
    - category: 'Class A — Valve Interface'
      area: 'Valve core, cap seal, gasket, pump interface'
      eligibility: 'Standard rework authorized'
      approval: 'QC Inspector'
    - category: 'Class B — Valve Base Seam'
      area: 'Micro-leakage along the valve rim'
      eligibility: 'Evaluated rework per the approved method card'
      approval: 'QC + Engineering'
    - category: 'Class C — Surface Pin-Hole'
      area: 'Local micro pin-hole on a non-stress surface'
      eligibility: 'Authorized only when compliant with client specifications'
      approval: 'QC + Engineering'
    - category: 'Class D — Local Rail Seam'
      area: 'Local overlap leakage on the rail band'
      eligibility: 'High risk; strict engineering disposition required'
      approval: 'Engineering + QA Head'
    - category: 'Class E — Large Rail Failure'
      area: 'Continuous seam failure in high-stress zones'
      eligibility: 'Standard rework not authorized — replacement or root-cause review'
      approval: 'QA Head + Customer Concession'
    - category: 'Class F — Recurring Leakage'
      area: 'Non-locatable leak or re-test failure'
      eligibility: 'No repeat rework; replacement, scrap or engineering root-cause analysis'
      approval: 'Lead QA / Engineering'
    - category: 'Class G — Structural Damage'
      area: 'Material damage, delamination, board deformation'
      eligibility: 'Rework release not authorized — replacement, scrap or written customer concession'
      approval: 'Quality Manager + Customer Approval'

rework_flow:
  tagline: 7-Step Closed-Loop
  title: Controlled Rework Workflow — From Detection to Release or Scrap
  subtitle: 'Every air-tightness rework follows the same controlled loop: detect, quarantine, diagnose, authorize, rework, re-inspect, release.'
  steps:
    - step: '01'
      title: Detection, Stop-Line & Quarantine
      desc: 'Processing stops immediately on the affected board. Board ID, product code, batch, workstation, date and inspector are recorded, a HOLD / QUARANTINE label is attached, and an NCR is opened against the applicable specification revision.'
    - step: '02'
      title: Systematic Leak Diagnosis
      desc: 'The board is inflated to the project-approved diagnostic pressure and the leak source is located with an approved method —pressure retention, calibrated bubble testing, acoustic or leak-detection equipment. The suspected location is marked without damaging the board.'
    - step: '03'
      title: Engineering Disposition & Authorization
      desc: 'QC confirms the defect category and Engineering reviews whether the board can be restored to its original specification. A rework authorization referencing the NCR records the approved method, materials, conditions and re-inspection scope —or assigns replacement, rejection, scrap or customer concession.'
    - step: '04'
      title: Controlled Rework Execution
      desc: 'Rework is executed only within the approved defect boundary, using the approved method card, material batch and tooling. Board dimensions, construction, graphics, accessory configuration and packing requirements are never altered.'
    - step: '05'
      title: Cure Stabilization & Pre-Check
      desc: 'The reworked board remains in HOLD status through the cure and stabilization period defined by the approved material and process instruction, then receives a visual and workmanship pre-check before re-inspection.'
    - step: '06'
      title: Re-Inspection & Proof Testing
      desc: 'The board is inflated to the project-approved re-inspection pressure and the original failure plus all potentially affected characteristics are re-verified: the leak location and surrounding area, valve, rails, seams, high-stress areas, accessories and appearance. Rework never reduces the acceptance standard.'
    - step: '07'
      title: QA Release or Final Disposition
      desc: 'Quality reviews the completed NCR, rework record and re-inspection result, then authorizes release —or escalates to replacement, rejection, scrap or customer concession. No reworked board is packed or shipped without authorized quality release.'

quality_safeguards:
  tagline: Quality Safeguards
  title: Anti-Error Rules That Protect Your Brand
  subtitle: Hard controls that prevent uncontrolled repair loops —one documented rework per defect, batch-level alert thresholds, calibrated instrumentation and controlled test conditions.
  features:
    - icon: 1
      icon_bg: blue
      title: One Rework Per Defect
      desc: 'A single location may be reworked once under an authorized instruction. If re-inspection still fails, the board is escalated for replacement, rejection, scrap or customer concession —repeated rework without documented approval is not permitted.'
    - icon: 2
      icon_bg: green
      title: Batch Alert & Line-Stop
      desc: 'When non-conformance in a production batch exceeds the engineering-set threshold, the line is stopped and Engineering investigates the cause —material lot, process conditions and records —before production resumes.'
    - icon: 3
      icon_bg: purple
      title: Calibrated Instrumentation
      desc: 'Pressure gauges, digital manometers and timers used for air-tightness testing are controlled and calibrated by third-party laboratories within their validity period, with calibration status visible in the inspection area.'
    - icon: 4
      icon_bg: orange
      title: Controlled Test Conditions
      desc: 'Air-tightness testing and cure areas are kept in a controlled environment so results are not affected by temperature swings between day and night.'

rework_boundaries:
  tagline: Scope & Boundaries
  title: What This System Does Not Cover
  body: |
    The rework control system applies to completed or in-process inflatable SUP boards identified with air leakage, pressure-retention failure or related air-system defects before shipment release. It does not authorize changes to approved construction, materials, graphics, product configuration or customer requirements, and it does not cover:

    - Products already shipped or in customer channels.
    - Structural damage or board deformation not assessed by Engineering.
    - Widespread rail or seam failure, core material damage, or defects that may affect safety.
    - Projects where rework is not permitted: customer-approved samples, certification or test units.
    - Projects with proprietary customer processes, special materials or special repair requirements.
    - Recurring leakage that cannot be located, or boards failing again after rework.

    Any deviation from customer specifications requires documented engineering review and, where applicable, written customer approval. Boards that cannot be restored to their original specification are only released under an explicit customer concession —never by production alone.

method_cards:
  tagline: Method Card System
  title: Controlled Rework Method Card Index
  subtitle: 'The general instruction controls the process; method cards control the operation. The rework instruction (WI-QC-AT-001) references method cards MC-RW-01 to MC-RW-06, plus MC-RW-00 for mandatory scrap and reject.'
  headers:
    code: Method Card
    defect: Defect Class
    scope: Application Scope
    controls: Key Engineering Controls
    approval: Sign-off Authority
  rows:
    - code: MC-RW-01
      defect: Class A (Valve Interface)
      scope: 'Valve core service, seal cleaning and re-assembly'
      controls: 'Calibrated torque wrench, clean gasket seat, no damage to valve threads'
      approval: 'QC Inspector'
    - code: MC-RW-02
      defect: Class B (Valve Perimeter)
      scope: 'Valve base flange sealing and controlled clamping'
      controls: 'Controlled surface preparation, approved bonding material, circular pressure fixture'
      approval: 'QC + Engineering'
    - code: MC-RW-03
      defect: Class C (Surface Micro-Leak)
      scope: 'Non-structural pin-hole sealing'
      controls: 'Two-component approved adhesive, no run-off into graphics or EVA'
      approval: 'QC + Engineering'
    - code: MC-RW-04
      defect: Class D (Local Rail Seam)
      scope: 'Local rail overlap seam re-bonding'
      controls: 'Temperature-controlled heat activation, pressure roller, anti-curling fixture'
      approval: 'Engineering + QA Head'
    - code: MC-RW-05
      defect: Class B/C (Accessory Rim)
      scope: 'Fin box patch and accessory mounting base sealing'
      controls: 'Surface adhesion promoter, profiled clamping block, defined hold period'
      approval: 'QC + Engineering'
    - code: MC-RW-06
      defect: Class D (Nose/Tail Seam)
      scope: 'High-stress curvature seam intervention'
      controls: 'High-shear approved bonding material, extended cure period before re-test'
      approval: 'Chief Engineer'
    - code: MC-RW-00
      defect: Class E/F/G (Critical / Rupture)
      scope: 'Mandatory scrap and physical destruction'
      controls: 'Physical cut-off to prevent mix-out, scrap record, cross-department root-cause review'
      approval: 'Plant Manager'

inspector_friendly:
  tagline: Third-Party Inspection
  title: Inspector-Friendly Protocol
  body: |
    We provide a dedicated inspection area with calibrated pressure gauges, standardized light tables for seam and graphic checks, and pre-filled Inspection Briefs so third-party agencies (SGS, BV, Intertek, QIMA) can complete pre-shipment inspection efficiently —saving your inspection overhead.

    Each brief summarizes the applicable document revisions, approved sample reference, critical-to-quality checks, agreed sampling level, functional tests, and packaging and barcode requirements for the PO. Specified quantities, quality, packing, and basic safety items are verified against the approved project references —no last-minute document hunting on site.

