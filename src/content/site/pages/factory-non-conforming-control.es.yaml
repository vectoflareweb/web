nc_intro:
  tagline: Control de productos no conformes
  title: Qué ocurre cuando un producto no cumple los criterios
  body: |
    Los productos o componentes que no cumplen los criterios de aceptación definidos se identifican y controlan para evitar su uso no intencionado, el procesamiento posterior o su envío. Los criterios de aceptación aplicables se basan en la muestra aprobada, la especificación técnica, el arte, la lista de materiales, los requisitos de embalaje y el plan de inspección del proyecto.

    Los artículos no conformes se evalúan para determinar el alcance afectado y la disposición adecuada. Según el problema, el artículo puede retenerse, retrabajarse bajo instrucciones controladas, reemplazarse, rechazarse o gestionarse mediante un proceso aprobado. Los artículos retrabajados o corregidos se reinspeccionan antes de su liberación. La liberación del envío solo se permite cuando los registros de calidad pertinentes están completos y el producto cumple los criterios de aceptación aplicables.

nc_flow:
  tagline: Bucle cerrado estándar de 7 pasos
  title: De la identificación a la acción correctiva
  subtitle: 'Un bucle controlado para cada no conformidad: identificar, poner en cuarentena, revisar, retrabajar o reemplazar, reinspeccionar, liberar o rechazar, mejorar.'
  steps:
    - step: '01'
      title: Identificar
      desc: 'Toda no conformidad identificada se registra contra el producto, lote o componente afectado y se evalúa contra los requisitos del proyecto aplicables. La detección puede ocurrir en el material entrante, el control en proceso, los ensayos finales, el embalaje o la inspección del cliente o de terceros.'
    - step: '02'
      title: Cuarentena
      desc: 'Los artículos se identifican claramente y se colocan bajo retención o cuarentena controlada para evitar su uso no intencionado, procesamiento posterior o envío. Las etiquetas HOLD / QUARANTINE / REJECTED llevan el número NCR, SKU, lote, cantidad, descripción del defecto y fecha.'
    - step: '03'
      title: Revisión
      desc: 'Se evalúan el alcance afectado y la disposición adecuada: unidad individual, lote de turno, lote completo o varios lotes — entre lotes de materiales compartidos, revisiones de arte, etapas de proceso y revisiones documentales. Se aplican contención adicional o inspección intensificada cuando se requiere.'
    - step: '04'
      title: Retrabajo o reemplazo
      desc: 'El retrabajo permitido sigue instrucciones aprobadas que identifican el artículo afectado, el método, los materiales, los puntos de inspección y los requisitos de reinspección. Nunca se permiten cambios no aprobados en la especificación del producto, el arte, la configuración de accesorios o el embalaje. Los artículos de reemplazo vuelven a pasar por las compuertas de inspección aplicables.'
    - step: '05'
      title: Reinspección
      desc: 'Los artículos retrabajados o corregidos se reinspeccionan contra los criterios de aceptación aplicables. La característica fallada original y cualquier característica relacionada potencialmente afectada por el retrabajo se verifican antes de la liberación — por QC independiente, y con un ciclo completo nuevo de prueba de presión de 24h para las reparaciones de estanqueidad.'
    - step: '06'
      title: Liberar o rechazar
      desc: 'El producto se libera solo tras completar la reinspección requerida y que personal de calidad autorizado confirme la conformidad con los requisitos del proyecto aplicables. Los artículos que no pueden alcanzar la conformidad se rechazan, reemplazan, devuelven o reciben una disposición bajo procedimientos controlados — incluida la destrucción física presenciada.'
    - step: '07'
      title: Acción correctiva
      desc: 'Las no conformidades repetidas, significativas o sistémicas se revisan para determinar la causa raíz y la acción correctiva (CAPA). Las mejoras pueden incluir actualizaciones de instrucciones de trabajo, controles de materiales, puntos de inspección, formación, gestión de proveedores o control documental.'

nc_pillars:
  tagline: Pilares de confianza del comprador
  title: Tres controles que protegen su marca
  subtitle: 'El proceso está diseñado en torno a las preguntas que realmente hacen los compradores internacionales: ¿se ocultarán los problemas, se descontrolará el retrabajo y se volverán a verificar las tablas reparadas?'
  features:
    - icon: 1
      icon_bg: blue
      title: Solo instrucciones controladas
      desc: 'El retrabajo se rige estrictamente por instrucciones de retrabajo estándar (SRI) autorizadas. Las alteraciones de campo no aprobadas, el cambio de especificaciones o la modificación de arte sin autorización escrita están terminantemente prohibidos.'
    - icon: 2
      icon_bg: green
      title: Reinspección independiente
      desc: 'Las tablas retrabajadas reciben reinspección al 100% por inspectores de QA contra los criterios de aceptación originales. Las reparaciones de estanqueidad requieren un ciclo completo nuevo de prueba de presión de 24h — nunca una verificación parcial.'
    - icon: 3
      icon_bg: purple
      title: Firma autorizada y trazabilidad
      desc: 'La liberación del envío solo se permite tras la documentación NCR completa y la firma autorizada de QC, pasando el estado del lote de HOLD a RELEASED. Las desviaciones sistémicas o repetidas activan automáticamente flujos de trabajo CAPA de causa raíz.'

