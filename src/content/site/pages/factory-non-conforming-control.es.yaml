faqs:
  tagline: FAQ
  title: FAQ sobre calidad y control de defectos para compradores globales
  items:
    - q: '¿Cómo garantizan que las tablas retrabajadas cumplen todos los estándares de seguridad?'
      a: 'Toda tabla retrabajada se trata como una unidad nueva y debe completar el mismo ciclo completo de ensayos desde cero — para reparaciones de estanqueidad, una prueba de presión completa de 24h. Los inspectores de QC independientes, no los operadores del retrabajo, realizan la validación de liberación.'
    - q: '¿Enviará la fábrica tablas con desviaciones cosméticas menores sin avisarnos?'
      a: 'Nunca. Cualquier desviación que afecte a las muestras doradas aprobadas por el cliente, el arte del logo, las gamas de color o el embalaje requiere un acuerdo de concesión formal por escrito firmado por el cliente antes de la liberación del envío.'
    - q: '¿Qué ocurre si una tabla retrabajada falla la reinspección?'
      a: 'La tabla no se libera. Vuelve a una nueva revisión de disposición y, si no puede alcanzar la conformidad, se reemplaza, rechaza o destruye bajo el protocolo de desguace presenciado. El fallo repetido de la misma clase de defecto activa un CAPA de causa raíz.'
    - q: '¿Pueden venderse las tablas fallidas como segundas marcas de fábrica o por otros canales?'
      a: 'No. Las tablas fuera de especificación no retrabajables se destruyen físicamente bajo el protocolo de desguace presenciado — herrajes cortados, núcleo y raíles seccionados, video grabado con hash SHA-256 y archivado durante al menos 5 años. El certificado de destrucción lo firman el Director de QA y el Gerente de Planta.'
    - q: '¿Cómo se evalúa el alcance afectado cuando se encuentra un defecto?'
      a: 'El alcance se revisa por identificación de producto, lote de producción, lote de material o componente, etapa de proceso y revisión documental aplicable. Si están implicados el mismo lote de material, revisión de arte o puesto de trabajo, los productos afectados se contienen y verifican en consecuencia.'
    - q: '¿Necesitan nuestra aprobación antes de realizar una concesión?'
      a: 'Sí. Cualquier aceptación bajo una concesión documentada que afecte a los requisitos del cliente — muestras aprobadas, especificación, arte, embalaje o criterios de aceptación — requiere la aprobación escrita del cliente antes de la liberación. Sin ella, el producto se retrabaja según el requisito original, se reemplaza o se rechaza.'
    - q: '¿Qué documentación recibimos por una no conformidad?'
      a: 'El registro NCR cubre el número NCR, la etapa de detección, el producto/SKU, el lote, las revisiones documentales aplicables, la descripción del defecto, la contención, la disposición, la referencia de la instrucción de retrabajo, el resultado de la reinspección y la aprobación de liberación o cierre — disponible según el acuerdo de calidad de su proyecto.'

