nc_severity:
  tagline: Gravedad del defecto y autoridad
  title: Clasificación de gravedad y autoridad de disposición
  subtitle: No toda no conformidad se gestiona al mismo nivel — la autoridad de disposición escala con la gravedad del defecto, desde la firma a nivel de línea hasta el comité de revisión de materiales y la concesión del cliente.
  headers:
    severity: Gravedad
    examples: Ejemplos típicos
    authority: Autoridad de disposición y control
    control: Condición de liberación
  rows:
    - severity: 'Menor'
      examples: 'Esquina de caja arrugada, desalineación leve de accesorios no críticos'
      authority: 'Firma en sitio del líder de QC de sección + supervisor de línea, reemplazo o liberación'
      control: 'Registrado en el NCR; sin impacto en la función del producto ni en los requisitos del cliente'
    - severity: 'Mayor'
      examples: 'Fuga lenta de válvula, desalineación de EVA fuera de tolerancia (>2 mm), accesorio faltante'
      authority: 'El Gerente de Calidad + el Ingeniero Técnico emiten una instrucción de retrabajo controlada (SRI)'
      control: 'Re-ensayo independiente al 100% de la característica fallada original y las afectadas antes de la liberación'
    - severity: 'Crítico'
      examples: 'Daño de la cámara drop-stitch, burbuja o grieta de raíl a alta presión, logo del cliente mal impreso o desviación de color'
      authority: 'Decisión del comité de revisión de materiales (MRB); concesión escrita del cliente cuando corresponde'
      control: 'Sin liberación sin concesión autorizada; si no, destrucción física presenciada obligatoria'

nc_matrix:
  tagline: Matriz de protocolo de ingeniería
  title: Matriz de disposición de defectos y reinspección de SUP
  subtitle: Protocolos de ingeniería estándar aplicados a las desviaciones de fabricación más comunes — los mismos parámetros cuantificados que los clientes pueden verificar durante las auditorías.
  headers:
    defect: Categoría de defecto
    protocol: Protocolo de disposición controlada
    validation: Reinspección y validación independientes
  rows:
    - defect: 'Fuga lenta de válvula'
      protocol: 'Aislar la tabla. Desmontar el núcleo de válvula con herramienta de par calibrada (25 N·m), limpiar las roscas internas, sustituir la junta tórica de silicona y reapretar.'
      validation: 'Sumergir en solución de burbujas; re-inflar a 18 PSI para un re-ensayo completo de caída de presión de 24h (ΔP ≤ 0,05 PSI).'
    - defect: 'Burbujas de aire en la costura del raíl'
      protocol: 'Poner en cuarentena el lote de turno. Delaminar la zona de burbujas con boquilla de asistencia térmica, limpiar la superficie con solvente, aplicar adhesivo PU de dos componentes a 5 bar de presión.'
      validation: 'Inspección visual y táctil al 100% de la costura; prueba de presión estructural de comprobación (18,0 PSI) más retención de estanqueidad de 24h.'
    - defect: 'Desalineación de la almohadilla EVA'
      protocol: 'Pelado con asistencia térmica con herramienta regulada en temperatura (80°C). Re-alineación con plantilla acrílica de precisión.'
      validation: 'Verificación de tolerancia de holgura (≤ ±1,5 mm), comprobación de simetría del patrón de rombos y ensayo de adhesión del borde al 100%.'
    - defect: 'Error de marca / logo'
      protocol: 'Parada inmediata de la línea de impresión. Retener todos los paneles impresos. Revisar la revisión vectorial con el cliente; cero alteraciones no aprobadas.'
      validation: 'Comprobación de color con espectrofotómetro (ΔE ≤ 1,5); verificación visual al 100% de la alineación del texto contra el PDF vectorial maestro firmado por el cliente.'
    - defect: 'Desajuste de embalaje / SKU faltante'
      protocol: 'Poner en cuarentena el palé de exportación. Desembalar y realizar una comprobación BOM al 100% por artículo (bomba, aleta, correa, pala, tubo de reparación).'
      validation: 'Validación dinámica en línea con pesadora electrónica (±30 g de variación); verificación con escáner óptico de código de barras 2D.'

nc_scrap:
  tagline: Cero fugas al mercado
  title: Destrucción presenciada y desguace — protocolo antidivertido de cero defectos
  body: |
    Los socios de marca internacionales necesitan certeza de que las tablas fallidas nunca llegarán a la venta minorista secundaria, a mercados grises o a canales de comercio electrónico. Las tablas que no pueden alcanzar la conformidad se destruyen bajo un protocolo presenciado y registrado:

    **1. Corte de herrajes y accesorios.** Bajo supervisión del Director de QA, una cizalla hidráulica retira todos los anillos en D de acero inoxidable 316, las cintas de asa y las hebillas de equipaje. El conjunto de válvula de inflado y la base del encaje de aleta (US-Box / aleta snap-in) se cortan en la raíz de la tabla, eliminando cualquier componente aprovechable.

    **2. Corte del drop-stitch y seccionado del raíl.** El núcleo interno drop-stitch se corta transversalmente por tabla y cubierta con cortes profundos en cruz (≥ 50 cm por corte), y los raíles laterales reforzados se seccionan en al menos 4 segmentos — destruyendo permanentemente la capacidad de sellado y la flotabilidad.

    **3. Bóveda de video y fotos.** La destrucción se graba como video 1080p sin cortes con primeros planos del código de barras de serie, el proceso de corte, el ranurado del núcleo y la pila final de residuos pesada. El video se somete a hash (SHA-256) y se archiva en un servidor controlado durante ≥ 5 años.

    **4. Eliminación certificada de residuos.** Todos los fragmentos de PVC y drop-stitch se pesan, se registran en el libro de salida y se transportan solo por socios cualificados de reciclaje de polímeros — ningún residuo sale de la planta por otro canal.

    > **Garantía de protección de marca:** QINGDAO VATRAD GROUP CO., LTD. garantiza la destrucción al 100% de las embarcaciones fuera de especificación no retrabajables. Cero segundas marcas de fábrica o tablas comprometidas entrarán jamás en la venta minorista secundaria, mercados grises o canales de comercio electrónico. El certificado de destrucción (VAT-QA-SCRAP-CERT-2026) registra el producto, el lote, la conclusión del MRB, las fotos de testigo y la doble firma del Director de QA y el Gerente de Planta.

