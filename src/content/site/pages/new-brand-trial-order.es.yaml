hero:
  tagline: 'Para Marcas de SUP Nuevas y en Crecimiento'
  title: 'Lanza Tu Marca de SUP con un Pedido de Prueba de Bajo MOQ'
  subtitle: 'No necesitas un contenedor para empezar una marca de SUP. Valida tu tabla, tus gráficos y tu mercado con una sola muestra, y luego prueba la rotación real con un pedido de prueba de 20–50 tablas — antes de comprometerte con volúmenes de producción completos. El branding, el control de calidad y la logística de exportación los gestiona Qingdao Vatrad Group Co., Ltd.'
  actions:
    - variant: primary
      text: Empieza Tu Lanzamiento con una Muestra
      href: /es/contact#custom-oem
    - text: Consulta el marco completo de MOQ y plazos
