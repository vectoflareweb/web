cc_pokayoke:
  tagline: Anti-Error Safeguards
  title: 'Poka-Yoke: Hard Blocks That Stop Uncontrolled Change'
  subtitle: The standard is enforced not only by procedures but by physical and system-level blocks that make uncontrolled changes impossible to execute.
  features:
    - icon: 1
      icon_bg: blue
      title: ECR Gate for Tooling Unlock
      desc: 'Rework stations read a QA-signed ECR barcode before pneumatic inflation valves and glue mixers unlock. No approved change control record, no supply — retroactive sign-off ("change first, sign later") is physically blocked.'
    - icon: 2
      icon_bg: green
      title: Temporary Deviation Auto-Expiry
      desc: 'Temporary deviations are hard-capped in the system (for example a maximum of 50 boards or 7 calendar days). Reaching the cap locks the batch and blocks printing of the shipment pass tag until the change is formally assessed.'
    - icon: 3
      icon_bg: purple
      title: Minimum Validation Evidence
      desc: 'High-risk changes require at least 5 representative sample boards covering the upper and lower tolerance limits, fully inspected by 2 independent QC inspectors, before a validation report can be issued — one repaired board is never treated as process validation.'
    - icon: 4
      icon_bg: orange
      title: 1-In-1-Out Document Control
      desc: 'Obsolete work-station cards are physically collected and cancelled (hole-punched) before the new card stamped with the controlled red seal is issued — old and new versions never share a workstation.'

