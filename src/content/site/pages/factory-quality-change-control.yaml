cc_validation:
  tagline: Engineering Validation
  title: Validation & Acceptance Protocol — Evidence Over Statements
  body: |
    Vague acceptance wording such as *"the repaired board must be good"* is not accepted. The controlled wording is:

    > "The reworked sample shall meet the same applicable air-tightness, visual workmanship, valve-function and project-specific acceptance criteria as a conforming board, unless a customer-approved deviation specifically defines an alternative criterion."

    Validation evidence is quantitative, and the engineering baseline for air-tightness rework includes:

    - **Leak elimination & pressure hold.** The original leak is removed with no sustained bubbles in soap-water leak detection; the board holds at the standard test pressure of 18.0 PSI for 24 hours, with net pressure drop ΔP ≤ 0.2 PSI after temperature/humidity compensation.
    - **Valve function.** Valve core torque meets the 15–20 N·m specification, with no micro-leak at the seal under high-pressure inflation and dynamic pressing.
    - **Seam bonding & durability.** Bond edges show no lifting, whitening or delamination; after heat-humidity aging cycles the adhesive layer shows no softening or brittle cracking.
    - **Appearance & workmanship.** No adhesive run-off marks, no EVA damage, no board distortion, and no logo shift or printed-surface scratches.

cc_engineering:
  tagline: Engineering Execution Matrix
  title: Quantified Parameters for the Four Core Rework Processes
  subtitle: 'Each controlled rework process carries defined parameters, methodology and acceptance criteria — the same numbers our operators follow and our customers can verify during audits.'
  headers:
    process: Rework Process
    parameters: Controlled Parameters
    methodology: Test Methodology
    acceptance: Acceptance Criteria
  rows:
    - process: 'Pinhole / Micro-Leak Patch Repair'
      parameters: 'Solvent clean & dry 3–5 min; hot-air activation 60°C ± 5°C; press roller ≥ 0.4 MPa'
      methodology: 'Inflate to 18 PSI; full water immersion or soap application; observe for 10 minutes'
      acceptance: 'Zero bubble emission; 180° edge peel with no lifting and no adhesive run-off marks'
    - process: 'Rail Band / Seam Re-Bonding'
      parameters: 'Two-component adhesive ratio strictly controlled; environment 22–28°C, ≤ 65% RH; fixture clamp ≥ 4 h'
      methodology: '22 PSI over-pressure test for 2 h; then 50°C heat-box bake 6 h and 2 h room-temperature rest'
      acceptance: 'Zero separation, zero cracking; net pressure drop ΔP ≤ 0.1 PSI; adhesive layer without whitening or embrittlement'
    - process: 'Valve Base Loosening / Micro-Leak'
      parameters: 'Dedicated wrench torque 18–20 N·m; seal gasket flat without distortion; thread cleanliness confirmed'
      methodology: 'Inflate to 15 PSI; 20 inflation/deflation cycles; underwater immersion observation'
      acceptance: 'Zero bubbles at valve core and base periphery; torque after cycling ≥ 16 N·m'
    - process: 'Final 24h Pressure-Hold Test'
      parameters: 'Reference inflation 18.0 PSI; digital gauge Class 1.0 / ±0.5%; ambient temperature & humidity recorded and compensated'
      methodology: 'Digital pressure recorder; continuous 24 h pressure curve'
      acceptance: 'Net pressure drop ΔP ≤ 0.20 PSI / 24 h after compensation; no board bulging or deformation'

