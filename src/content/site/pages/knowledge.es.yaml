    - title: 'Habilidades y técnicas de SUP'
      description: 'Técnicas de paleo, habilidades de travesía y entrenamiento físico para todos los niveles.'
      icon: 'tabler:waves'
      topics:
        - 'Técnicas de paleo para principiantes'
        - 'Dominio de la brazada intermedia'
        - 'Planificación de travesías y expediciones'
        - 'Entrenamiento de fitness y competición en SUP'
