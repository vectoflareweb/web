hero:
  tagline: 'Gráfico de conocimiento'
  title: 'Conocimiento para explorar el agua'
  subtitle: |
    Una base de conocimiento estructurada que cubre la tecnología del SUP hinchable,
    la seguridad en el agua, la ingeniería de embarcaciones y la planificación de aventuras.
  taglineSection: 'Explora. Aprende. Navega con confianza.'

clusters:
  tagline: 'Grupos de conocimiento'
