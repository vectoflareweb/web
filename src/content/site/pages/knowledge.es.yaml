      topics:
        - 'Cómo elegir tu primer SUP hinchable'
        - 'Guía de tallas y capacidad de peso del SUP'
        - 'Mejor SUP para principiantes, travesías, yoga y competición'
        - 'Errores de compra de SUP que debes evitar'
        - 'Comparativa: hinchable frente a tabla rígida'
