hero:
  tagline: 'OEM Buyer Onboarding'
  title: 'Your First SUP Order, Step by Step'
  subtitle: 'From first contact to delivered boards, the OEM onboarding process at Vectoflare runs through seven defined gates — each with a clear timeline, a documented deliverable, and a go/no-go checkpoint. No ambiguity, no hidden steps, no surprises after deposit.'
  actions:
    - variant: primary
      text: Start Your Project Brief
      href: /contact#project-brief
