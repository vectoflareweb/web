moq_factors:
  tagline: What Drives Your MOQ
  title: 'Why Full-Custom MOQ Is Always Project-Specific'
  subtitle: 'For 100% bespoke manufacturing, MOQ is calculated from the complete product architecture — these four components are evaluated together before quotation.'
  headers:
    component: Project Component
    driver: Manufacturing Driver
    impact: Impact on Minimum Quantity
  rows:
    - component: 'Hull Shape & Tooling'
      driver: 'Existing factory rocker moulds vs bespoke CAD cutting dies and EVA hot-press tooling'
      impact: 'Existing platforms: pilot orders from 20 pcs. Bespoke hulls: dedicated tooling amortization required.'
    - component: 'Colorways & PVC'
      driver: 'Single standard stock colors vs proprietary Pantone-dyed PVC sheets'
      impact: 'Custom Pantone PVC requires dedicated chemical dyeing runs with independent raw material MOQs.'
    - component: 'Branded Packaging'
      driver: 'Generic cartons with barcode stickers vs full-color 5-ply retail gift boxes and branded manuals'
      impact: 'Custom color boxes carry an independent offset printing press minimum (typically 500+ boxes).'
    - component: 'Accessory Packages'
      driver: 'Standard aluminum or nylon paddles vs custom-matched carbon paddles and branded pumps'
      impact: 'Fully branded accessories follow sub-tier supplier production batches.'

