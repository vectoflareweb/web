moq_faqs:
  tagline: FAQ
  title: 'Frequently Asked Questions About MOQ'
  items:
    - q: 'Is MOQ calculated per order, per model, or per colorway?'
      a: 'MOQ may apply per model, colorway, artwork version, packaging configuration or total order. Because different drop-stitch thicknesses (12 cm vs 15 cm) and PVC colors come from distinct raw material rolls, ordering 50 boards split across 5 colors creates 5 separate fabric roll requirements. We confirm the exact calculation against your SKU matrix before quotation so you can plan your mix clearly.'
    - q: 'Can I order a sample before bulk production?'
      a: 'Yes. Sample development (1–2 units) verifies hull rigidity, EVA traction pad texture, graphic accuracy and accessory fitment before mass production release. Sample fees apply and are credited toward your production order upon contract sign-off.'
    - q: 'Why does custom retail packaging have an independent MOQ?'
      a: 'Custom flexographic or offset carton printing presses require a minimum production setup of 500+ units. We offer a Hybrid Packaging Storage Solution: we produce the 500 custom-printed cartons, store the surplus in our clean warehouse, and release them across your scheduled board shipments — so a smaller board order can still ship in fully branded retail packaging.'
    - q: 'Why is the standard volume MOQ 90–100 units?'
      a: 'Standard volume MOQ follows the raw material: a 150 m master roll of high-grade drop-stitch fabric yields approximately 90–100 finished boards for a standard touring or all-around hull. Running full rolls eliminates fabric splicing, keeps fiber tension uniform, and amortizes the 2-hour welding and lamination line calibration — delivering the lowest possible per-unit cost.'
    - q: 'Does a higher quantity reduce unit cost?'
      a: 'In most projects, yes. Higher quantities improve material yield, distribute fixed production line setup overhead across more boards, and reduce per-unit packaging costs.'
    - q: 'Do co-branding mould fees apply again on re-orders?'
      a: 'No. Screen-printing mould fees are charged once on initial setup and are waived for re-orders using the same artwork dimension. You only pay the $1.00 USD per board factory handling and printing fee.'
    - q: 'Does requesting MOQ guidance commit me to an order?'
      a: 'No. Requesting project MOQ guidance simply allows our engineering team at Qingdao Vatrad Group Co., Ltd. to review your technical brief and advise the most cost-effective production path. A Non-Disclosure Agreement (NDA) is available before you share proprietary technical specifications or artwork.'

