customization:
  tagline: Built to Your Spec
  title: OEM Specification Points
  subtitle: 'These are the specification points you control on an OEM project — your specification document is the production contract:'
  items:
    - 'Board dimensions — length, width, thickness, rocker and volume per your drawings or target riders'
    - 'Material structure — PVC layer count and grade, drop-stitch density, stiffeners and rail reinforcements'
    - 'Graphics and colors — your artwork applied with unlimited palettes, or support from our in-house design team'
    - 'EVA traction pad — custom-cut deck pads, logos and deck colors on every board'
    - 'Handles and D-rings — placement, count and hardware spec for your use case'
    - 'Fin systems — single, twin or tri-fin configurations and fin boxes to your spec'
    - 'Paddles, pumps, leashes and accessories — your package, your branding'
    - 'Packaging and retail presentation — retail boxes, seaworthy shipping packing and point-of-sale displays under your brand'
    - 'Labels and compliance marks — serial labels, logos and per-market documentation prepared for your export region'

faq_section:
  tagline: FAQ
  title: OEM Manufacturing Questions
  questions:
    - q: How do I start an OEM project with my own design?
      a: 'Send your drawings, a reference board or a written specification. Our engineering review confirms manufacturability and returns a quotation within one business day — it is our standard commitment, and an NDA is signed before any file exchange when needed.'
    - q: What is the MOQ for OEM inflatable SUP?
      a: 'MOQ is confirmed by project configuration — hull and tooling, colorways and PVC, artwork, packaging and accessories. Standard volume production runs 90–100 units per batch (one 150 m drop-stitch roll), while pilot runs start at 20–50 units on existing platforms. Read the full calculation logic in our MOQ & Flexible Branding Guide.'
    - q: What is the typical lead time for an OEM order?
      a: 'Production runs 25–35 days from confirmed PO and deposit. Custom mould development adds 15–20 days for tooling. Prototype samples usually ship within 7–12 days.'
    - q: Can you manufacture from my existing drawings only?
      a: 'Yes. OEM builds from your specification as-is — you own the design. Our engineers review the drawings for production feasibility, flag any spec conflicts before tooling or cutting starts, and the approved sample becomes the production reference.'
    - q: Do you provide samples before production?
      a: 'Yes. A physical sample is produced and approved before any production run, typically within 7–12 days, and it is the reference for all subsequent QC checks.'
    - q: Which certifications does the factory hold?
      a: 'CE, ISO 9001, BSCI, REACH and RoHS. Full compliance documentation is provided with every OEM shipment, prepared for your target markets.'
    - q: How is quality controlled on an OEM run?
      a: 'Production runs under multi-point QC — incoming material, in-process and final inspection — with 18.0 PSI 24-hour pressure-hold testing (auto-reject above 0.50 PSI drop), a 100-point assembly checklist and 10-year ERP batch traceability per serial number.'
    - q: What are your shipping terms?
      a: 'FOB Qingdao, CIF major global ports, or DDP for qualified partners. We ship to 50+ countries across EU, US, AU and Asia markets.'

process:
  title: The OEM Process — From Spec to Shipped Container
  subtitle: 'Seven controlled stages run by one factory team, so every step from your first spec to the packed container stays documented and on schedule.'
  steps:
    - phase: '01'
      title: Spec Review & Quotation
      period: 1 business day
      items:
        - 'Share your drawings, specification or reference boards — our engineers check manufacturability.'
        - 'You receive a detailed quotation and project plan within one business day.'
    - phase: '02'
      title: Engineering Confirmation
      period: Week 1
      items:
        - 'Hull dimensions, drop-stitch grade, PVC specs and rail construction are confirmed against your document.'
        - 'Mould or platform decisions are locked — custom mould tooling starts here when required.'
    - phase: '03'
      title: Prototype & Sample
      period: 7–12 days
      items:
        - 'A physical sample is produced and sent for your review — runway trials included for new shapes.'
        - 'Sample (1–2 units) validates your spec before any volume commitment.'
    - phase: '04'
      title: Testing & Validation
      period: In parallel
      items:
        - 'Air-retention, pressure-hold, seam-strength, load and UV checks per production line.'
        - 'CE, ISO 9001, BSCI, REACH and RoHS documentation prepared for your export markets.'
    - phase: '05'
      title: Approval & Confirmation
      period: After sample sign-off
      items:
        - 'You approve the sample and artwork; the PO and deposit lock the production slot.'
        - 'A pre-production plan confirms dates, quantities, packaging and port of loading.'
    - phase: '06'
      title: Production
      period: 25–35 days
      items:
        - 'Production runs under multi-point QC — incoming material, in-process and final inspection.'
        - 'From pilot orders (20–50 units) on existing platforms up to full 150 m roll batches (90–100+ units) for standard volume production.'
    - phase: '07'
      title: Packing & Shipment
      period: 1 day + transit
      items:
        - 'Export packing with model serial labels, then FOB Qingdao, CIF or DDP to 50+ countries.'
        - 'Customs documentation, tracking and reorder support included at every stage.'

