answer:
  label: 'Respuesta directa'
  text: 'Las tablas SUP a medida se diseñan en nuestras instalaciones con modelado de superficies 3D en SolidWorks, análisis FEA con ANSYS y CFD: cada tabla se simula para la distribución de tensiones y la rigidez de la cubierta, con un factor de seguridad obligatorio ≥ 2.5 antes del prototipado. Una forma a medida tarda 7–12 días en llegar al prototipo; el utillaje completo de un molde personalizado añade 15–20 días al plazo de producción estándar de 25–35 días, con el MOQ confirmado por configuración del proyecto (consulta nuestra Guía de MOQ).'
  verified: '2026-08'

intro: 'La forma de una tabla SUP — su rocker, el perfil del borde y el volumen de proa y de cola — determina cómo se rema, cómo gira y cómo mantiene la línea. En {SITE.name}, nuestro Estudio de Ingeniería de Tablas combina el modelado CAD de superficies, el análisis por elementos finitos (FEA) de estructuras drop-stitch y la experiencia de producción para entregar tablas optimizadas para cada tipo de uso: estabilidad versátil, deslizamiento de travesía o rendimiento de surf. Cada tabla a medida nace de tu especificación, no de una forma genérica de catálogo.'

content_html: |
  <h2>Donde la resistencia se encuentra con la hidrodinámica</h2>
  <p>Una tabla de SUP hinchable es una estructura drop-stitch: miles de hilos de poliéster unen las láminas superior e inferior de PVC y mantienen la cubierta plana a 12–15 PSI, mientras que la geometría del canto y de la proa controla la interacción de la tabla con el agua. Diseñamos la forma 3D, la simulamos y validamos el resultado en nuestras instalaciones antes de cortar una sola muestra.</p>

  <h2>Herramientas y estándares de diseño</h2>
  <p>Nuestro entorno de ingeniería digital incluye:</p>
  <table>
    <thead><tr><th>Capacidad</th><th>Software / Herramienta</th><th>Aplicación</th></tr></thead>
    <tbody>
      <tr><td>Modelado paramétrico 3D</td><td>SolidWorks Professional</td><td>Superficie de la tabla, línea de rocker, perfil del canto, integración de asa y quillas</td></tr>
      <tr><td>Análisis por elementos finitos</td><td>ANSYS Mechanical</td><td>Mapa de tensiones del núcleo drop-stitch, rigidez de la cubierta bajo carga, refuerzo del punto del asa</td></tr>
      <tr><td>Dinámica de fluidos computacional</td><td>ANSYS Fluent</td><td>Predicción de la resistencia hidrodinámica, optimización del ángulo de planeo</td></tr>
      <tr><td>Ingeniería de laminado</td><td>ESAComp</td><td>Apilado de capas de PVC, selección del peso de tejido y estimación del peso</td></tr>
      <tr><td>Revisión de la superficie del molde</td><td>Moldex3D</td><td>Revisión de la geometría del utillaje de soldadura para la unión por RF</td></tr>
    </tbody>
  </table>

  <h2>Nuestro proceso de ingeniería</h2>
  <p>Cada diseño de tabla, ya sea un modelo estándar o un proyecto totalmente personalizado, pasa por un proceso riguroso de cinco fases:</p>
  <ol>
    <li><strong>Concepto y recopilación de requisitos</strong> — Definimos el rango de peso del rider, el uso previsto (polivalente, travesía, surf, yoga, flota de alquiler), la longitud, el ancho y el grosor objetivo, y las características especiales (sistemas de carga, pavimentos de cubierta, puntos de amarre).</li>
    <li><strong>Modelado de superficies 3D y cálculo de volumen</strong> — La forma de la tabla se construye en SolidWorks y se comprueba el reparto de volumen, el desplazamiento y la estabilidad frente al peso objetivo del rider.</li>
    <li><strong>FEA estructural</strong> — La tabla inflada se analiza con carga de pie estática (rider en el centro, 100 kg) y con carga dinámica (impacto de ola en el canto). Se revisan los contornos de tensión; el factor de seguridad ≥ 2.5 es obligatorio.</li>
    <li><strong>Optimización de la resistencia con CFD</strong> — El casco se simula en tres condiciones de carga y a cinco velocidades. La superficie mojada, el ángulo de trimado y la resistencia residual se reducen de forma iterativa.</li>
    <li><strong>Revisión y liberación del diseño</strong> — El paquete de ingeniería completo (modelo 3D, informe FEA, informe CFD, estimación de peso y plano de corte de paneles) se revisa con nuestro ingeniero senior antes de pasar al taller de prototipos.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Resultados del FEA — tabla polivalente de 11''0 (32'' de ancho, 6'' de grosor)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Factor de seguridad a 120 kg de carga de pie</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">0 mm</span>
        <span class="text-gray-500">Flechado de cubierta a 15 PSI sin carga</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">3.2 mm</span>
        <span class="text-gray-500">Máxima flexión de cubierta con rider de 120 kg</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15 PSI</span>
        <span class="text-gray-500">Presión de análisis — presión de trabajo de la plataforma</span>
      </div>
    </div>
  </div>

  <h2>Personalización: tu tabla, tus reglas</h2>
  <p>No hay dos marcas que necesiten lo mismo. Una flota de alquiler necesita una tabla polivalente ancha y estable con cantos reforzados; una marca de travesía necesita una proa de desplazamiento más larga con amarres de carga; una línea de surf necesita una cola recogida y un rocker progresivo. No obligamos a tu gama a adoptar formas preexistentes: diseñamos partiendo de tu especificación.</p>
  <p>Ejemplos recientes de ingeniería de tablas a medida:</p>
  <ul>
    <li>Una tabla de travesía de 14'' para una marca de remo de resistencia, con proa de desplazamiento y cubierta de carga rebajada (+15 % de línea de flotación para el deslizamiento).</li>
    <li>Una tabla polivalente ancha de 10''6 para la flota de un complejo turístico, con cantos laterales de doble capa y capacidad nominal de 220 lb.</li>
    <li>Un SUP de surf de 9'' con cola recogida y rocker progresivo, desarrollado para una línea dedicada de escuela de surf.</li>
  </ul>

  <h2>Nuestros ingenieros</h2>
  <p>El estudio lo dirige un ingeniero senior de producto con 14 años de experiencia en diseño de productos hinchables, apoyado por dos ingenieros mecánicos especializados en FEA y CFD. Los tres están titulados en Ingeniería por universidades de reconocido prestigio internacional, y el equipo colabora con nuestra fábrica para asegurar que cada diseño se fabrica a escala de contenedor.</p>

  <h2>Colabora con nosotros en tu próxima tabla</h2>
  <p>Desde el primer boceto del concepto hasta el informe final de tensiones, nuestro Estudio de Ingeniería de Tablas es tu socio para crear una tabla que no solo está construida, sino diseñada con ingeniería. Invertimos horas de simulación al principio del proceso para que cada soldadura, cada capa y cada curva del casco exista por una razón.</p>
  <p>Y tanto si solo necesitas una pequeña modificación de un modelo existente como un diseño partiendo de cero, estamos listos para hablar de tus requisitos.</p>

