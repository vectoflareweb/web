hero:
  tagline: Desarrollo de producto
  title: 'Desarrollo de SUP personalizados, del concepto al contenedor'
  subtitle: 'Seis etapas convierten tu idea de producto en tablas de SUP listas para producir — especificación, ingeniería, prototipado, ensayos, utillaje y producción en masa, todo dentro de una sola fábrica con un único sistema de calidad responsable.'

answer:
  label: 'Respuesta directa'
  text: 'El desarrollo de productos SUP en Vectoflare transcurre en seis etapas — especificación del producto, ingeniería estructural, muestreo de prototipo, ensayos y validación, utillaje a medida y producción en masa. La primera muestra física sale en 7–12 días tras la aprobación de la especificación; la producción transcurre en 25–35 días tras el PO y el depósito confirmados; el desarrollo de un molde nuevo añade 15–20 días.'
  verified: '2026-08'

stages:
  title: 'Las seis etapas del desarrollo de SUP personalizados'
  subtitle: 'Cada etapa tiene un entregable claro, para que siempre sepas dónde está tu proyecto — y qué llega después.'
  items:
    - title: '1. Idea y especificación del producto'
      description: 'Geometría de la tabla, rango de peso del rider, volumen, objetivos de construcción y paquete de accesorios. Una tabla de referencia, un boceto o la especificación de un competidor bastan para empezar.'
      icon: 'tabler:bulb'
    - title: '2. Ingeniería y diseño 3D'
      description: 'Ingeniería estructural, grosor del drop-stitch y selección de calidad de PVC, más una revisión de fabricabilidad y presupuesto — devueltos en un día laborable.'
      icon: 'tabler:blueprint'
    - title: '3. Muestreo de prototipo'
      description: 'Tu primera muestra física sale en 7–12 días, documentada con una ficha de aprobación que cubre construcción, colores de impresión y resultados del ensayo de presión.'
      icon: 'tabler:tools'
    - title: '4. Ensayos y validación'
      description: 'Retención de presión, resistencia de costuras y comprobaciones dimensionales contra la muestra aprobada, con documentación CE y REACH preparada para tus mercados objetivo.'
      icon: 'tabler:test-pipe'
    - title: '5. Utillaje y producción en masa'
      description: 'Desarrollo de molde a medida en 15–20 días cuando se necesita; la producción transcurre en 25–35 días con puntos de control de QC en proceso y trazabilidad de lote.'
      icon: 'tabler:settings'
    - title: '6. Entrega y escalado'
      description: 'Logística FOB, CIF o DDP a más de 50 países — y después pedidos repetidos de tu línea consolidada con plazos estables y arte aprobado en archivo.'
      icon: 'tabler:truck-delivery'

why_inhouse:
  title: 'Por qué el desarrollo dentro de una fábrica gana a un proyecto intermediado'
  subtitle: 'Que el trabajo de desarrollo esté dentro de la planta de producción cambia lo que obtienes en cada etapa.'
  items:
    - title: Sin brechas de traspaso de diseño
      description: 'El equipo de ingeniería y dibujo trabaja en la misma planta que la línea de soldadura — un cambio de plano llega a producción la misma semana, no después de un viaje comercial de ida y vuelta.'
      icon: 'tabler:handshake'
    - title: Muestras que coinciden con la producción
      description: 'La tirada de muestra y la tirada de producción comparten máquinas, materiales y puestos de QC, así que la muestra aprobada es lo que realmente recibes a escala de contenedor.'
      icon: 'tabler:stack-2'
    - title: Ingeniería que no vende nada más
      description: 'Las decisiones se toman contra el coste objetivo, el peso y la durabilidad — no contra márgenes de venta adicional, porque esto es una fábrica y la producción es el único ingreso.'
      icon: 'tabler:scale'
    - title: Confidencialidad como contrato permanente
      description: 'Se firma un NDA antes de cualquier intercambio de archivos, y tus archivos de arte, utillaje y especificaciones siguen siendo de tu propiedad — nunca reutilizados, revendidos ni mostrados a otro cliente.'
      icon: 'tabler:lock'

