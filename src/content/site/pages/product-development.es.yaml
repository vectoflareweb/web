faq_section:
  tagline: FAQ
  title: 'Preguntas frecuentes sobre desarrollo de SUP'
  questions:
    - q: ¿Podéis desarrollar un producto SUP desde una idea?
      a: 'Sí. Apoyamos todo el recorrido, desde la especificación del producto y la ingeniería hasta el desarrollo del prototipo, la personalización y la producción en masa según tus requisitos. Un boceto, una tabla de referencia o incluso la especificación de un competidor bastan para iniciar la revisión de ingeniería.'
    - q: ¿Cuánto cuesta el desarrollo de un producto SUP?
      a: 'La revisión de especificación y la evaluación de ingeniería son gratuitas y se devuelven en un día laborable. El muestreo del prototipo se presupuesta por proyecto tras fijar la especificación; el precio de producción depende de los materiales, el volumen y de si se requiere utillaje a medida.'
    - q: ¿Cuánto tarda el desarrollo de un producto SUP?
      a: 'La primera muestra sale en 7–12 días tras la aprobación de la especificación, con 3–7 días por ronda de revisión. La producción transcurre en 25–35 días tras el PO y el depósito. El desarrollo de molde añade 15–20 días al inicio, y el flete marítimo añade 4–6 semanas a la mayoría de los destinos.'
    - q: ¿Qué va primero — la muestra o la producción?
      a: 'Siempre la muestra. Se produce, mide y aprueba un prototipo físico contra la especificación antes de iniciar cualquier tirada de producción. No lanzamos producción en volumen sobre diseños no aprobados.'
    - q: ¿Firmáis un NDA para el desarrollo de producto?
      a: 'Sí. Se firma un NDA antes de cualquier intercambio de archivos, y tus diseños, arte y utillaje siguen siendo de tu propiedad durante todo el desarrollo y la fabricación.'
    - q: ¿Podéis proteger mi diseño y mis especificaciones de SUP?
      a: 'Los diseños, especificaciones y conceptos de producto de los clientes se tratan de forma confidencial durante el desarrollo y la fabricación. Tus archivos de utillaje nunca se reutilizan, revenden ni muestran a otro cliente.'

