traceability:
  tagline: 'A Batch, Followed From Roll To Board'
  title: 'What Traceability Actually Looks Like'
  body: |
    Every batch is issued a **10-year ERP lot code**. The chain recorded under one lot:

    - **Incoming roll** — material certificate, roll number, fabric batch tested (tensile, tear, seam)
    - **Cutting** — CNC nesting job vs design file, waste percentage logged
    - **Welding & lamination** — line, operator, machine parameters per chamber
    - **Assembly** — board serial number, valve type, deck pad lot
    - **Test** — 18.0 PSI × 24 h hold per chamber, auto-reject above 0.50 PSI drop
    - **Release** — 100-point checklist per board, QA Director sign-off per batch
    - **Onward** — Certificate of Conformance with the shipment; audit right reserved in the contract

    Ask for the sample QC record before your first order — it is the same format you receive with your shipment.

faqs:
  tagline: 'FAQ'
  title: 'Evidence Questions Buyers Ask'
  items:
    - q: 'Is this page for verification only, and not replacing due diligence?'
      a: 'Correct — this page shows where every claim can be verified: entity registration, certificates, machines, records and an audit-open plant. Your usual due-diligence steps (registration check, audit, third-party inspection) still apply and are welcome.'
    - q: 'Which entity should appear on my order documentation?'
      a: 'Orders are placed with Qingdao Vatrad Group Co., Ltd., operating as Vectoflare (manufacturing division), with Vectoflare as the SUP product line. Contract documents are signed by the Sales VP, the Chief Engineer and the QA Director.'
    - q: 'Can I get copies of the certificates before ordering?'
      a: 'Yes — certificate numbers and audit records are supplied on request or during an audit. The list is published, never "available on request only".'
    - q: 'How do I verify batch test records myself?'
      a: 'Every chamber is tested at 18.0 PSI for 24 hours with auto-reject above 0.50 PSI drop; test logs link to serial numbers and ship with the Certificate of Conformance per batch. SGS, TÜV, BV or Intertek pre-shipment inspection per ISO 2859-1 Level II can be scheduled at your choice.'
    - q: 'Do the certificates cover accessories too?'
      a: 'REACH/RoHS material documentation applies to boards and accessories supplied in the same order, and QC checklists cover the complete kit — board, paddle, pump, leash and bag.'
    - q: 'What happens to the evidence after the order?'
      a: 'ERP batch traceability is kept for 10 years. QMS SOPs and inspection standards stay downloadable, and the buyer reserves an audit right during production per the contract.'

