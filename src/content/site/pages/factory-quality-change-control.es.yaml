cc_intro:
  tagline: Alcance y política
  title: Principios básicos de gobernanza
  body: |
    **Documento:** QMS-SOP-QC-CC-001 — *Estándar de control de cambios de parámetros de retrabajo* (Rev 2.0, lanzamiento oficial). **Fabricante:** QINGDAO VATRAD GROUP.,LTD. / 青岛万国通衢进出口有限公司. **Referencia normativa:** ISO 9001:2015 Sistemas de gestión de la calidad.

    - **Sin cambios no controlados.** Los cambios de parámetros de retrabajo deben pasar por el control de cambios formal. Los operadores en planta, jefes de turno o un departamento individual nunca pueden modificar parámetros de retrabajo aprobados mediante acuerdos verbales o anotaciones a mano en el registro de retrabajo.
    - **Cobertura de todos los elementos.** El alcance controlado cubre la estanqueidad al aire, los asientos de válvula, los raíles, la unión de costuras, el curado con aire caliente y las pruebas de retención de presión — todo parámetro que pueda influir en el sellado, la durabilidad estructural, la apariencia, la aceptación del cliente o la trazabilidad.
    - **Límite de aprobación del cliente.** Cualquier cambio que aleje el producto de la muestra aprobada por el cliente, la especificación técnica, la BOM, el arte, el requisito de embalaje o los criterios de aceptación solo se implementa con aprobación escrita del cliente. Sin ella, la tabla se retrabaja según el requisito original, se reemplaza o se rechaza — la fábrica nunca "relaja" el estándar por sí sola.

cc_scope:
  tagline: Clasificación de riesgos
  title: Alcance del cambio y clasificación de riesgos
  subtitle: Cualquiera de los siguientes casos activa el control de cambios formal — nunca se gestiona anotándolo en el registro de retrabajo. El nivel de riesgo determina quién aprueba y cuánta validación se requiere.
  headers:
    category: Categoría de cambio
    examples: Ejemplos típicos
    risk: Riesgo
    requirements: Requisitos de control y aprobación
  rows:
    - category: 'Materiales de retrabajo'
      examples: 'Cambio de adhesivo, limpiador, material de parche, sello de válvula, imprimación o proveedor'
      risk: 'Alto'
      requirements: 'Revisión interdepartamental + validación de compatibilidad de materiales y retención de presión + firma del cliente cuando aplique'
    - category: 'Condiciones de proceso'
      examples: 'Preparación de superficie, temperatura/humedad de curado con aire caliente, presión de sujeción, tiempo de retención'
      risk: 'Alto'
      requirements: 'Aprobación de Ingeniería y Calidad con validación de la ventana de temperatura y humedad definida'
    - category: 'Herramientas e instrumentos'
      examples: 'Manómetros, detectores de fugas, pistolas de calor, llaves de válvula, software de ensayo'
      risk: 'Medio/Alto'
      requirements: 'Verificación de validez de calibración + evaluación de idoneidad del equipo'
    - category: 'Alcance del defecto'
      examples: 'Ampliación del área de retrabajo; micro-fuga superficial que crece a zonas críticas de raíl, costura o asiento de válvula'
      risk: 'Alto'
      requirements: 'Superficies estructurales portantes: parada obligatoria y re-evaluación'
    - category: 'Métodos de inspección'
      examples: 'Método de detección de fugas, presión de ensayo (18,0 PSI), duración de retención (24h)'
      risk: 'Alto'
      requirements: 'Aprobación de Calidad + confirmación del acuerdo técnico del cliente'
    - category: 'Documentación y autorización'
      examples: 'Instrucción de retrabajo, hojas de inspección, lógica de disposición NCR, cualificación de operadores'
      risk: 'Medio'
      requirements: 'Revisión controlada de documentos (Rev A → Rev B) + registros de formación'

cc_containment:
  tagline: Regla de parada dura
  title: Contención inmediata cuando las condiciones son graves
  body: |
    > "El método de retrabajo existente se someterá a revisión y no se aplicará a producto adicional afectado hasta que el cambio sea evaluado y autorizado, salvo que una desviación temporal documentada sea aprobada por Calidad e Ingeniería."

    El método de retrabajo actual debe suspenderse de inmediato cuando la reinspección del retrabajo sigue fallando, cuando el defecto afecta zonas estructurales portantes (asiento de válvula, raíles, costuras, áreas de presión de proa/popa), cuando un material sustituto aún no está validado o cuando los parámetros actuales entran en conflicto con la especificación aprobada por el cliente.

    Las desviaciones temporales nunca se convierten en práctica permanente: cada una lleva una ventana de validez definida, alcance de lote aplicable, límite de cantidad, requisitos de validación y un mecanismo de expiración automática. Una excepción verbal no es una excepción — si no está documentada con su caducidad, no existe.

cc_flow:
  tagline: Bucle cerrado estándar de 9 pasos
  title: De la solicitud de cambio al cierre y retención
  subtitle: 'Un bucle documentado para cada cambio de parámetro: proponer, cribar, evaluar, aprobar, validar, pilotar, verificar, revisar, cerrar.'
  steps:
    - step: '01'
      title: Solicitud de cambio (ECR)
      desc: 'Cualquier departamento puede presentar una solicitud, pero Ingeniería, Calidad o la dirección de Producción la patrocinan. La ECR responde por qué se propone el cambio, qué cambia, qué se ve afectado y cómo se verificará — con número de control de cambios, NCR/CAPA relacionado, parámetro actual vs propuesto, lotes afectados y clasificación temporal/permanente.'
    - step: '02'
      title: Cribado inicial y contención
      desc: 'La solicitud se criba primero para determinar la contención inmediata: ¿debe detenerse el método actual ahora? Si se permite una desviación temporal, queda limitada por ventana de validez, alcance de lote, límite de cantidad y expiración automática.'
    - step: '03'
      title: Evaluación de impacto y riesgos
      desc: 'Ingeniería, Calidad, Producción, Compras/Cadena de suministro y Proyecto evalúan el rendimiento del producto, los criterios de aceptación, la compatibilidad de materiales, la apariencia, la capacidad del proceso, los equipos e instrumentos, la cualificación del personal, los requisitos del cliente, el cumplimiento normativo y el alcance de trazabilidad.'
    - step: '04'
      title: Revisión y aprobación conjunta
      desc: 'La aprobación sigue la matriz de autorización fija — no "quien grita más". Los cambios de alto riesgo requieren aprobación interdepartamental y, cuando corresponde, aprobación escrita del cliente antes de cualquier prueba.'
    - step: '05'
      title: Plan de validación
      desc: 'Para cambios de alto riesgo se requiere un plan de validación aprobado antes de la aplicación rutinaria: tablas de muestra representativas, método actual vs propuesto, métodos de ensayo, criterios de aceptación, etapas de inspección, responsables y calendario.'
    - step: '06'
      title: Piloto controlado e implementación
      desc: 'Se publican los nuevos documentos y se retiran y marcan como OBSOLETOS los obsoletos; se verifican y calibran los nuevos materiales e instrumentos; se forma y cualifica a los operadores; el primer lote se ejecuta bajo inspección intensificada con identificación de estado clara.'
    - step: '07'
      title: Reinspección y revisión de eficacia
      desc: 'Se miden y revisan la tasa de primera pasada del retrabajo, la tasa de aprobación de la reinspección, la tasa de recurrencia y la aceptación de apariencia antes de considerar eficaz el cambio — una tabla reparada nunca se trata como validación del proceso.'
    - step: '08'
      title: Revisión de documentos y formación
      desc: 'Las instrucciones de trabajo, hojas de inspección, opciones de disposición NCR, tarjetas de parámetros y materiales de formación se actualizan a la nueva revisión con formación práctica registrada y cualificación de operadores.'
    - step: '09'
      title: Cierre y retención de registros
      desc: 'El cambio se cierra solo tras revisar y aprobar la evidencia de validación, las actualizaciones documentales, los registros de formación y la eficacia de la implementación. Si no se logra el resultado previsto, el cambio se revisa, extiende, suspende o retira.'

