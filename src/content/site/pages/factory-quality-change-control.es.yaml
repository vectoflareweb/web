cc_validation:
  tagline: Validación de ingeniería
  title: Protocolo de validación y aceptación — evidencia sobre declaraciones
  body: |
    La redacción de aceptación vaga como *"la tabla reparada debe estar bien"* no se acepta. La redacción controlada es:

    > "La muestra retrabajada cumplirá los mismos criterios de aceptación aplicables de estanqueidad al aire, mano de obra visual, función de válvula y específicos del proyecto que una tabla conforme, salvo que una desviación aprobada por el cliente defina específicamente un criterio alternativo."

    La evidencia de validación es cuantitativa, y la base de ingeniería para el retrabajo de estanqueidad incluye:

    - **Eliminación de fugas y retención de presión.** La fuga original se elimina sin burbujas sostenidas en la detección con agua jabonosa; la tabla mantiene la presión de ensayo estándar de 18,0 PSI durante 24 horas, con caída neta de presión ΔP ≤ 0,2 PSI tras compensación de temperatura/humedad.
    - **Función de la válvula.** El par del núcleo de válvula cumple la especificación de 15–20 N·m, sin micro-fugas en el sello bajo inflado a alta presión y presión dinámica.
    - **Unión de costuras y durabilidad.** Los bordes de la unión no presentan levantamientos, blanqueamiento ni delaminación; tras ciclos de envejecimiento por calor-humedad, la capa adhesiva no muestra ablandamiento ni grietas frágiles.
    - **Apariencia y mano de obra.** Sin marcas de exudación de adhesivo, sin daños en EVA, sin deformación de la tabla y sin desplazamiento del logo ni rayones en la superficie impresa.

cc_engineering:
  tagline: Matriz de ejecución de ingeniería
  title: Parámetros cuantificados de los cuatro procesos básicos de retrabajo
  subtitle: 'Cada proceso de retrabajo controlado lleva parámetros, metodología y criterios de aceptación definidos — los mismos números que siguen nuestros operadores y que los clientes pueden verificar durante las auditorías.'
  headers:
    process: Proceso de retrabajo
    parameters: Parámetros controlados
    methodology: Metodología de ensayo
    acceptance: Criterios de aceptación
  rows:
    - process: 'Reparación de parche para micro-fuga / poro'
      parameters: 'Limpieza y secado con solvente 3–5 min; activación con aire caliente 60°C ± 5°C; rodillo de presión ≥ 0,4 MPa'
      methodology: 'Inflar a 18 PSI; inmersión total en agua o aplicación de jabón; observar durante 10 minutos'
      acceptance: 'Cero emisión de burbujas; pelado de borde a 180° sin levantamientos y sin marcas de exudación de adhesivo'
    - process: 'Re-unión de raíl / costura'
      parameters: 'Proporción de adhesivo de dos componentes estrictamente controlada; entorno 22–28°C, ≤ 65% HR; sujeción con fijación ≥ 4 h'
      methodology: 'Ensayo de sobrepresión a 22 PSI durante 2 h; después horneado en caja térmica a 50°C durante 6 h y reposo a temperatura ambiente 2 h'
      acceptance: 'Cero separación, cero grietas; caída neta de presión ΔP ≤ 0,1 PSI; capa adhesiva sin blanqueamiento ni fragilidad'
    - process: 'Aflojamiento / micro-fuga del asiento de válvula'
      parameters: 'Par con llave dedicada 18–20 N·m; junta de sellado plana sin distorsión; limpieza de rosca confirmada'
      methodology: 'Inflar a 15 PSI; 20 ciclos de inflado/desinflado; observación por inmersión bajo agua'
      acceptance: 'Cero burbujas en el núcleo y la periferia de la base; par tras ciclos ≥ 16 N·m'
    - process: 'Ensayo final de retención de presión 24h'
      parameters: 'Inflado de referencia 18,0 PSI; manómetro digital Clase 1,0 / ±0,5%; temperatura y humedad ambiente registradas y compensadas'
      methodology: 'Registrador digital de presión; curva continua de presión de 24 h'
      acceptance: 'Caída neta de presión ΔP ≤ 0,20 PSI / 24 h tras compensación; sin abombamiento ni deformación de la tabla'

