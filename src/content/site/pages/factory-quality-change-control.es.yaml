faqs:
  tagline: FAQ
  title: Preguntas frecuentes sobre el control de cambios de retrabajo
  items:
    - q: '¿Puede la fábrica cambiar los parámetros de retrabajo sin avisarnos?'
      a: 'No. Cualquier cambio propuesto en materiales de retrabajo aprobados, condiciones de proceso, herramientas, métodos de ensayo, criterios de inspección o personal autorizado debe pasar primero el control de cambios documentado. Los cambios que afectan a especificaciones, muestras, BOM, arte o criterios de aceptación aprobados por el cliente requieren su aprobación escrita.'
    - q: '¿Qué cuenta como cambio de alto riesgo?'
      a: 'Los cambios en materiales o proveedores de retrabajo, en las condiciones de presión/retención o curado, en los métodos de retrabajo de válvula/raíl/costura, en los criterios de inspección o aceptación, y la ampliación del alcance del defecto a zonas estructurales se clasifican como alto riesgo. Requieren revisión interdepartamental, un plan de validación aprobado e implementación piloto controlada antes de su uso rutinario.'
    - q: '¿Puede usarse indefinidamente una desviación temporal?'
      a: 'No. Toda desviación temporal lleva una ventana de validez definida, alcance de lote, límite de cantidad y requisitos de validación, con expiración automática. Al alcanzar el tope, el lote se bloquea y se impide imprimir la etiqueta de liberación hasta que el cambio se evalúe formalmente.'
    - q: '¿Cómo se demuestra que un método cambiado funciona antes de su uso pleno?'
      a: 'Los cambios de alto riesgo requieren un plan de validación: al menos 5 tablas de muestra representativas que cubran los límites de tolerancia, ensayadas por 2 inspectores de Calidad independientes contra criterios de aceptación cuantificados (eliminación de fugas, retención de presión, función de válvula, durabilidad de costuras, apariencia). Aprobar la validación no es aprobar la aplicación.'
    - q: '¿Necesitamos aprobar todos los cambios?'
      a: 'No todos, pero cualquier cambio que aleje el producto de la muestra aprobada por el cliente, la especificación técnica, la BOM, el arte, el embalaje o los criterios de aceptación solo se implementa con aprobación escrita del cliente. Sin ella, las tablas se retrabajan según el requisito original, se reemplazan o se rechazan.'
    - q: '¿Qué ocurre con los documentos antiguos cuando se aprueba un cambio?'
      a: 'Las instrucciones de trabajo, tarjetas de parámetros y hojas de inspección antiguas se recogen físicamente y se cancelan (1-a-1), se marcan como OBSOLETAS y se sustituyen por la nueva revisión controlada tras la formación. Las versiones antigua y nueva nunca comparten una estación de trabajo.'
    - q: '¿Cuánto tiempo se conservan los registros de control de cambios?'
      a: 'Los registros de cierre — evidencia de validación, revisiones documentales, registros de formación y revisiones de eficacia — se conservan según nuestra política de retención de registros (mínimo 3 años para registros de cierre), de modo que cada cambio siga siendo trazable para auditorías y revisiones de trazabilidad.'

