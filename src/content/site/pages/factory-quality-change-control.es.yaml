cc_pokayoke:
  tagline: Salvaguardas anti-error
  title: 'Poka-Yoke: bloques duros que detienen el cambio no controlado'
  subtitle: El estándar no se aplica solo con procedimientos, sino con bloqueos físicos y de sistema que hacen imposible ejecutar un cambio no controlado.
  features:
    - icon: 1
      icon_bg: blue
      title: Puerta ECR para desbloqueo de herramientas
      desc: 'Las estaciones de retrabajo leen un código de barras ECR firmado por Calidad antes de que se desbloqueen las válvulas de inflado neumático y las mezcladoras de adhesivo. Sin registro de control de cambios aprobado, sin suministro — la firma retroactiva ("cambiar primero, firmar después") queda bloqueada físicamente.'
    - icon: 2
      icon_bg: green
      title: Expiración automática de la desviación temporal
      desc: 'Las desviaciones temporales tienen un tope duro en el sistema (por ejemplo, un máximo de 50 tablas o 7 días naturales). Al alcanzar el tope, el lote se bloquea y se impide imprimir la etiqueta de liberación del envío hasta que el cambio se evalúe formalmente.'
    - icon: 3
      icon_bg: purple
      title: Evidencia mínima de validación
      desc: 'Los cambios de alto riesgo requieren al menos 5 tablas de muestra representativas que cubran los límites de tolerancia superior e inferior, inspeccionadas por completo por 2 inspectores de Calidad independientes, antes de poder emitir un informe de validación — una tabla reparada nunca se trata como validación del proceso.'
    - icon: 4
      icon_bg: orange
      title: Control documental 1-a-1
      desc: 'Las tarjetas de estación obsoletas se recogen físicamente y se cancelan (perforadas) antes de emitir la nueva tarjeta sellada con el sello rojo controlado — las versiones antigua y nueva nunca comparten una estación de trabajo.'

