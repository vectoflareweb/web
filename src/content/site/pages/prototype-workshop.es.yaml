intro: 'Un modelo CAD, por muy detallado que sea, no puede revelar cómo se siente una tabla hasta que se infla, se sube a ella y se palea. Por eso nuestro Taller de Prototipos está pensado para convertir los datos de ingeniería en una tabla física y navegable de la forma más rápida y precisa posible. Cada nuevo modelo de {SITE.name} — y cada construcción a medida significativa — pasa por este taller antes de comprometer el utillaje de producción.'

content_html: |
  <h2>Donde el diseño se convierte en realidad</h2>
  <p>El taller está equipado para la fabricación en paralelo de paneles, núcleos drop-stitch y railes. Este enfoque de trabajo concurrente reduce el plazo de entrega del prototipo a 7–12 días desde la liberación de ingeniería. Cuando tu aplicación exige una solución especializada, podemos pasar del concepto a la validación en el agua en menos de tres semanas.</p>

  <h2>Capacidades del taller</h2>
  <table>
    <thead><tr><th>Puesto de trabajo</th><th>Equipamiento</th><th>Propósito</th></tr></thead>
    <tbody>
      <tr><td>Corte de paneles</td><td>Cortadora CNC de tejido, software de anidación, biblioteca de patrones de paneles</td><td>Corte de precisión de los paneles de cubierta, casco y railes para cualquier tamaño de tabla</td></tr>
      <tr><td>Ensamblaje del núcleo</td><td>Mesa de laminado de núcleo drop-stitch, rodillos de aplicación de cola</td><td>Unión del núcleo drop-stitch entre láminas de PVC con recubrimiento uniforme de adhesivo</td></tr>
      <tr><td>Soldadura</td><td>Prensa de soldadura RF, estación de punteo con aire caliente, útil de prueba de inflado</td><td>Soldadura de las costuras de la tabla a tamaño real con válvulas, asas y cajas de quillas</td></tr>
      <tr><td>Equipado y acabado</td><td>Aplicador de decks pads, mesa de laminación de gráficos, banco de herrajes</td><td>Equipamiento completo: pavimento, logotipos, fijación del asa, tapón de anilla y cajas de quillas</td></tr>
      <tr><td>Banco de instrumentación</td><td>Manómetros, registrador de datos, banco de medición de flexión</td><td>Ensayos de muestras: ciclos de inflado, flecha de cubierta, medición de la retención de aire</td></tr>
    </tbody>
  </table>

  <h2>El viaje del prototipo — paso a paso</h2>
  <ol>
    <li><strong>Cesión desde ingeniería</strong> — El paquete de diseño (modelo 3D, informe FEA, lista de materiales, plan de paneles) se revisa formalmente por el responsable del taller y el ingeniero de proyecto. Cualquier preocupación de fabricación se señala y resuelve antes de comenzar el corte.</li>
    <li><strong>Fabricación de paneles</strong> — La tabla se construye siguiendo la especificación de ingeniería. Los paneles se cortan con CNC, el núcleo drop-stitch se lamina entre las láminas de PVC y la cubierta y el casco se ensamblan con la combinación de materiales aprobada.</li>
    <li><strong>Soldadura</strong> — Los paneles se sueldan por RF hasta la forma completa de la tabla. La cámara se infla a la presión de prueba y se deja 24 h para la estabilización inicial.</li>
    <li><strong>Ensamblaje y acabado</strong> — Se instalan el pavimento de cubierta, los gráficos, el asa, el tapón de anilla y las cajas de quilla. Todos los accesorios se montan y se verifican según la especificación.</li>
    <li><strong>Ensayos estáticos</strong> — Antes de que la tabla toque el agua se somete a: ciclos de inflado, comprobación de retención de aire, medición de la flecha de la cubierta a la presión de trabajo y comprobación del par de torsión de los herrajes.</li>
    <li><strong>Ensayos en el agua</strong> — 10 horas de pruebas en el agua, detalladas a continuación.</li>
    <li><strong>Revisión del prototipo</strong> — Se celebra una reunión formal de validación con los equipos de ingeniería, producción y calidad. Los cambios de diseño necesarios se documentan e incorporan a la versión de producción.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">Programa de ensayos en el agua de 10 horas — Calendario de pruebas</p>
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">1 h</span>
        <span class="flex-1">Comprobación de estabilidad — equilibrio de pie en reposo, tolerancia a cargas laterales</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Prueba de paleo — deslizamiento, dirección y giro a 3 velocidades; comodidad de la brazada</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Prueba de carga del rider — estabilidad y flexión con riders de 60 / 80 / 100 / 120 kg</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Prueba en olas — pasadas repetidas por la estela de embarcaciones; salpicadura de proa, deflexión del rail</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">2 h</span>
        <span class="flex-1">Ensayo de resistencia — paleo continuo con comprobaciones de presión periódicas; registro de retención de aire</span>
      </div>
      <div class="flex items-center gap-3 p-2 rounded bg-white dark:bg-gray-950">
        <span class="w-12 text-xs font-bold text-blue-600">1 h</span>
        <span class="flex-1">Inspección final — inspección de costuras, herrajes y gráficos tras la prueba; documentación de las conclusiones</span>
      </div>
    </div>
  </div>

  <h2>Prototipos a medida para aplicaciones singulares</h2>
  <p>El Taller de Prototipos es el lugar donde resolvemos los problemas que las tablas de producción estándar no pueden atender. Ejemplos recientes:</p>
  <ul>
    <li>Una tabla de travesía de 14'' para una marca europea de paddle de resistencia, con cubierta de carga rebajada y proa reforzada — prototipada, equipada y probada en nuestras instalaciones.</li>
    <li>Una tabla de yoga de 10''6 con pavimento de tracción a toda longitud y grosor adicional para más rigidez, validada durante una prueba de 4 semanas de temporada de alquiler.</li>
    <li>Una tabla de marca blanca para flota con gráficos de cubierta personalizados y doble asa, cuyo prototipo sirvió para validar el color, la ubicación del logotipo y el embalaje antes de que el cliente se comprometiera con un contenedor.</li>
  </ul>

  <h2>Nuestro equipo de prototipos</h2>
  <p>El taller cuenta con ocho técnicos de producción polivalentes, cada uno formado en al menos dos de las tres disciplinas básicas (corte, soldadura, equipado). El responsable del taller es un maestro artesano con 16 años de experiencia abarcando desde piezas únicas a medida hasta series de producción. A cada prototipo se asigna un ingeniero de proyecto dedicado que actúa como único punto de contacto del cliente durante todo el proceso de construcción y pruebas.</p>

  <h2>Participación del cliente</h2>
  <p>Animamos activamente a nuestros clientes a asistir a los hitos clave de la construcción del prototipo, en particular a la revisión inicial del equipamiento y a los ensayos en el agua. Tu comentario operativo en estas fases es de gran valor para afinar la tabla antes de que entre en producción. No trabajamos en un vacío: trabajamos en colaboración contigo.</p>
  <p>El programa de ensayos en el agua también es una ocasión para que tu equipo se familiarice con el manejo y los requisitos de mantenimiento de la tabla, garantizando una transición fluida a la producción cuando las tablas definitivas se entreguen.</p>

