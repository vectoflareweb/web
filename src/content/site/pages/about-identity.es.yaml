manufacturing_scope:
  heading: 'Alcance de Fabricación'
  body: |
    Nuestro alcance de fabricación cubre toda la cadena de producción para productos SUP hinchables y marinos — desde la inspección de material entrante hasta el empaque final y documentación de exportación.

    - **Categorías de productos**: Tablas SUP hinchables (polivalentes, travesía, surf, pesca, yoga, carreras), kayaks hinchables, botes hinchables, remos, bombas y accesorios.
    - **Tipos de construcción**: PVC monocapa, PVC bicapa, núcleo drop-stitch con carcasa de PVC. Especificaciones de construcción personalizadas por proyecto.
    - **Modelos de colaboración**: OEM (diseño del comprador), ODM (desarrollado por fábrica a partir del brief del comprador), marca privada/co-branding (marca aplicada a plataformas probadas).
    - **Certificaciones**: ISO 9001:2015 (gestión de calidad de fábrica), CE (modelos destinados a la UE, alcance por proyecto), BSCI (cumplimiento social), REACH (seguridad química), RoHS (sustancias restringidas).
    - **Capacidad de producción**: Más de 30,000 tablas anuales, más de 2,500 de producción mensual. Escalabilidad disponible con programación anticipada.

brand_positioning:
  heading: 'Posicionamiento de Marca'
  body: |
    Vectoflare ocupa una posición específica en el mercado — no somos una marca, somos un fabricante. Esta distinción moldea cada aspecto de cómo operamos:

    - **Nunca vendemos bajo nuestra propia marca.** Cada tabla que producimos lleva la marca del comprador. No competimos con nuestros clientes en ningún mercado, en ningún canal. Esta política es innegociable.
    - **No somos una empresa comercializadora.** Operamos la fábrica. El control de calidad, la ingeniería, la programación de producción y la documentación de exportación se gestionan internamente. No hay intermediarios entre su pedido y la planta de producción.
    - **Nos especializamos en productos hinchables.** Esto no es una actividad secundaria ni una categoría de producto entre muchas. Los productos SUP hinchables y marinos son nuestra competencia central. Cada máquina, cada proceso, cada puerta de control de calidad está optimizada para esta categoría de producto.
    - **Servimos a compradores profesionales.** Nuestros clientes son marcas, distribuidores, operadores de resorts, clubes y escuelas — no consumidores individuales. Nuestros precios, estructura de MOQ, documentación y comunicación están diseñados para relaciones B2B.

evidence_review:
  tagline: 'Evidencia y Verificación'
  title: 'ESPECIFICACIONES VERIFICADAS'
  body: 'Todas las afirmaciones organizativas y de fabricación en esta página son verificables. El certificado ISO 9001, informe BSCI, licencia comercial y documentos de registro de fábrica están disponibles bajo solicitud. Visitas de fábrica bienvenidas. Especificaciones verificadas por última vez 2026-08.'

faqs:
  tagline: Preguntas Frecuentes
  title: 'Identidad de Marca — Preguntas Frecuentes'
  items:
    - q: '¿Vectoflare es una empresa separada de Qingdao Vatrad Group?'
      a: 'No. Vectoflare es la marca orientada al comprador de Vectoflare, que es la división de fabricación marina de Qingdao Vatrad Group Co., Ltd. La entidad legal contratante para todos los pedidos es Qingdao Vatrad Group Co., Ltd. La fábrica, el equipo y el sistema de calidad son una sola operación.'
    - q: '¿Venden tablas bajo su propia marca?'
      a: 'No. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellos en ningún mercado. Esta es una política fundamental — no una posición temporal. Si encuentra una tabla con la marca Vectoflare en el mercado, no proviene de nuestra fábrica.'
    - q: '¿Puedo visitar la fábrica?'
      a: 'Sí. Recibimos visitas de fábrica y podemos organizar una auditoría estructurada que cubra todo el proceso de producción, puertas de control de calidad, almacén de materiales y revisión de documentación. Contáctenos para programar una visita.'
    - q: '¿Cuál es la relación entre Vectoflare y Vectoflare?'
      a: 'Vectoflare es el nombre de la división de fabricación dentro de Qingdao Vatrad Group. Vectoflare es la marca internacional orientada al comprador utilizada para servicios de fabricación OEM, ODM y marca privada. Se refieren a la misma operación — la división de fabricación marina en Laixi, Qingdao.'

