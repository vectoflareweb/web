hero:
  tagline: 'Identidad de Marca'
  title: '¿Quién Es Vectoflare?'
  subtitle: 'Vectoflare es la división de fabricación marina de Qingdao Vatrad Group Co., Ltd. — un fabricante especializado de tablas SUP hinchables y productos marinos hinchables en Laixi, Qingdao, China. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellos en ningún mercado.'

answer:
  label: 'En resumen'
  text: 'Entidad legal: Qingdao Vatrad Group Co., Ltd. División de fabricación: Vectoflare (marca Vectoflare). Fábrica: Laixi, Qingdao, Shandong, China. Alcance: Fabricación OEM, ODM y marca privada de tablas SUP hinchables, remos y productos marinos hinchables. Certificaciones: ISO 9001:2015, CE (modelos destinados a la UE), BSCI, REACH, RoHS. No vendemos bajo nuestra propia marca — cada tabla que producimos lleva la marca del comprador.'
  verified: '2026-08'

