hero:
  tagline: Centro de I+D
  title: Centro de I+D
  subtitle: Centrados en el progreso

intro:
  - El Centro de Investigación y Desarrollo (I+D) de Vectoflare es la fuerza motriz de nuestra misión de revolucionar el equipo de deportes acuáticos. Damos a los amantes de los deportes acuáticos de todo el mundo productos más seguros, cómodos y agradables mediante una innovación constante en tablas de paddle surf (SUP) y embarcaciones hinchables. Nuestro equipo dedicado de ingenieros, diseñadores y expertos apasionados de los deportes acuáticos está dando forma al futuro del sector, elevando constantemente el listón de la calidad, el rendimiento y la sostenibilidad.
  - Nuestras instalaciones de I+D reúnen bajo un mismo techo a científicos de materiales, arquitectos navales e ingenieros de producción. Desde la formulación de tejidos y la simulación de cascos hasta el desarrollo de procesos de soldadura y las pruebas de mar a escala real, cada etapa del desarrollo de producto está impulsada por datos y validada mediante ensayos.

mission:
  tagline: Nuestra misión
  title: Innovando el futuro de los deportes acuáticos
  pillars:
    - icon: lightning
