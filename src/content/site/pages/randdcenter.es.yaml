pillars:
  - title: Avance tecnológico
    desc: Innovamos en materiales, diseños y procesos de fabricación para ofrecer un rendimiento y una longevidad superiores del producto.
    icon: tech
  - title: Materiales avanzados
    desc: Investigamos PVC de vanguardia, Hypalon, composites y alternativas sostenibles para mejorar las características del producto.
    icon: materials
  - title: Sostenibilidad
    desc: 'Un compromiso central: dedicados a la gestión medioambiental mediante fabricación sostenible y materiales reciclables.'
    icon: sustainability

capabilities:
  tagline: Capacidades
  title: Capacidades de I+D
  subtitle: Cuatro disciplinas clave que nos dan control integral del desarrollo de producto, desde la investigación de materias primas hasta la certificación final.
  groups:
    - title: Ciencia de materiales y tecnología del tejido
      items:
        - Análisis y optimización de formulaciones de PVC y Hypalon
        - Desarrollo de aditivos de estabilización UV, retardancia de llama y antimicrobianos
        - Ingeniería de laminación multicapa y unión adhesiva
        - Ensayos de envejecimiento acelerado (UV, térmico, humedad, niebla salina)
    - title: Ingeniería de cascos e hidrodinámica
      items:
        - Diseño paramétrico de cascos 3D y optimización CFD
        - Análisis por elementos finitos de cargas estructurales y de impacto
        - Ensayos en canal hidrodinámico con modelos a escala y validación de rendimiento
        - Desarrollo de cascos a medida para perfiles de misión especiales
    - title: Tecnología de soldadura y unión
      items:
        - Desarrollo y optimización de procesos de soldadura dieléctrica RF
        - Métodos de soldadura por aire caliente, cuña caliente y ultrasónica
        - Cualificación de uniones adhesivas y cintas de sellado de costuras
        - Modelado de resistencia de soldaduras y predicción de vida útil
    - title: Ensayos, certificación y cumplimiento
      items:
        - Gestión de calidad y ensayos de cumplimiento CE
        - Soporte de ensayos y certificación por terceros independientes
        - Desarrollo de protocolos de ensayo personalizados para la cualificación de compras
        - Análisis de fallos en servicio e investigación de causas raíz

