answer:
  label: 'Straight answer'
  text: 'Custom SUP boards are designed in-house with SolidWorks 3D surfacing, ANSYS FEA and CFD — every board is simulated for stress distribution and deck stiffness with a mandatory safety factor ≥ 2.5 before prototyping. A custom shape takes 7–12 days to prototype; full custom mould tooling adds 15–20 days to the 25–35 day production lead time, with MOQ confirmed by project configuration (see our MOQ guide).'
  verified: '2026-08'

intro: 'The shape of a SUP board — its rocker, rail profile, nose and tail volume — determines how it paddles, turns and tracks. At {SITE.name}, our Board Engineering Studio combines CAD surfacing, finite element analysis (FEA) of drop-stitch structures, and production experience to deliver boards optimised for their intended use: all-around stability, touring glide or surf performance. Every custom board starts from your specification, not a generic shape from a catalogue.'

content_html: |
  <h2>Where strength meets hydrodynamics</h2>
  <p>An inflatable SUP board is a drop-stitch structure: thousands of polyester threads connect the top and bottom PVC skins, holding the deck flat at 12–15 PSI while the rail and nose geometry control how the board interacts with water. We design the 3D shape, simulate the inflated structure, and validate the result in-house before a single sample is cut.</p>

  <h2>Design tools and standards</h2>
  <p>Our digital engineering environment includes:</p>
  <table>
    <thead><tr><th>Capability</th><th>Software / Tool</th><th>Application</th></tr></thead>
    <tbody>
      <tr><td>3D parametric modelling</td><td>SolidWorks Professional</td><td>Board surface, rocker line, rail profile, handle &amp; fin integration</td></tr>
      <tr><td>Finite element analysis</td><td>ANSYS Mechanical</td><td>Drop-stitch core stress mapping, deck stiffness under load, handle-point reinforcement</td></tr>
      <tr><td>Computational fluid dynamics</td><td>Ansys Fluent</td><td>Hydrodynamic drag prediction, planing trim optimisation</td></tr>
      <tr><td>Lamination engineering</td><td>ESAComp</td><td>PVC layer stacking, fabric weight selection, weight estimation</td></tr>
      <tr><td>Mould surface review</td><td>Moldex3D</td><td>Weld-tool geometry review for RF welding</td></tr>
    </tbody>
  </table>

  <h2>Our engineering workflow</h2>
  <p>Every board design, whether a standard model or a fully custom project, follows a rigorous five-stage process:</p>
  <ol>
    <li><strong>Concept &amp; requirements gathering</strong> — We define rider weight range, intended use (all-around, touring, surf, yoga, rental fleet), length, width and thickness targets, and any special features (cargo systems, deck pads, tie-down points).</li>
    <li><strong>3D surfacing &amp; volume calculation</strong> — The board form is modelled in SolidWorks and checked for volume distribution, displacement and stability against the target rider weight.</li>
    <li><strong>Structural FEA</strong> — The inflated board is analysed under standing load, static (rider at centre, 100 kg) and dynamic (wave impact at the rail). Stress contours are reviewed; safety factor ≥ 2.5 is mandatory.</li>
    <li><strong>CFD drag optimisation</strong> — The hull is simulated at three loading conditions and five speeds. Wetted surface, trim angle and residual resistance are iteratively reduced.</li>
    <li><strong>Design review &amp; release</strong> — The complete engineering package (3D model, FEA report, CFD report, weight estimate, panel lay plan) is reviewed by our senior engineer before release to the prototype workshop.</li>
  </ol>

  <div class="not-prose my-10 p-6 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800">
    <p class="text-sm font-semibold text-gray-500 mb-3 uppercase tracking-wider">FEA Results — 11''0 All-Around Board (32'' Wide, 6'' Thick)</p>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">2.8 : 1</span>
        <span class="text-gray-500">Safety factor at 120 kg standing load</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">0 mm</span>
        <span class="text-gray-500">Deck deflection at 15 PSI, no load</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">3.2 mm</span>
        <span class="text-gray-500">Max deck flex under 120 kg rider</span>
      </div>
      <div class="p-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-950">
        <span class="block text-2xl font-bold text-blue-600">15 PSI</span>
        <span class="text-gray-500">Analysis pressure — working rating of the platform</span>
      </div>
    </div>
  </div>

  <h2>Customisation: your board, your rules</h2>
  <p>No two brands have identical requirements. A rental fleet needs a wide, stable all-around board with reinforced rails; a touring brand needs a longer displacement nose with cargo tie-downs; a surf-focused line needs a pulled-in tail and rocker profile. We do not force your range into pre-existing shapes — we design from your specification upward.</p>
  <p>Examples of recent custom board engineering projects:</p>
  <ul>
    <li>A 14'' touring SUP for an endurance paddling brand, with a displacement nose and recessed cargo deck (+15% waterline length for glide).</li>
    <li>A 10'6'' wide all-around board for a resort fleet, with double-layer side rails and a 220 lb rated capacity.</li>
    <li>A 9'' surf SUP with a pulled-in tail and progressive rocker, developed for a dedicated surf-school line.</li>
  </ul>

  <h2>Our engineers</h2>
  <p>The studio is led by a senior product engineer with 14 years of experience in inflatable product design, supported by two mechanical engineers specialised in FEA and CFD. All three hold advanced degrees in engineering from internationally recognised universities, and the team works directly with our production floor to ensure every design is manufacturable at container scale.</p>

  <h2>Partner with us on your next board</h2>
  <p>From the first concept sketch to the final stress report, our Board Engineering Studio is your partner in creating a board that is not just built — but engineered. We invest the simulation hours upfront so that every weld, every laminate layer, and every curve of the rail is there for a reason.</p>
  <p>Whether you need a minor modification to an existing model or a completely clean-sheet design, we are ready to discuss your requirements.</p>

