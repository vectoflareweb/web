values_section:
  title: How the Factory Works With Brands
  subtitle: 'Three principles that shape every project built by the Vectoflare factory.'
  columns: 3
  items:
    - title: Engineering Before Production
      description: 'Every project starts with requirements, drawings and a physical sample — hull shape, drop-stitch grade, graphics placement and packaging are validated before any production run, not discovered on the line.'
      icon: 'tabler:settings'
    - title: One Team, One Facility
      description: 'Design, cutting, welding, assembly and testing happen in one 12,500 m² facility. No trading-company handoffs: the people who answer your questions are the people who build your boards.'
      icon: 'tabler:building-factory-2'
    - title: Small First Runs
      description: 'Small-batch co-branding starts at 5–10 units and standard volume production runs 90–100+ units per batch (one 150 m drop-stitch roll), so brands validate the market before scaling — with tooling and artwork retained for reorders.'
      icon: 'tabler:layers-intersect'
services_section:
  title: What the Factory Delivers
  subtitle: 'The manufacturing services available to Vectoflare clients.'
  columns: 2
  items:
    - title: Custom SUP Development
      description: 'Requirement evaluation, specification, materials selection, graphics, prototyping, sample approval and production for custom inflatable SUP products.'
      icon: 'tabler:bulb'
    - title: Private Label Production
      description: 'Your logo, colors and packaging on proven commercial-grade platforms — board, deck pad, accessories and cartons all carry your identity, with no factory branding.'
      icon: 'tabler:tag'
    - title: OEM / ODM Manufacturing
      description: 'Full OEM and ODM inflatable SUP manufacturing from client drawings or co-developed designs, including custom molds for new board shapes.'
      icon: 'tabler:package'
    - title: Fleet Supply
      description: 'Branded board fleets for resorts, clubs, schools and rental operators, with matching accessories and fleet-friendly production runs.'
      icon: 'tabler:users-group'
certifications_section:
