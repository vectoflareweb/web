      description: 'Inflatable SUP and watercraft product lines comply with EU safety directives, with documentation provided for each market.'
      icon: 'tabler:certificate'
    - title: ISO 9001 Quality System
      description: 'Manufacturing facility operates under an ISO 9001 quality management system covering incoming material, in-process and final inspection.'
      icon: 'tabler:badge-check'
    - title: BSCI Social Compliance
      description: 'Social responsibility audited under BSCI, covering working conditions and factory compliance.'
      icon: 'tabler:shield-check'
    - title: REACH Material Compliance
      description: 'Materials comply with EU REACH regulation for chemical safety.'
      icon: 'tabler:flask'
    - title: USCG Approval
      description: 'US Coast Guard approved manufacturing for inflatable watercraft product lines.'
      icon: 'tabler:anchor'
    - title: Product Testing
      description: 'Buoyancy, load capacity, seam strength, UV resistance, abrasion resistance and pressure-hold testing on every production line.'
      icon: 'tabler:test-pipe'
