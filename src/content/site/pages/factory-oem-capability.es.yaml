answer:
  label: 'Respuesta directa'
  text: 'El MOQ se confirma según la configuración del proyecto, no con un número fijo: cada proyecto pasa por las etapas de muestra (1–2 unidades) y piloto (20–50 unidades), con una producción de volumen estándar de 90–100+ unidades por lote a partir de un rollo completo de drop-stitch de 150 m. Las muestras están listas en 7–12 días; la producción estándar se realiza en 25–35 días tras la confirmación del PO y el depósito.'
  verified: '2026-08'

intro: Vectoflare ofrece servicios OEM y ODM integrales para marcas, distribuidores y agencias gubernamentales de todo el mundo. Con más de 10 años de experiencia en exportación y una fábrica de 12.500 m² certificada ISO 9001 y BSCI, nos encargamos de todo, desde el diseño del producto y el desarrollo de moldes hasta la producción a gran escala, el embalaje y la gestión de exportación.

highlight:
  - value: 10+
    label: Años de experiencia OEM
    detail: Desde 2012
  - value: 50+
    label: Países de exportación
    detail: Alcance global
  - value: 200+
    label: Proyectos personalizados entregados
    detail: En todas las líneas de producto
  - value: 25–35
    label: Plazo de entrega estándar (días)
