hero:
  tagline: 'Choose Your Collaboration Path'
  title: 'OEM vs ODM vs Private Label — Which Model Fits Your Project?'
  subtitle: 'Three ways to work with a SUP factory, each with different ownership, investment and speed trade-offs. This guide explains the differences so you can choose the right path before your first inquiry.'

answer:
  label: 'Quick comparison'
  text: 'OEM: you own the design and specification — we manufacture to your drawings. ODM: our engineering team develops the board from your brief — you approve before production. Private Label: your brand on a proven existing platform with no structural changes — fastest route to market. All three paths run through the same plant, QC system and export team in Qingdao, China.'
  verified: '2026-08'

comparison_table:
  tagline: 'Side-by-Side'
  title: 'OEM / ODM / Private Label Comparison'
  subtitle: 'Key differences across design ownership, MOQ, tooling, lead time and intellectual property.'
  headers:
    dimension: Dimension
    oem: OEM Manufacturing
    odm: ODM Development
    pl: Private Label
  rows:
    - dimension: 'Who designs the board?'
      oem: 'You provide the specification, drawings or reference board'
      odm: 'Factory engineering team develops from your brief'
      pl: 'Existing factory platform — no design work needed'
    - dimension: 'Design ownership & IP'
      oem: 'You own all designs, moulds and intellectual property'
      odm: 'You own the final approved design; factory holds the development process IP'
      pl: 'Factory owns the platform design; you own your brand and graphics'
    - dimension: 'Mould / tooling'
      oem: 'Custom mould required for new shapes — one-time tooling fee, 15–20 extra days'
      odm: 'May require custom mould depending on spec — same tooling timeline'
      pl: 'No new mould — existing platform tooling used'
    - dimension: 'Minimum order quantity'
      oem: '90–100+ units per approved configuration'
      odm: '90–100+ units per approved configuration; pilot batches from 20–50'
      pl: '5–10 units (co-branding) or 20–50 (pilot batch on existing platform)'
    - dimension: 'Typical lead time'
      oem: '25–35 days + 15–20 days tooling if new mould'
      odm: '25–35 days + development iteration time (varies by complexity)'
      pl: '25–35 days (no tooling delay)'
    - dimension: 'Customization level'
      oem: 'Full — shape, construction, materials, graphics, packaging'
      odm: 'Full — factory proposes, you approve each element'
      pl: 'Graphics and packaging only — no structural changes'
    - dimension: 'Sample process'
      oem: '1–2 prototype samples in 7–12 days after spec approval'
      odm: '1–2 prototype samples in 7–12 days after design approval'
      pl: '1–2 samples in 7–12 days — platform already validated'
    - dimension: 'Best for'
      oem: 'Buyers with existing designs, reference boards or detailed specs'
      odm: 'Buyers with product ideas or market requirements but no detailed spec'
      pl: 'Buyers who need branded boards quickly without product development'

