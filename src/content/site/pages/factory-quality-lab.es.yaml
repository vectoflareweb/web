hero:
  tagline: Laboratorio de control de calidad
  title: Laboratorio de ensayos y garantía de calidad
  subtitle: 'Laboratorio de calidad independiente con procesos ISO 9001: cada unidad se prueba antes del envío'

answer:
  label: 'Respuesta directa'
  text: 'El 100% de las unidades se prueban a presión a 18,0 PSI durante 24 horas, con rechazo automático al superar 0,50 PSI de caída de presión. Los lotes de tejido crudo se verifican según ASTM D751 e ISO 4674, y las pruebas de pelado de soldaduras se realizan cada 50 unidades con un muestreo final AQL 2.5 según ISO 2859.'
  verified: '2026-08'

intro: Vectoflare opera un laboratorio de control de calidad dedicado que trabaja de forma independiente de la producción. Cada lote de materia prima y cada tabla de SUP terminada pasa por protocolos de inspección documentados antes de su liberación. Nuestro equipo de control de calidad informa directamente a la dirección, lo que garantiza decisiones de calidad imparciales.

highlights:
  - value: 100%
    label: Unidades probadas a presión
    detail: Cada cámara, cada tabla
  - value: 24 h
    label: Duración de la prueba de retención de aire
    detail: A 18,0 PSI de presión nominal
  - value: '&lt;5%'
    label: Caída de presión máxima permitida
    detail: En un periodo de mantenimiento de 24 horas
  - value: AQL 2.5
    label: Umbral de defectos graves
    detail: Según el muestreo ISO 2859

test_procedures:
  - title: Inspección de materiales primas
    description: Cada lote entrante de PVC, Hypalon, tejido drop-stitch y herrajes se prueba antes de su aceptación. Se verifican la resistencia a la tracción (ASTM D751), la resistencia al desgarro (ISO 4674) y la resistencia a los rayos UV. Los materiales no conformes se ponen en cuarentena y se devuelven.
    standards:
      - ASTM D751 (tracción)
      - ISO 4674 (desgar)
      - ISO 4892 (UV)
  - title: Puntos de control de calidad en proceso
    description: Los operadores de producción realizan autoinspecciones en cada etapa. Los auditores de control de calidad realizan muestreos aleatorios durante todo el turno. Las pruebas de pelado de costuras se realizan cada 50 unidades. Las comprobaciones dimensionales se realizan en el vigésimo panel.
    standards:
      - ASTM D751 (pelado)
      - Lista de control interna de 100 puntos
      - Muestreo ISO 2859
  - title: Prueba de retención de aire de 24 horas
    description: Cada cámara del tubo se infla a 18,0 PSI y se mantiene durante 24 horas. Los sensores de presión registran de forma continua con compensación de temperatura. Cualquier cámara que supere una caída de presión de 0,50 PSI activa una reinspección automática del lote.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Pruebas de carga y equilibrio
    description: Las tablas terminadas se prueban a su capacidad máxima nominal de estabilidad, francobordo y manejo. Cada tabla se prueba en el agua antes de la aprobación de la inspección final.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Máquina de ensayos universal (tracción)
    spec: '5 kN, conforme a ASTM D751'
  - name: Analizador de caída de presión
    spec: 'Multicanal, 0–50 psi, registro de datos'
  - name: Cámara de envejecimiento UV
    spec: 'ISO 4892, ciclos de 1.000 h'
  - name: Calibre de grosor (digital)
    spec: 'Resolución de 0,01 mm'
  - name: Comprobador de pelado (soldaduras)
    spec: 'Motorizado, capacidad de 50 N'
  - name: Cámara de temperatura
    spec: '-40 °C a +100 °C'
  - name: Tanque de detección de fugas
    spec: '6 m × 2 m, iluminado'

lab_evidence:
  tagline: Dosieres de informes de ensayo
  title: 'Descarga los informes de ensayo de laboratorio reales'
  subtitle: 'Los mismos registros controlados bilingües contra los que cierra nuestro equipo de calidad — estructura, métodos, criterios y resultados, con los campos confidenciales eliminados. Cada dosier corresponde a una de las siete puertas de inspección.'
  items:
    - title: 'IQC — Informes de materiales entrantes'
      description: 'Verificación de tejido, rollos de PVC, válvulas y componentes contra la especificación aprobada.'
      icon: tabler:file-certificate
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IQC (PDF)'
    - title: 'IPQC — Informes en proceso y de primera pieza'
      description: 'Registros de primera pieza e inspección en proceso contra la revisión bloqueada.'
      icon: tabler:file-check
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes IPQC (PDF)'
    - title: 'Estanqueidad — Registros de presión y fugas'
      description: 'Detección de fugas al 100% de las costuras, integridad de válvulas y retención de presión de 24 h.'
      icon: tabler:waves
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Descargar informes de estanqueidad (PDF)'
    - title: 'FQC — Informes de prueba final de la tabla'
      description: 'Inspección final contra la muestra aprobada — dimensiones, cosmética y caja de quillas.'
      icon: tabler:shield-check
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Descargar informes FQC (PDF)'
    - title: 'PSI — Informes de embalaje y pre-embarque'
      description: 'Registros de integridad del kit, grado de código de barras, marcas de caja y resistencia a caídas.'
      icon: tabler:package
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Descargar informes PSI (PDF)'
    - title: 'Liberación de envío y dosier de trazabilidad'
      description: 'Autorización de liberación y trazabilidad de lote vinculada a especificación, arte y BOM.'
      icon: tabler:history
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Descargar informes de liberación (PDF)'
    - title: 'Dosier de calidad completo'
      description: 'Un pack que cubre todo el sistema documental — QIP, registros de puertas, trazabilidad y control de NCR.'
      icon: tabler:books
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_COMPLETE_SUP_QUALITY_DOSSIER.pdf
      link_label: 'Descargar pack de documentación (PDF)'

