faqs:
  tagline: Distributor FAQ
  title: 'Wholesale Distribution Program — Frequently Asked Questions'
  items:
    - q: 'What is the minimum wholesale order for a new distributor?'
      a: 'New distribution partners typically open with a sample order followed by a first container scheduled to their season. Exact minimums depend on territory size and the chosen product range; your account manager confirms the opening volume during catalog selection.'
    - q: 'Are territories exclusive?'
      a: 'Yes. The Vectoflare distribution program is built on exclusive territories — each wholesale partner covers a defined country or region and receives pricing and program support for that market.'
    - q: 'Do you support drop-shipping?'
      a: 'Drop-ship capability is included in the distributor program. Samples, product packaging and handling are validated during the sample-order stage so drop-ship orders run cleanly from day one.'
    - q: 'What products can distributors order?'
      a: 'The complete Vectoflare catalog: inflatable SUP boards across all-around, touring and surf shapes, inflatable kayaks, pumps, paddles, life vests and care accessories. Most partners open with 4–8 best-selling SKUs and expand in later seasons.'
    - q: 'How are orders shipped?'
      a: 'Orders leave our factory on scheduled sailings, with forward ordering available to stabilize freight costs. Your dedicated account manager plans production and dispatch around your forecast and the season calendar.'
    - q: 'How do I apply?'
      a: 'Use the application form on this page or contact us directly. Applications are reviewed by the distribution team, and we respond with next steps, including territory mapping and a draft agreement, within a few working days.'

