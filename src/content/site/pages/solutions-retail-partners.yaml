meta:
  title: 'Custom & Private Label SUP Production For Retailers | {SITE}'
  description: 'Custom and private label SUP production for retail brands: board specifications, branded graphics, low trial MOQ and factory QC — from sample to bulk.'
  dateModified: '2026-08'

hero:
  tagline: Retail Brands
  title: 'Custom SUP Production For Retail Brands'
  subtitle: 'Retail brands launch their own paddle board line with our factory: board specifications developed from your requirements, your brand on the product, and production QC handled end to end.'
  image:
    src: https://assets.vectoflare.com/images/vectoflare/products/sup-series/sup-ocean-voyager-1.webp
    alt: Vectoflare SUP boards produced for a retail brand

answer:
  label: 'Straight answer'
  text: 'MOQ is confirmed by project configuration: retail brands start with a sample (1–2 units) or pilot batch (20–50 units, samples in 7–12 days), scale to a standard volume OEM run of 90–100+ units per design (25–35 days after PO and deposit), or invest in a custom mould for full bespoke lines (tooling adds 15–20 days). Every board is pressure-tested before shipping, with FOB, CIF or DDP terms from Qingdao.'
  verified: '2026-08'

margin_section:
  title: 'Production Stages For Retail Brands'
  subtitle: 'Start with a sample, pilot to validate, scale to a standard volume run, or invest in a custom mould — MOQ and lead times are set by the production path, not by guesswork.'
  items:
    - tier: 'Sample Stage'
      moq: '1–2 units'
      margin_note: 'Sample lead time 7–12 days'
      features:
        - 'Artwork development from your brand assets'
        - 'Physical sample for approval'
        - 'Standard platform QC'
    - tier: 'Pilot Stage'
      moq: '20–50 units'
      margin_note: 'Market validation on stock platforms'
      features:
        - 'Full-board graphics, logo and EVA layout'
        - 'Reorders on the same verified platforms'
        - 'Export documentation included'
    - tier: 'Custom Mould'
      moq: 'Confirmed by project config'
      margin_note: 'Tooling adds 15–20 days'
      features:
        - 'New board shape and mould development'
        - 'Full specification control'
        - 'Priority production allocation'

