nc_severity:
  tagline: Defect Severity & Authority
  title: Severity Classification & Disposition Authority
  subtitle: Not every non-conformance is handled at the same level — disposition authority scales with defect severity, from line-level sign-off to Material Review Board and customer concession.
  headers:
    severity: Severity
    examples: Typical Examples
    authority: Disposition Authority & Control
    control: Release Condition
  rows:
    - severity: 'Minor'
      examples: 'Carton corner crease, slight non-critical accessory misalignment'
      authority: 'Section QC lead + line supervisor on-site sign-off, replace or release'
      control: 'Recorded on the NCR; no impact on product function or customer requirements'
    - severity: 'Major'
      examples: 'Slow valve leakage, EVA misalignment beyond tolerance (>2 mm), missing accessory'
      authority: 'QC Manager + Technical Engineer issue a controlled rework instruction (SRI)'
      control: '100% independent re-test of the original failed and affected characteristics before release'
    - severity: 'Critical'
      examples: 'Drop-stitch chamber damage, rail bubble or crack under high pressure, customer logo misprint or color deviation'
      authority: 'Material Review Board (MRB) decision; written customer concession where required'
      control: 'No release without authorized concession; otherwise mandatory witnessed physical destruction'

nc_matrix:
  tagline: Engineering Protocol Matrix
  title: SUP Defect Disposition & Re-Inspection Matrix
  subtitle: Standard engineering protocols applied to the most common manufacturing deviations — the same quantified parameters customers can verify during audits.
  headers:
    defect: Defect Category
    protocol: Controlled Disposition Protocol
    validation: Independent Re-Inspection & Validation
  rows:
    - defect: 'Slow Valve Leakage'
      protocol: 'Isolate the board. Dismantle the valve core with a calibrated torque tool (25 N·m), clean the inner threads, replace the silicone O-ring and re-torque.'
      validation: 'Submerge in bubble solution; re-inflate to 18 PSI for a full 24h pressure-drop re-test (ΔP ≤ 0.05 PSI).'
    - defect: 'Rail Seam Air Bubbles'
      protocol: 'Quarantine the shift lot. Delaminate the bubble zone with a heat-assist nozzle, solvent-clean the surface, apply two-component PU adhesive under 5 bar pressure.'
      validation: '100% seam visual and tactile inspection; structural proof pressure test (18.0 PSI) plus 24h air-tightness hold.'
    - defect: 'EVA Pad Misalignment'
      protocol: 'Heat-assist peel with a temperature-regulated tool (80°C). Re-align using a precision acrylic positioning jig.'
      validation: 'Clearance tolerance verification (≤ ±1.5 mm), diamond pattern symmetry check, 100% edge bonding adhesion test.'
    - defect: 'Branding / Logo Typo'
      protocol: 'Immediate print line stop. Hold all printed panels. Review the vector revision with the client; zero unapproved alterations.'
      validation: 'Spectrophotometer color check (ΔE ≤ 1.5); 100% visual text alignment verification against the client-signed vector master PDF.'
    - defect: 'Packaging Mismatch / Missing SKU'
      protocol: 'Quarantine the export pallet. Unbox and perform a 100% itemized BOM check (pump, fin, leash, paddle, repair tube).'
      validation: 'Inline dynamic electronic checkweigher validation (±30 g variance); optical 2D barcode scanner verification.'

nc_scrap:
  tagline: Zero Market Leakage
  title: Witnessed Scrap & Destruction — Zero-Defect Anti-Diversion Protocol
  body: |
    Overseas brand partners need certainty that failed boards will never reach secondary retail, grey markets or e-commerce channels. Boards that cannot be brought into conformity are destroyed under a witnessed, recorded protocol:

    **1. Hardware & accessory shearing.** Under QA Director supervision, a hydraulic shear removes all 316 stainless-steel D-rings, carry-handle webbing and luggage buckles. The inflation valve assembly and the fin-box base (US-Box / snap-in fin) are cut out at the board root, eliminating any salvageable components.

    **2. Drop-stitch slitting & rail sectioning.** The internal drop-stitch core is cross-cut through board and deck with deep criss-cross slits (≥ 50 cm per cut), and the reinforced side rails are severed in at least 4 segments — permanently destroying sealing capability and buoyancy.

    **3. Video & photo vault.** The destruction is recorded as an uncut 1080p video with close-ups of the serial barcode, the shearing process, the core slitting and the final weighed scrap pile. The video is hashed (SHA-256) and archived on a controlled server for ≥ 5 years.

    **4. Certified waste disposal.** All PVC and drop-stitch fragments are weighed, logged in the outbound ledger and transported only by qualified polymer-recycling partners — no residue leaves the facility through any other channel.

    > **Brand protection guarantee:** QINGDAO VATRAD GROUP CO., LTD. guarantees 100% destruction of non-reworkable out-of-spec watercraft. Zero factory seconds or compromised boards will ever enter secondary retail, grey markets or e-commerce channels. The Scrap & Destruction Certificate (VAT-QA-SCRAP-CERT-2026) records the product, batch, MRB conclusion, witness photos and dual sign-off by the QA Director and Plant Manager.

