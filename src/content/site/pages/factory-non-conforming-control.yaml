nc_intro:
  tagline: Control of Non-Conforming Products
  title: What Happens When a Product Does Not Meet the Criteria
  body: |
    Products or components that do not meet the defined acceptance criteria are identified and controlled to prevent unintended use, further processing or shipment. The applicable acceptance criteria are based on the approved sample, technical specification, artwork, bill of materials, packaging requirements and project inspection plan.

    Non-conforming items are evaluated to determine the affected scope and the appropriate disposition. Depending on the issue, the item may be held, reworked under controlled instructions, replaced, rejected or otherwise handled through an approved process. Reworked or corrected items are re-inspected before release. Shipment release is permitted only after the relevant quality records are completed and the product meets the applicable acceptance criteria.

nc_flow:
  tagline: Standard 7-Step Closed-Loop
  title: From Identify to Corrective Action
  subtitle: 'One controlled loop for every non-conformance: identify, quarantine, review, rework or replace, re-inspect, release or reject, improve.'
  steps:
    - step: '01'
      title: Identify
      desc: 'Any identified non-conformance is recorded against the affected product, batch or component and assessed against the applicable project requirements. Detection can happen at incoming material, in-process control, final testing, packing or customer/third-party inspection.'
    - step: '02'
      title: Quarantine
      desc: 'Items are clearly identified and placed under controlled hold or quarantine status to prevent unintended use, further processing or shipment. HOLD / QUARANTINE / REJECTED labels carry the NCR number, SKU, batch, quantity, defect description and date.'
    - step: '03'
      title: Review
      desc: 'The affected scope and appropriate disposition are evaluated: single unit, shift lot, full batch or multiple batches — across shared material lots, artwork revisions, process stages and document revisions. Additional containment or tightened inspection is applied where required.'
    - step: '04'
      title: Rework or Replacement
      desc: 'Permitted rework follows approved instructions that identify the affected item, method, materials, inspection points and re-inspection requirements. Unapproved changes to the product specification, artwork, accessory configuration or packaging are never allowed. Replacement items re-enter the applicable inspection gates.'
    - step: '05'
      title: Re-Inspection
      desc: 'Reworked or corrected items are re-inspected against the applicable acceptance criteria. The original failed characteristic and any related characteristics potentially affected by rework are verified before release — by independent QC, and with a complete new 24h pressure test cycle for air-tightness repairs.'
    - step: '06'
      title: Release or Reject
      desc: 'Product is released only after the required re-inspection is completed and authorized quality personnel confirm conformity with the applicable project requirements. Items that cannot be brought into conformity are rejected, replaced, returned or dispositioned under controlled procedures — including witnessed physical destruction.'
    - step: '07'
      title: Corrective Action
      desc: 'Repeated, significant or systemic non-conformances are reviewed for root cause and corrective action (CAPA). Improvements may include updates to work instructions, material controls, inspection points, training, supplier management or document control.'

nc_pillars:
  tagline: Buyer Trust Pillars
  title: Three Controls That Protect Your Brand
  subtitle: 'The process is designed around the questions overseas buyers actually ask: will problems be hidden, will rework run out of control, and will repaired boards be re-verified.'
  features:
    - icon: 1
      icon_bg: blue
      title: Controlled Instructions Only
      desc: 'Rework is strictly governed by authorized Standard Rework Instructions (SRI). Unapproved field alterations, changing specifications, or modifying artwork without written authorization is strictly prohibited.'
    - icon: 2
      icon_bg: green
      title: Independent Re-Inspection
      desc: 'Reworked boards undergo 100% re-inspection by QA inspectors against the original acceptance criteria. Air-tightness repairs require a brand-new, complete 24h pressure test cycle — never a partial re-check.'
    - icon: 3
      icon_bg: purple
      title: Authorized Sign-off & Traceability
      desc: 'Shipment release is permitted solely after complete NCR documentation and authorized QC sign-off, with the batch status moving from HOLD to RELEASED. Systemic or repeated deviations automatically trigger root-cause CAPA workflows.'

