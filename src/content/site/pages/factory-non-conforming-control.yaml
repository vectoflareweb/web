faqs:
  tagline: FAQ
  title: Quality & Defect Control FAQ for Global Buyers
  items:
    - q: 'How do you guarantee reworked boards meet full safety standards?'
      a: 'Any reworked board is treated as a new unit and must complete the exact same full test cycle from zero — for air-tightness repairs, a complete 24h pressure test. Independent QC inspectors, not the rework operators, perform the release validation.'
    - q: 'Will the factory ship boards with minor cosmetic deviations without telling us?'
      a: 'Never. Any deviation affecting customer-approved golden samples, logo artwork, colorways or packaging requires a formal written Concession Agreement signed by the client before shipment release.'
    - q: 'What happens if a reworked board fails re-inspection?'
      a: 'The board is not released. It returns to a new disposition review, and if it cannot be brought into conformity it is replaced, rejected or destroyed under the witnessed scrap protocol. Repeated failure of the same defect class triggers root-cause CAPA.'
    - q: 'Can failed boards be sold as factory seconds or through other channels?'
      a: 'No. Non-reworkable out-of-spec boards are physically destroyed under the witnessed scrap protocol — hardware sheared, core and rails severed, video recorded with SHA-256 hash and archived for at least 5 years. The Scrap & Destruction Certificate is signed by the QA Director and Plant Manager.'
    - q: 'How is the affected scope assessed when a defect is found?'
      a: 'The scope is reviewed by product identification, production batch, material or component batch, process stage and applicable document revision. If the same material lot, artwork revision or workstation is involved, affected products are contained and checked accordingly.'
    - q: 'Do you need our approval before making a concession?'
      a: 'Yes. Any acceptance under a documented concession that affects customer requirements — approved samples, specification, artwork, packaging or acceptance criteria — requires written customer approval before release. Without it, the product is reworked per the original requirement, replaced or rejected.'
    - q: 'What documentation do we receive for a non-conformance?'
      a: 'The NCR record covers the NCR number, detection stage, product/SKU, batch, applicable document revisions, defect description, containment, disposition, rework instruction reference, re-inspection result and release or closure approval — available per your project quality agreement.'

