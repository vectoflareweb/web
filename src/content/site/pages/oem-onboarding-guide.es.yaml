checklist:
  heading: 'Qué Preparar Antes de Tu Brief de Proyecto'
  body: |
    Cuanto más completo sea tu brief, más rápida y precisa será la cotización. Esto es lo que debes tener listo:

    - **Especificaciones de tabla** — Largo, ancho, grosor, rango de peso del rider y uso previsto (touring, all-around, surf, pesca, yoga, etc.) objetivo. Si tienes dimensiones de tabla de referencia o un modelo competidor, inclúyelas.
    - **Archivos de diseño** — Arte vectorial (AI, SVG o PDF) para gráficos de tabla, logo de almohadilla EVA y cualquier branding secundario. Si el arte no está listo, un mood board o imágenes de referencia son suficientes para la factibilidad inicial.
    - **Volumen y cronograma del pedido** — Tu cantidad objetivo para el primer pedido y el calendario de temporada que necesitas cumplir. Incluso un rango aproximado ("20–50 tablas para marzo") es suficiente para confirmar factibilidad y disponibilidad de cupo.
    - **Requisitos de cumplimiento** — Mercados objetivo (UE, Norteamérica, Australia, etc.) y cualquier requisito específico de certificación o pruebas más allá de nuestro alcance estándar (CE, ISO 9001, BSCI, REACH, RoHS).
    - **Rango de presupuesto** — Un presupuesto indicativo por tabla o costo landed objetivo nos ayuda a recomendar la plataforma y el nivel de construcción adecuados. El precio exacto se confirma después de la revisión de ingeniería — nunca antes.

    Si aún no tienes todo esto, envía lo que tengas. Nosotros guiamos el resto.

