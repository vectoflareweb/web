faqs:
  tagline: FAQ
  title: 'Onboarding OEM — Preguntas Frecuentes'
  items:
    - q: '¿Cuánto tarda el proceso completo de onboarding?'
      a: 'La aprobación de muestras típicamente toma 2–4 semanas (incluyendo producción de muestras en 7–12 días y tu período de revisión). La primera serie de producción toma 6–8 semanas desde PO confirmado y depósito. Un casco a medida añade 15–20 días de desarrollo de molde. Cada puerta tiene un cronograma fijo que acuerdas por adelantado.'
    - q: '¿Necesito firmar un NDA antes de compartir mi diseño?'
      a: 'Un NDA está disponible de inmediato a petición — antes de que compartas cualquier especificación técnica o arte de propiedad. Fabricamos exclusivamente bajo las marcas de nuestros clientes y nunca competimos con ellos en ningún mercado. La misma política se aplica a una muestra de 1 tabla que a un programa de contenedor.'
    - q: '¿Cuál es el pedido mínimo para una primera serie OEM?'
      a: 'El punto de entrada es escalonado: primero 1–2 muestras (listas en 7–12 días), un pedido de prueba o piloto de 20–50 tablas (producción en 25–35 días), y luego series de volumen estándar de 90–100+ tablas por configuración aprobada. El co-branding de lotes pequeños parte desde 5–10 unidades cuando no se necesita etapa de desarrollo. Las tarifas de muestra se acreditan a tu pedido de producción.'
    - q: '¿Cómo se maneja la protección de IP durante el onboarding?'
      a: 'Tus diseños y especificaciones están protegidos bajo el NDA firmado antes de que se comparta cualquier información de propiedad. Todos los archivos de arte, datos de BOM y archivos técnicos se almacenan en sistemas con control de acceso y trazabilidad de auditoría. En modo OEM, tú posees todo el IP. En modo ODM, el IP de la plataforma adaptada se comparte según acuerdo. En modo Private Label, el IP permanece con Vectoflare y tú licencias la aplicación de marca.'
    - q: '¿Qué garantías de calidad aplican a un primer pedido?'
      a: 'Cada tabla — muestra, prueba o volumen — pasa por el mismo sistema de inspección de 7 etapas: inspección de material entrante, inspección de tela drop-stitch, soldadura y ensamblaje, pruebas de presión y hermeticidad de 24 horas (sostenimiento a 18.0 PSI, auto-rechazo por caída superior a 0.50 PSI), instalación de almohadilla EVA y accesorios, QC de gráficos y branding, y empaque y documentación final. La calidad nunca se reduce para pedidos más pequeños.'

