hero:
  tagline: 'Brand Identity'
  title: 'Who Is Vectoflare?'
  subtitle: 'Vectoflare is the marine manufacturing division of Qingdao Vatrad Group Co., Ltd. — a specialized inflatable SUP and marine inflatable products manufacturer in Laixi, Qingdao, China. We manufacture exclusively under the brands of our clients and never compete with them in any market.'

answer:
  label: 'In brief'
  text: 'Legal entity: Qingdao Vatrad Group Co., Ltd. Manufacturing division: Vectoflare (Vectoflare brand). Factory: Laixi, Qingdao, Shandong, China. Scope: OEM, ODM and private-label manufacturing of inflatable SUP boards, paddles and marine inflatables. Certifications: ISO 9001:2015, CE (EU-destined models), BSCI, REACH, RoHS. We do not sell under our own brand — every board we produce carries the brand of the buyer.'
  verified: '2026-08'

