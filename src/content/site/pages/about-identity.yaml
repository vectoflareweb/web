manufacturing_scope:
  heading: 'Manufacturing Scope'
  body: |
    Our manufacturing scope covers the full production chain for inflatable SUP and marine products — from raw material incoming inspection through final packaging and export documentation.

    - **Product categories**: Inflatable SUP boards (all-around, touring, surf, fishing, yoga, racing), inflatable kayaks, inflatable boats, paddles, pumps and accessories.
    - **Construction types**: Single-layer PVC, double-layer PVC, drop-stitch core with PVC shell. Custom construction specifications per project.
    - **Collaboration models**: OEM (buyer-owned design), ODM (factory-developed from buyer brief), private-label/co-branding (brand applied to proven platforms).
    - **Certifications**: ISO 9001:2015 (factory quality management), CE (EU-destined models, scope per project), BSCI (social compliance), REACH (chemical safety), RoHS (restricted substances).
    - **Production capacity**: 30,000+ boards annually, 2,500+ monthly output. Scale-up available with advance scheduling.

brand_positioning:
  heading: 'Brand Positioning'
  body: |
    Vectoflare occupies a specific position in the market — we are not a brand, we are a manufacturer. This distinction shapes every aspect of how we operate:

    - **We never sell under our own brand.** Every board we produce carries the brand of the buyer. We do not compete with our clients in any market, in any channel. This policy is non-negotiable.
    - **We are not a trading company.** We operate the factory. Quality control, engineering, production scheduling and export documentation are all managed in-house. There are no intermediaries between your order and the production floor.
    - **We specialize in inflatable products.** This is not a sideline or one product category among many. Inflatable SUP and marine products are our core competence. Every machine, every process, every QC gate is optimized for this product category.
    - **We serve professional buyers.** Our clients are brands, distributors, resort operators, clubs and schools — not individual consumers. Our pricing, MOQ structure, documentation and communication are designed for B2B relationships.

evidence_review:
  tagline: 'Evidence & Verification'
  title: 'SPECIFICATIONS VERIFIED'
  body: 'All organizational and manufacturing claims on this page are verifiable. ISO 9001 certificate, BSCI report, business license and factory registration documents are available on request. Factory visits welcome. Specifications last verified 2026-08.'

faqs:
  tagline: FAQ
  title: 'Brand Identity — Frequently Asked Questions'
  items:
    - q: 'Is Vectoflare a separate company from Qingdao Vatrad Group?'
      a: 'No. Vectoflare is the buyer-facing brand of Vectoflare, which is the marine manufacturing division of Qingdao Vatrad Group Co., Ltd. The legal contracting entity for all orders is Qingdao Vatrad Group Co., Ltd. The factory, team and quality system are one operation.'
    - q: 'Do you sell boards under your own brand?'
      a: 'No. We manufacture exclusively under the brands of our clients and never compete with them in any market. This is a core policy — not a temporary position. If you find a Vectoflare-branded board on the market, it is not from our factory.'
    - q: 'Can I visit the factory?'
      a: 'Yes. We welcome factory visits and can arrange a structured audit covering the full production process, QC gates, material warehouse and documentation review. Contact us to schedule a visit.'
    - q: 'What is the relationship between Vectoflare and Vectoflare?'
      a: 'Vectoflare is the manufacturing division name within Qingdao Vatrad Group. Vectoflare is the international buyer-facing brand used for OEM, ODM and private-label manufacturing services. They refer to the same operation — the marine manufacturing division in Laixi, Qingdao.'

