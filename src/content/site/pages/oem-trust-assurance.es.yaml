  tagline: 'Fabricación que puedes verificar'
  title: 'Confianza y Garantía de Fábrica OEM'
  subtitle: 'Cada afirmación de este sitio se puede verificar: registro oficial de la empresa, una fábrica física de 12.500 m² que puedes visitar o auditar, ingenieros reales bajo NDA, documentos QMS descargables y datos de ensayo registrados por número de serie. Ingeniería y operación de Qingdao Vatrad Group Co., Ltd.'

answer:
  label: 'Respuesta directa'
  text: 'La confianza no es una promesa — es documentación. Somos una entidad manufacturera china registrada (Qingdao Vatrad Group Co., Ltd.) con una planta física de 12.500 m² en Qingdao, más de 350 trabajadores y más de 120.000 tablas de capacidad anual. Puedes verificar el registro, auditar la fábrica, revisar los SOP de QMS, descargar registros de calidad de muestra, programar inspecciones de terceros (SGS, TÜV, BV o Intertek) y firmar un NDA en un plazo de 4 horas laborables. Cada tabla se prueba a presión a 18,0 PSI durante 24 horas con rechazo automático por encima de 0,50 PSI de caída, y cada lote conserva trazabilidad ERP de 10 años. Si una afirmación no se puede documentar, no la hacemos.'
  verified: '2026-08'

