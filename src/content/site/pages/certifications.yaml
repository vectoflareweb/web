traceability:
  tagline: Batch-Level Traceability
  title: 'Four Questions Every Batch Answers'
  subtitle: 'Quality records are maintained by production batch and linked to the applicable product specification, artwork, BOM and packing requirements. This supports investigation and controlled action if a quality issue is identified. During a buyer audit, our quality team answers these four questions on the floor — each answer points to a controlled record.'
  items:
    - title: 'What was produced?'
