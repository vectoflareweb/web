meta:
  title: 'Custom SUP Quality Control: 7-Stage Inspection | Vectoflare'
  description: 'How every custom SUP order is controlled: 7 inspection gates from pre-production planning to shipment release, with downloadable bilingual reports.'
  dateModified: '2026-08-15'
  keywords:
    - 'sup quality control'
    - 'sup factory inspection'
    - 'oem quality inspection plan'
    - 'pre shipment inspection sup'
    - 'ce certification sup'
    - 'iso 9001 sup'
hero:
  tagline: Quality Control for Custom Projects
  title: 'Quality Control for Custom Inflatable SUP Projects'
  subtitle: 'Quality is verified against the approved sample, technical specification, artwork, bill of materials and packaging requirements for each project — not against a general claim. From incoming materials to shipment release, our inspection process is structured to verify product conformity at defined production stages. Powered by QINGDAO VATRAD GROUP, the 12,500 m² inflatable SUP factory behind vectoflare.'
stats:
  - value: 100%
    label: Units pressure-tested
  - value: '7'
    label: Controlled inspection gates
  - value: 18.0 PSI
    label: 24-hour pressure hold
  - value: ISO 9001
    label: Quality certified
quality_basis:
  tagline: Quality Basis
  title: 'What Defines Product Acceptance'
  subtitle: 'Final acceptance criteria are established before production release. These controlled project documents define what is to be made, how key details are verified and what must be checked before shipment — approved with the buyer and frozen in the Quality Inspection Plan (QIP). Any change request goes through documented change control, never silently through the line.'
  items:
    - title: 'Approved Sample'
      description: 'The physical reference board signed off by the buyer. Every finished board is compared against it for dimensions, profile, stiffness and finish.'
      icon: tabler:medal
    - title: 'Technical Specification'
      description: 'Materials, construction and dimensional drawings locked to a revision number. The FAI verifies the first article against this exact revision.'
      icon: tabler:file-check
    - title: 'Approved Artwork'
      description: 'Artwork, print colors and placement approved and version-locked before cutting, so every deck ships in the look the brand approved.'
      icon: tabler:palette
    - title: 'Customer Approved BOM'
      description: 'Bill of materials — board, paddle, pump, leash, bag, manual — confirmed by the buyer. The PSI checks 100% kit completeness against this BOM.'
      icon: tabler:list-checks
    - title: 'Packaging & Labeling Requirements'
      description: 'Carton structure, markings, barcodes, label content and shipping marks fixed in writing. Barcode readability and marking accuracy are verified at PSI.'
      icon: tabler:package
tests:
  - title: Pressure Testing
    description: Inflatable chambers are subjected to pressures exceeding their recommended operating limits for extended periods. This verifies the airtightness and structural integrity of the material and seams, ensuring the product can withstand intended use and potential over-inflation without failure or leaks.
    image: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-pressure-testing.webp
    alt: Inflatable SUP chamber under pressure testing to verify airtightness
  - title: Impact Testing
    description: Products are subjected to controlled impacts from various weights and angles. This assesses the material's resistance to punctures, tears, and damage from collisions with obstacles in the water, demonstrating durability and longevity.
    image: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-production-department.webp
    alt: Impact testing rig assessing inflatable boat material puncture resistance
  - title: UV Resistance Testing
    description: Material samples are exposed to accelerated UV radiation to verify they do not yellow, crack, or lose strength over time. Each PVC batch is checked against solar degradation before use in production.
    image: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-uv-resistance-testing.webp
    alt: PVC material samples under accelerated UV radiation in resistance testing
  - title: Abrasion Resistance Testing
    description: Material samples are rubbed against abrasive surfaces for a specified number of cycles under controlled pressure. This measures the material's ability to withstand wear and tear from repeated use, contact with sand, rocks, or other surfaces, ensuring long-term durability.
    image: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-pvc-material-testing.webp
    alt: Abrasion test machine rubbing PVC fabric sample to measure wear resistance
  - title: Low-Temperature Performance Testing
    description: Products are tested in cold environments to assess functionality and durability in various temperature conditions, preventing stiffness or cracking in colder waters. Essential for boats destined for winter or high-latitude use.
    image: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-factory-exterior.webp
    alt: Inflatable product inside cold chamber for low-temperature performance testing
  - title: Buoyancy & Load Capacity Testing
    description: Products are tested with various weights to determine their maximum load-bearing capacity and ensure they safely support users and gear. Every model's rated capacity is verified before release.
    image: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-stock-boat-inventory.webp
    alt: Buoyancy and load capacity test with weights on inflatable watercraft
  - title: Maneuverability Testing
    description: Products are tested for their responsiveness to paddling or motor inputs, evaluating turning radius and ease of handling. On-water trials validate that real-world handling matches design specifications.
    image: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-sup-manufacturing.webp
    alt: On-water maneuverability testing of inflatable SUP and boat hulls
  - title: Watertightness Testing
    description: Fully assembled products are submerged or subjected to water spray to check for any leaks through seams, valves, or materials. Every boat passes a mandatory watertightness check before shipping.
    image: https://assets.vectoflare.com/images/vectoflare/factory/vectoflare-production-department-2.webp
    alt: Submersion watertightness test checking seams and valves for leaks
qc_flow:
  tagline: The 7-Stage Inspection Flow
  title: 'Seven Controlled Quality Gates, End to End'
  subtitle: 'Each gate below is defined in the project Quality Inspection Plan with its inspection object, method, acceptance criteria and record output. The bilingual report dossiers are real controlled records — open any of them to see the actual structure.'
  obj_label: Inspection object
  method_label: Inspection method
  criteria_label: Acceptance criteria
  record_label: Record output
  stages:
    - stage: STAGE 01
      title: 'Project Quality Planning (PPM)'
      summary: 'The pre-production meeting locks scope, baselines and inspection plan before the line starts.'
      checks:
        - 'Product name, internal code, customer SKU, order number and batch definition are recorded.'
        - 'Board type, drop-stitch core, materials, rail bands, EVA, valves and fin system are specified.'
        - 'Artwork file name, version, colors, logo position and printing area are locked and approved.'
        - 'BOM — every item per set with quantity, color, part number and substitution rules — is customer-approved.'
        - 'Packaging, labeling, barcodes, language of manuals and third-party inspection arrangements are fixed in writing.'
      object: 'Project scope vs. customer requirements — materials, dimensions, artwork, packaging, target market and applicable standards.'
      method: 'Pre-production meeting with sales, engineering and QC; Golden Sample sign-off; Quality Inspection Plan (QIP) issued for the order.'
      criteria: 'All five baselines approved and frozen before mass production starts. Unresolved items block production release.'
      record: 'QIP + PPM minutes, approved sample records.'
      image: https://assets.vectoflare.com/site/quality/node01-ppm.avif
      alt: Pre-production meeting reviewing the golden sample and quality inspection plan for an OEM SUP order
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_SUP_OEM_QIP.pdf
      link_label: 'Download QIP (PDF)'
    - stage: STAGE 02
      title: 'Incoming Material Inspection (IQC)'
      summary: 'Raw materials are verified against the approved supplier specification before they enter production.'
      checks:
        - 'Drop-stitch fabric, PVC rolls, rail material and EVA deck pads checked against the approved sample — color, thickness, weight and surface defects.'
        - 'Valves, fin boxes, D-rings, handles and hardware checked for type, size, finish, rust and correct function.'
        - 'Pumps, paddles, leashes, bags and repair kits verified for model, color and project configuration.'
        - 'Supplier certificates (COA), material declarations and REACH/RoHS compliance documents reviewed per batch.'
        - 'Non-conforming lots are quarantined and returned before any material reaches the line.'
      object: 'Drop-stitch fabric, PVC rolls, valves, fins, accessories and packaging materials against the approved spec and supplier test certificates.'
      method: 'Visual, dimensional and weight checks; batch sampling per AQL; material certificates reviewed; approved supplier list enforced.'
      criteria: 'Meets approved specification and certificates. Non-conforming lots are quarantined and rejected before release to the line.'
      record: 'IQC test reports with lot references and dispositions.'
      image: https://assets.vectoflare.com/site/quality/node02-iqc.avif
      alt: Incoming material inspection of PVC fabric and SUP components at the factory
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_IQC_TEST_REPORTS.pdf
      link_label: 'Download IQC reports (PDF)'
    - stage: STAGE 03
      title: 'In-Process Control & First Article (IPQC / FAI)'
      summary: 'Construction methods and checkpoints are selected according to the approved board platform and project configuration. The first article is checked against the locked baselines; every shift keeps patrol checks on the line.'
      checks:
        - 'First article verified against approved sample, technical drawing, BOM, artwork and packaging files before mass production starts.'
        - 'Board dimensions, outline and symmetry measured; ink and logo direction, position, colors and revision confirmed.'
        - 'Seams and rail continuity checked for gaps, delamination, wrinkles, contamination or misalignment on the line.'
        - 'Valve, D-ring, handle and fin-box installation checked for position, quantity and fit against the customer-approved BOM.'
        - 'FAI approval version-locks artwork, dimensions and BOM; deviations route to the rework decision flow — never inline patching.'
      object: 'First article and in-process assemblies — seams, rails, fin box, valve base, artwork position, hardware torque.'
      method: 'First Article Inspection on the first unit; patrol checks per shift; weld strength and seam alignment verified inline.'
      criteria: 'FAI approval version-locks artwork, dimensions and BOM. Deviations route to the rework decision flow — never inline patching.'
      record: 'FAI record, shift patrol logs, rework and disposition notes.'
      image: https://assets.vectoflare.com/site/quality/node03-ipqc-fai.avif
      alt: In-process inspection and first article check during SUP production
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_IPQC_TEST_REPORTS.pdf
      link_label: 'Download IPQC reports (PDF)'
    - stage: STAGE 04
      title: 'Inflation & Air-Tightness Testing'
      summary: 'Every completed board undergoes inflation and air-tightness verification before packing — 100% of units, not a sample.'
      checks:
        - 'Board surface, rails and valve area checked for pinholes, cracks, abnormal folds or delamination before inflation.'
        - 'Chambers inflated with a calibrated digital gauge to the project test pressure and initial reading locked.'
        - 'Valve core, valve base and rail seams checked around the full circumference — nose, tail and curved areas.'
        - '24-hour pressure hold with continuous logging; automatic reject above the allowed pressure drop.'
        - 'Failed boards are quarantined, reworked under instruction and fully re-tested — not just re-checked at the repair point.'
      object: '100% of inflated chambers — full-seam leak detection, valve integrity and pressure-drop retention.'
      method: 'Full-seam leak detection followed by a 24-hour pressure hold at 18.0 PSI; automatic reject above a 0.50 PSI drop.'
      criteria: 'Zero leak points and pressure drop within 0.50 PSI per chamber; failed units are quarantined and reworked or scrapped.'
      record: 'Air-tightness test reports, one per chamber, linked to the batch.'
      image: https://assets.vectoflare.com/site/quality/node04-airtightness.avif
      alt: Inflation and air-tightness testing of an inflatable SUP chamber
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_AIRTIGHTNESS_TEST_REPORTS.pdf
      link_label: 'Download air-tightness reports (PDF)'
    - stage: STAGE 05
      title: 'Final Product Inspection (FQC)'
      summary: 'Finished boards are measured and cosmetically graded against the approved golden sample.'
      checks:
        - 'Key dimensions — length, width and thickness — measured at working pressure against drawing tolerances.'
        - 'Board outline, rocker and symmetry verified; no abnormal distortion, twist or warping after inflation.'
        - 'Cosmetics graded under D65 daylight lamps: scratches, stains, glue marks, bubbles, wrinkles, color deviation.'
        - 'Functional checks: valve open/close and cap fit, fin insertion and locking, D-rings, handles and paddle function.'
        - 'Configuration verified against the customer-approved BOM and SKU — accessories, labels, barcodes and serial numbers.'
      object: 'Finished board vs. golden sample — dimensions, rocker, profile, cosmetics, fin-box fitment and accessory completeness.'
      method: 'Dimensional verification against drawing tolerances; cosmetics graded under D65 daylight lamps; fin box and hardware fit tests.'
      criteria: 'Dimensions within tolerance (e.g. 3508 × 814 × 150.3 mm), cosmetic grade per approved sample, all accessories present.'
      record: 'FQC reports with inspector sign-off and disposition.'
      image: https://assets.vectoflare.com/site/quality/node05-fqc.avif
      alt: Final product inspection of finished SUP boards before packing
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_FQC_TEST_REPORTS.pdf
      link_label: 'Download FQC reports (PDF)'
    - stage: STAGE 06
      title: 'Packaging & Pre-Shipment Inspection (PSI)'
      summary: 'The packed kit is checked for completeness, marking accuracy and shipment readiness.'
      checks:
        - '100% kit completeness vs. BOM: board, paddle, pump, leash, bag, repair kit and manual — one set at a time.'
        - 'Fragile parts protected (pump and blade bags), board folded per packing SOP, accessories match model and color.'
        - 'Carton graphics, brand, warnings and language versions verified against the approved artwork revision.'
        - 'Barcode type, number, position and scannability verified; shipping marks, SKU, PO, carton number and quantity correct.'
        - 'Carton size, gross/net weight and inner packing match the packing specification; drop-test result recorded when required.'
      object: 'Packed kit — board, paddle, pump, leash, bag, manual — against the customer-approved BOM and packaging spec.'
      method: '100% kit completeness vs. BOM; barcode scan (Grade ≥ B); carton marking accuracy; ISTA-1A drop test on packed cartons.'
      criteria: '100% kit match to BOM, readable barcodes, correct markings and drop-safe packing before loading.'
      record: 'PSI checklists and packing records per carton.'
      image: https://assets.vectoflare.com/site/quality/node06-psi.avif
      alt: Pre-shipment inspection checking the packed SUP kit against the BOM
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_PSI_TEST_REPORTS.pdf
      link_label: 'Download PSI reports (PDF)'
    - stage: STAGE 07
      title: 'Shipment Release & Traceability'
      summary: 'Quality signs off the batch only when all six previous gates are closed and every record is complete.'
      checks:
        - 'Production batch, order number, SKU, quantity and carton count match the packing list and commercial invoice.'
        - 'Specification, BOM, artwork and packaging files are all at the current approved revision.'
        - 'IQC, FAI, in-process, air-tightness, FQC and PSI records are complete for the batch being released.'
        - 'All non-conformances are resolved, reworked, re-inspected and closed — no open items on the release.'
        - 'Traceability fields recorded per batch: project code, PO, SKU, artwork/BOM/packaging revisions, production date, inspector and record numbers.'
      object: 'Release authorization for the batch — all gates closed, records complete, serial numbers mapped to the batch.'
      method: 'Gate review of all six preceding records by quality; batch traceability dossier assembled; records handed over with the shipment.'
      criteria: 'All gates approved by QA; batch records and traceability dossier delivered to the buyer or kept under NDA on request.'
      record: 'Shipment release authorization and batch traceability dossier.'
      image: https://assets.vectoflare.com/site/quality/node07-shipment-release.avif
      alt: Shipment release sign-off and batch traceability record handover
      link: https://assets.vectoflare.com/site/downloads/QINGDAO_VATRAD_GROUP_SHIPMENT_RELEASE_REPORTS.pdf
      link_label: 'Download release reports (PDF)'
system_map:
  tagline: The Quality System
  title: 'One System, Four Controlled Standards'
  subtitle: 'The seven gates above run on four documented standards, each published as a controlled procedure you can download and audit. Together they form the QMS behind every OEM/ODM order — inspection criteria, change control, non-conformance and laboratory testing.'
  items:
    - title: 'Inspection & Release Standards'
      description: 'The project QIP drives every gate: inspection object, method, acceptance criteria and record output per order. Includes the 4-stage QC framework, traceability chain, quarantine flow, defect matrix and the 00–15 documentation register.'
      icon: tabler:clipboard-check
      link: /factory/quality-inspection
      link_label: 'Inspection standards & QMS downloads'
    - title: 'Rework Change Control'
      description: 'No rework parameter changes without documented control: containment, risk classification, 9-step change loop, approval matrix and validation. Any change to approved specs, samples, BOMs or acceptance criteria requires written customer approval.'
      icon: tabler:git-branch
      link: /factory/quality-change-control
      link_label: 'Change control standard'
    - title: 'Non-Conforming Product Control'
      description: 'A closed 7-step loop under ISO 9001:2015 clause 8.7: identify, quarantine, disposition per NCR, rework or reject, re-inspect, release, correct. Includes severity authority, SUP defect disposition matrix and witnessed destruction.'
      icon: tabler:alert-triangle
      link: /factory/non-conforming-control
      link_label: 'Non-conforming product control standard'
    - title: 'Laboratory Testing & Equipment'
      description: 'The quality lab operates independently from production: tensile, pressure decay, UV weathering, weld peel, leak detection and temperature chambers — with the calibration and test procedures behind our published claims.'
      icon: tabler:flask
      link: /factory/quality-lab
      link_label: 'Quality lab & test equipment'
    - title: 'Material Testing Lab (R&D)'
      description: 'The R&D center runs independent material testing for PVC/Hypalon formulations, accelerated ageing and certification support, feeding the standards production uses.'
      icon: tabler:microscope
      link: /randdcenter/quality-inspection-lab
      link_label: 'R&D material testing lab'
