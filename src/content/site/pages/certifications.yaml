non_conformance:
  tagline: Control of Non-Conforming Products
  title: 'When a Defect Is Found: Contain, Decide, Document'
  subtitle: 'Products or components that do not meet the defined acceptance criteria are identified and placed under controlled hold. Rework or replacement is permitted only through the applicable quality procedure, followed by re-inspection before authorized release.'
  items:
    - title: 'Detect & Segregate'
      description: 'Failed units are red-tagged and moved to the quarantine station — no further processing or packing until disposition.'
      icon: tabler:alert-triangle
    - title: 'Disposition per NCR'
      description: 'Quality issues a Non-Conformance Report and routes the unit to rework, re-inspection, reject or scrap according to the disposition matrix.'
      icon: tabler:git-branch
      link: /factory/non-conforming-control
      link_label: 'Non-conforming product control standard'
    - title: 'Verify & Release'
      description: 'Reworked units are re-inspected against the same criteria; the NCR is closed only after re-verification passes.'
      icon: tabler:shield-check
    - title: 'Scrap Control'
      description: 'Scrapped material is destroyed with a signed scrap certificate, so it can never re-enter stock or the market.'
      icon: tabler:trash
      link: https://assets.vectoflare.com/site/downloads/scrap-destruction-certificate-vat-qa-scrap-cert-2026.pdf
      link_label: 'Scrap & destruction certificate (PDF)'
    - title: 'Root-Cause Feedback'
      description: 'Repeated defects trigger corrective action with the responsible process or supplier — closed-loop, not paperwork.'
      icon: tabler:refresh
      link: https://assets.vectoflare.com/site/downloads/rework-change-control-sop-qms-sop-qc-cc-001.pdf
      link_label: 'Rework change control SOP (PDF)'
