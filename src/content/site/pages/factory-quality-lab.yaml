hero:
  tagline: Quality Control Laboratory
  title: Testing Laboratory & Quality Assurance
  subtitle: Independent quality lab with ISO 9001 processes —every unit tested before shipment

answer:
  label: 'Straight answer'
  text: '100% of units are pressure-tested at 18.0 PSI for 24 hours, with auto-reject above a 0.50 PSI pressure drop. Raw fabric batches are verified to ASTM D751 and ISO 4674, and weld peel tests run every 50 units with AQL 2.5 final sampling per ISO 2859.'
  verified: '2026-08'

intro: Vectoflare operates a dedicated quality control laboratory that operates independently from production. Every batch of raw material and every finished SUP board passes through documented inspection protocols before release. Our QC team reports directly to management, ensuring impartial quality decisions.

highlights:
  - value: 100%
    label: Units pressure-tested
    detail: Every chamber, every board
  - value: 24 h
    label: Air retention test duration
    detail: At 18.0 PSI rated pressure
  - value: '&lt;5%'
    label: Max allowed pressure drop
    detail: Over 24-hour hold period
  - value: AQL 2.5
    label: Major defect threshold
    detail: Per ISO 2859 sampling

test_procedures:
  - title: Raw Material Inspection
    description: Every incoming batch of PVC, Hypalon, drop-stitch fabric, and hardware is tested before acceptance. Tensile strength (ASTM D751), tear resistance (ISO 4674), and UV resistance are verified. Non-conforming materials are quarantined and returned.
    standards:
      - ASTM D751 (tensile)
      - ISO 4674 (tear)
      - ISO 4892 (UV)
  - title: In-Process QC Checkpoints
    description: Production operators perform self-inspection at each stage. QC auditors conduct random sampling throughout the shift. Weld peel tests are performed every 50 units. Dimensional checks happen every 20th panel.
    standards:
      - ASTM D751 (peel)
      - Internal 100-point checklist
      - ISO 2859 sampling
  - title: 48-Hour Air Retention Test
    description: Every tube chamber is inflated to 18.0 PSI and held for 24 hours. Pressure sensors log continuously with temperature compensation. Any chamber exceeding 0.50 PSI pressure drop triggers automatic batch re-inspection.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Load & Balance Testing
    description: Completed boards are tested at maximum rated capacity for stability, freeboard, and handling. Each board undergoes water testing before final inspection approval.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Universal Testing Machine (tensile)
    spec: 5 kN, ASTM D751 compliant
  - name: Pressure Decay Tester
    spec: Multi-channel, 0–50 psi, datalogging
  - name: UV Weathering Chamber
    spec: ISO 4892, 1,000 h cycles
  - name: Thickness Gauge (digital)
    spec: 0.01 mm resolution
  - name: Peel Tester (weld)
    spec: Motorized, 50 N capacity
  - name: Temperature Chamber
    spec: -40 °C to +100 °C
  - name: Leak Detection Tank
    spec: 6 m × 2 m, illuminated

