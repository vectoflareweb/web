answer:
  label: 'Straight answer'
  text: 'Factory capacity: 12,500 m² across four specialized workshops, 120,000+ SUP boards per year, 350+ workers on two shifts, exporting to 50+ countries. MOQ is confirmed by project configuration — sample (1–2 units), pilot (20–50 units) and standard volume (90–100+ units per 150 m roll); see our MOQ & Flexible Branding Guide for the full logic. Lead time 25–35 days, samples 7–12 days.'
  verified: '2026-08'

intro: Vectoflare operates one of the largest dedicated inflatable SUP manufacturing facilities in Qingdao, China. Our 12,500 m² factory is organized into four specialized workshops operating in parallel, giving us the capacity to produce over 120,000 boards annually across SUP and safety equipment lines.

