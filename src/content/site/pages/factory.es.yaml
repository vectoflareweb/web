material_traceability:
  tagline: Trazabilidad
  title: Seguimiento de materiales y control de lotes
  description: A cada lote de materia prima se le asigna un número de lote único en nuestro sistema ERP. Desde la llegada hasta la producción y el producto terminado, la lista de materiales de cada tabla se vincula al lote original del proveedor. Esto permite la trazabilidad ascendente completa ante cualquier consulta de calidad o cumplimiento.
  system: ERP a medida (sistema interno de Qingdao Vatrad Group) + etiquetas físicas de lote en cada orden de trabajo
  coverage: 'El 100% de los materiales de producción: PVC, Hypalon, tejido drop-stitch, adhesivos, válvulas, herrajes, embalaje'
  records_retained: 10 años (según el requisito CE 2013/53/EU)
  suppliers:
    - material: PVC de grado marino
      source: Proveedores chinos y coreanos
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Proveedor japonés
      certified: ISO 9001, REACH
    - material: Tejido drop-stitch
      source: Tejido interno + socio externo
      certified: Control de calidad interno + ISO 9001 del proveedor
    - material: Válvulas y herrajes
      source: Proveedores OEM chinos
      certified: ISO 9001, certificados de material por lote

