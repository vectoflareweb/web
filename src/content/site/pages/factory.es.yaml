qc_section:
  tagline: Control de calidad
  title: Proceso de ensayo y garantía de calidad
  subtitle: Cada tabla se somete a ensayos obligatorios antes del envío. Nuestro laboratorio de calidad opera de forma independiente de la producción e informa directamente a la dirección.
  steps:
    - step: '1'
      title: Inspección de materias primas
      desc: Los tejidos de PVC, Hypalon y drop-stitch se someten a ensayos de tracción, propagación del desgarro y verificación de resistencia UV antes de que cualquier lote entre en producción.
    - step: '2'
      title: Ensayo de retención de aire de 24 horas
      desc: Cada cámara del tubo se infla a 18,0 PSI y se mantiene durante 24 horas. Una caída de presión superior a 0,50 PSI provoca el rechazo automático y la reinspección de las costuras.
    - step: '3'
      title: Ensayo de carga y estabilidad
      desc: Las tablas terminadas se inflan a la presión nominal y se comprueban en cuanto a hinchado simétrico, rigidez a 15 PSI y estabilidad bajo carga. Cada tabla se prueba en el agua en nuestra piscina de ensayos antes de la inspección final.

oem_section:
  tagline: Proyectos OEM
  title: Casos de éxito de marcas y asociaciones OEM
  subtitle: 'Del concepto a la producción: cómo ayudamos a marcas globales a lanzar y escalar sus líneas de SUP hinchables.'
  cases:
    - challenge: Un minorista europeo de outdoor necesitaba una línea de SUP de etiqueta privada con gráficos de cubierta únicos, PVC ecológico y embalaje listo para el comercio minorista, todo entregado en 60 días.
      solution: Desarrollamos archivos de impresión digital personalizados, conseguimos PVC conforme a REACH y redujimos las muestras de 3 rondas a 1 al ubicar al equipo de diseño en nuestra fábrica de Qingdao.
      result: Producción de 25–35 días desde la orden de compra firmada, con la primera entrega dentro de la ventana de llegada de 60 días. 2.400 unidades en 4 SKU. Pedido repetido antes de completarse la primera tirada.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'
    - challenge: Una startup estadounidense de deportes acuáticos necesitaba un SUP drop-stitch de alto rendimiento con forma personalizada, embalaje co-marcado y certificación BSCI para su colocación en el comercio minorista.
      solution: Adaptamos el molde SUP existente con un contorno modificado, desarrollamos el arte del embalaje co-marcado y proporcionamos documentación completa de la auditoría BSCI.
      result: Colocado con éxito en los principales minoristas de outdoor de EE. UU., generando un fuerte impulso con más de 5.000 unidades vendidas en el primer año y una tasa de ventas del 98%.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'
    - challenge: Un distribuidor australiano necesitaba una gama de SUP certificada CE con colores personalizados y cumplimiento de las normas australianas.
      solution: Produjimos muestras de preproducción con 4 variantes de color y coordinamos ensayos de cumplimiento de terceros.
      result: Gama de SUP de 3 modelos lanzada en el mercado AU/NZ. Posteriormente, adjudicación de una licitación gubernamental para 12 SUP de patrulla.
      disclaimer: 'Resumen de proyecto anonimizado — el tipo y alcance del proyecto son representativos; los resultados específicos no son verificables de forma independiente.'

faq_section:
  tagline: Preguntas frecuentes
  title: Preguntas frecuentes B2B y OEM
  questions:
    - q: ¿Cuál es la cantidad mínima de pedido (MOQ) para tablas SUP hinchables OEM?
      a: 'El MOQ se confirma según la configuración del proyecto, no con un número fijo — casco y utillaje, colores y PVC, arte, empaque y accesorios. La producción de volumen estándar corre en lotes de 90–100+ unidades por rollo completo de drop-stitch de 150 m, el co-branding de lotes pequeños parte de 5–10 unidades, y cada proyecto pasa por las etapas de muestra (1–2 unidades) y piloto (20–50 unidades). Consulta nuestra Guía de MOQ y Branding Flexible para la lógica de cálculo completa.'
    - q: ¿Mantiene Vectoflare la certificación BSCI?
      a: Sí. Nuestra fábrica mantiene una certificación válida de cumplimiento social BSCI (informe de auditoría disponible bajo petición). También tenemos ISO 9001 para gestión de calidad. La certificación CE aplica a modelos destinados al mercado de la UE; el alcance se confirma por proyecto. La documentación de cumplimiento REACH y RoHS se entrega con cada pedido OEM.
    - q: ¿Cuál es el plazo de entrega típico de un pedido OEM?
      a: El plazo estándar es de 25–35 días desde la confirmación del pedido y el depósito para la producción OEM en volumen. El desarrollo de moldes personalizados añade 15–20 días para el utillaje. Hay producción acelerada disponible para pedidos urgentes y picos de temporada. Las muestras de prototipo suelen estar listas en 7–12 días.
    - q: ¿Gestionáis la documentación de exportación?
      a: Sí. Nuestro equipo gestiona internamente la documentación de exportación y el despacho de aduanas, y suministramos a más de 50 países en los mercados de la UE, EE. UU., Australia y Asia.

b2b_moq: 'MOQ confirmado por configuración del proyecto: muestra 1–2, piloto 20–50, volumen 90–100+ (por rollo de 150 m); co-branding de lotes pequeños desde 5–10 unidades.'

production_flow:
  tagline: Flujo de producción
  title: Del material a la tabla terminada
  subtitle: Cada tabla pasa por 6 etapas de producción con puntos de control de calidad en cada paso. Sin atajos, sin inspecciones omitidas.
  stages:
    - stage: '01'
      title: Recepción de materiales y control de calidad de entrada
      description: Todos los materiales entrantes se registran por número de lote en nuestro sistema ERP. Los rollos de tejido de PVC, los núcleos drop-stitch, las válvulas, los adhesivos y los herrajes se ponen en cuarentena hasta el visto bueno del control de calidad.
      qc_check: 'Resistencia a la tracción (ASTM D751), resistencia al desgarro (ISO 4674), calibrador de grosor, viscosidad del adhesivo, escaneo de defectos visuales'
      qc_threshold: 'Se ensaya el 100% de los lotes. Rechazo si la tracción < 90% de la especificación, desgarro < mínimo de especificación o cualquier defecto visual'
      responsibility: Equipo de control de calidad de entrada (3 inspectores)
    - stage: '02'
      title: Corte CNC y preparación de materiales
      description: El anidado optimizado por ordenador dispone los paneles sobre el stock de PVC para minimizar el desperdicio. Las máquinas de corte CNC automáticas mantienen una precisión posicional de 0,1 mm.
      qc_check: 'Comprobación dimensional contra archivos CAD DXF, inspección de la calidad del borde, verificación del número de paneles'
      qc_threshold: 'Se mide cada 20.º panel. Tolerancia ±0,5 mm. Rechazo del lote si >2% fuera de tolerancia'
      responsibility: Responsable del taller de corte
    - stage: '03'
      title: Soldadura y unión drop-stitch
      description: Los núcleos drop-stitch se unen a los laminados exteriores de PVC mediante laminación térmica. Las cámaras de los tubos se sueldan por RF o por aire caliente. Las bandas de refuerzo del borde se fusionan con unión de triple capa.
      qc_check: 'Ensayo de pelado cada 50 unidades (ASTM D751), medición del ancho de soldadura, revisión del registro de temperatura del aire caliente, inspección visual de costuras bajo retroiluminación'
      qc_threshold: 'Resistencia al pelado mínima de 8 N/cm. Tolerancia del ancho de soldadura ±1 mm. Cualquier canalización visible = rechazo'
      responsibility: Control de calidad de soldadura (2 inspectores por turno)
    - stage: '04'
      title: Montaje y aparejo
      description: 'Las tablas pasan al montaje final, donde se ensamblan todos los componentes: paneles de cubierta y fondo fusionados, instalación de válvulas, anillas D, asas, cajas de quilla y colocación de la bolsa de transporte. Cada unidad sigue una lista de verificación de montaje de 100 puntos.'
      qc_check: 'Firma de la lista de verificación de 100 puntos por unidad, prueba de funcionamiento de válvulas (10 ciclos de apertura/cierre), verificación del par de herrajes, inspección visual'
      qc_threshold: 'Política de cero defectos en los elementos críticos de seguridad (válvulas, anillas D, asas). Defectos menores estéticos: AQL 2.5 (ISO 2859)'
      responsibility: Responsable del equipo de montaje + control de calidad de línea
    - stage: '05'
      title: Ensayo de presión y retención de calidad
      description: Cada cámara se infla a 18,0 PSI (para un SUP de 12–15 PSI) y se mantiene durante 24 horas. Los sensores de presión registran de forma continua. Las cámaras que superan una caída de presión de 0,50 PSI se rechazan y se envían para reinspección de costuras.
      qc_check: 'Registro de retención de presión de 24 h, verificación diaria de la calibración del sensor, lectura de presión compensada por temperatura, reensayo de costuras tras la reparación'
      qc_threshold: 'Máximo 0,50 PSI de caída de presión en 24 h a temperatura estable. Cualquier cámara que lo supere = reensayo del 100% de todo el lote de producción'
      responsibility: Laboratorio de calidad (independiente de la producción, informa a la dirección)
    - stage: '06'
      title: Inspección final y embalaje
      description: Inspección visual y funcional final. Defectos superficiales, consistencia del color, verificación de etiquetas/ID de producto, integridad del embalaje y completitud de los accesorios. Las unidades se envasan al vacío, se embalan en cajas y se paletizan para la carga de contenedores.
      qc_check: 'Inspección visual completa, lista de verificación de accesorios por SKU, ensayo de caída del embalaje (1 m, muestra aleatoria), verificación por escaneo de etiquetas/códigos de barras'
      qc_threshold: 'AQL 2.5 para defectos mayores, AQL 4.0 para menores. Tolerancia cero en defectos de seguridad. El 100% de las unidades se inspeccionan visualmente'
      responsibility: Equipo de control de calidad final (4 inspectores) + responsable del equipo de embalaje

