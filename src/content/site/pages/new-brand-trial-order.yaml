answer:
  label: 'Straight answer'
  text: 'Yes — you can launch an inflatable SUP brand with a low-MOQ trial order. The entry point is tiered rather than all-or-nothing: order 1–2 samples first (ready in 7–12 days) to freeze your hull, graphics and packaging; then place a trial order of 20–50 boards (production in 25–35 days) to test real sell-through; finally scale into standard volume runs of 90–100+ boards per 150 m drop-stitch fabric roll once the format is proven. Small-batch co-branding starts from as few as 5–10 units for operators that want branded boards without any development stage at all. Your first container comes only when the data says it should.'
  verified: '2026-08'

trial_included:
  tagline: What the Trial Order Covers
  title: 'Everything a Launch Needs, Without the Overhead'
  subtitle: 'A trial order is not a downsized invoice — it is the same factory process, sized to a launching brand. Here is what every trial program includes.'
  grid: 'sm:grid-cols-2 lg:grid-cols-3'
  features:
    - icon: B
      icon_bg: blue
      title: 'Board Platform & Construction'
      desc: 'Field-tested touring and all-around hulls with drop-stitch construction, triple-layer rail band fusion and 12–15 PSI rigidity — the same platforms used by our volume clients, in stock sizes from 10 ft to 11 ft 6 in.'
    - icon: L
      icon_bg: green
      title: 'Your Branding, Applied for Real'
      desc: 'Full-surface digital or silk-screen artwork, EVA traction pad with your logo, and secondary branding on nose or side rails. Small-batch co-branding uses Vectoflare central branding with your logo on nose or rails.'
    - icon: P
      icon_bg: purple
      title: 'Packaging Options That Scale'
      desc: 'Start with generic cartons and barcode stickers, upgrade to full-color 5-ply branded retail boxes for later runs. Custom packaging carries an independent press minimum; surplus boxes are stored and released on schedule.'
    - icon: Q
      icon_bg: orange
      title: 'Factory-Level Quality Control'
      desc: 'Every board passes the same 100-point assembly checklist and 24-hour pressure and airtightness testing (18.0 PSI hold, auto-reject above 0.50 PSI drop) that applies to any order, sample or container.'
    - icon: D
      icon_bg: blue
      title: 'Export & Documentation'
      desc: 'CE, ISO 9001, BSCI, REACH and RoHS compliance documentation, export-grade packing and ocean freight coordination to 50+ countries — from a 1-board sample to full programs.'
    - icon: T
      icon_bg: green
      title: 'Timeline You Can Plan Around'
      desc: 'Samples in 7–12 days, trial production in 25–35 days after confirmed PO and deposit, and confirmed production slots for pre-season orders — so a launch lands in season, not after it.'

trial_steps:
  tagline: The Launch Roadmap
  title: 'From Idea to First Sell-Through in Six Gates'
  subtitle: 'The typical first launch runs 8–12 weeks from brief to delivered trial order using existing platforms — longer when a bespoke hull adds mould development. Every gate has a date you agree in advance.'
  steps:
    - step: 'Gate 1'
      title: 'Product Brief & Engineering Review (Days 0–2)'
      desc: 'You share target board model, order quantity, artwork and packaging intent. Engineering review completes within one business day, with NDA available before you share proprietary specs.'
    - step: 'Gate 2'
      title: 'Specification, MOQ & Quotation (Days 3–7)'
      desc: 'Itemized quotation with the exact MOQ calculation, sample fees and lead time segments. Sample fees are credited toward your production order upon contract sign-off.'
    - step: 'Gate 3'
      title: 'Samples in 7–12 Days'
      desc: '1–2 physical boards validate hull rigidity, EVA traction pad texture, graphic accuracy and accessory fitment. You ride the board before committing to anything else.'
    - step: 'Gate 4'
      title: 'Trial Order of 20–50 Boards (25–35 Days)'
      desc: 'Production on existing hull platforms with stock materials and simplified packaging — the minimum commercial test that reflects real inventory conditions.'
    - step: 'Gate 5'
      title: 'Sell-Through & Feedback Window'
      desc: 'The important gate is in your market, not our factory: renters and customers confirm the board format, graphics and price point before you scale.'
    - step: 'Gate 6'
      title: 'Scale Into Volume Runs (90–100+ Boards)'
      desc: 'Once the format is proven, standard 150 m roll runs deliver full production efficiency, branded packaging and volume pricing. A container program is the goal, not the requirement.'

