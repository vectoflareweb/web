  tagline: 'For New & Growing SUP Brands'
  title: 'Launch Your SUP Brand with a Low-MOQ Trial Order'
  subtitle: 'You do not need a container to start a SUP brand. Validate your board, your graphics and your market with a single sample, then test sell-through with a trial order of 20–50 boards — before you ever commit to full production volumes. Branding, quality control and export logistics are handled by Qingdao Vatrad Group Co., Ltd.'
