trial_faqs:
  tagline: FAQ
  title: 'Frequently Asked Questions About Launching with a Trial Order'
  items:
    - q: 'Can I really launch a SUP brand without a container order?'
      a: 'Yes. The entry point is tiered: 1–2 samples validate the board (ready in 7–12 days), a trial order of 20–50 boards validates the market (production in 25–35 days), and volume runs of 90–100+ boards follow only when sell-through proves the format. Small-batch co-branding starts from as few as 5–10 units when you want branded boards without any development stage.'
    - q: 'How long does a full launch take, end to end?'
      a: 'Using existing hull platforms, a typical first launch runs 8–12 weeks from product brief to delivered trial order: samples in 7–12 days, trial production in 25–35 days after confirmed PO and deposit. A bespoke hull adds 15–20 days of mould development.'
    - q: 'What does the price include — and what does it not?'
      a: 'The reference ranges are EXW Qingdao for the boards themselves, including branding application and standard QC. They are indicative: the final quotation is confirmed against your configuration — hull, PVC, artwork coverage, packaging and accessories — before any commitment. Freight, duties and customs clearance at destination are quoted separately.'
    - q: 'Do I have to buy 100 or 500 boards to get my logo on the boards?'
      a: 'No. Small-batch co-branding puts your logo on nose or side rails from as few as 5–10 units, and trial orders of 20–50 boards support full artwork application at the same quality as volume production. What changes with quantity is unit price, not availability.'
    - q: 'What happens if I want to change the design after the trial?'
      a: 'Changes between trial and volume are normal and welcomed — that is the point of the trial. Colorways, artwork, packaging and accessories are re-priced against the new configuration, then frozen with Artwork and BOM sign-off before the volume run. Mould fees for screen printing are waived on re-orders using the same artwork dimension.'
    - q: 'Do you sign an NDA before I share my designs?'
      a: 'Yes. A Non-Disclosure Agreement is available before you share proprietary technical specifications or artwork. We manufacture exclusively under the brands of our clients and never compete with them in any market — the same policy applies to a 1-board sample as to a container program.'

