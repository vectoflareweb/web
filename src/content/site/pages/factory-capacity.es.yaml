hero:
  tagline: Capacidad de producción
  title: Capacidad de fabricación y producción anual
  subtitle: 'Instalación de 12.500 m² que produce más de 120.000 tablas de SUP al año, con margen para escalar'

answer:
  label: 'Respuesta directa'
  text: 'Capacidad de la fábrica: 12.500 m² repartidos en cuatro talleres especializados, más de 120.000 tablas de SUP al año, más de 350 trabajadores en dos turnos y exportación a más de 50 países. El MOQ se confirma según la configuración del proyecto — muestra (1–2 unidades), piloto (20–50 unidades) y volumen estándar (90–100+ unidades por rollo de 150 m); consulta nuestra Guía de MOQ y Branding Flexible para la lógica completa. Plazo de entrega de 25–35 días y muestras en 7–12 días.'
  verified: '2026-08'

intro: Vectoflare opera una de las instalaciones dedicadas más grandes de fabricación de SUP hinchables en Qingdao, China. Nuestra fábrica de 12.500 m² está organizada en cuatro talleres especializados que trabajan en paralelo, lo que nos da la capacidad de producir más de 120.000 tablas al año en las líneas de SUP y equipo de seguridad.

