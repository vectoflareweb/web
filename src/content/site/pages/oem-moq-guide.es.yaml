moq_faqs:
  tagline: FAQ
  title: 'Preguntas Frecuentes Sobre el MOQ'
  items:
    - q: '¿El MOQ se calcula por pedido, por modelo o por color?'
      a: 'El MOQ puede aplicarse por modelo, color, versión de arte, configuración de empaque o pedido total. Debido a que los distintos grosores de drop-stitch (12 cm vs 15 cm) y los colores de PVC provienen de rollos de materia prima diferentes, pedir 50 tablas divididas en 5 colores crea 5 requisitos separados de rollo de tela. Confirmamos el cálculo exacto contra tu matriz de SKU antes de cotizar para que planifiques tu mezcla con claridad.'
    - q: '¿Puedo pedir una muestra antes de la producción en masa?'
      a: 'Sí. El desarrollo de muestras (1–2 unidades) verifica la rigidez del casco, la textura de la alfombrilla EVA, la precisión gráfica y el ajuste de accesorios antes del lanzamiento de producción. Se aplican tarifas de muestra que se acreditan a tu pedido de producción al firmar el contrato.'
    - q: '¿Por qué el empaque minorista personalizado tiene un MOQ independiente?'
      a: 'Las imprentas flexográficas u offset de cajas personalizadas requieren una preparación mínima de más de 500 unidades. Ofrecemos una Solución de Almacenamiento de Empaque Híbrido: producimos las 500 cajas impresas, almacenamos el excedente en nuestro almacén limpio y las liberamos en lotes a través de tus envíos programados — así un pedido menor también puede enviarse con empaque minorista totalmente personalizado.'
    - q: '¿Por qué el MOQ estándar de volumen es de 90–100 unidades?'
      a: 'El MOQ de volumen estándar sigue a la materia prima: un rollo maestro de 150 m de tela drop-stitch de alta calidad rinde aproximadamente 90–100 tablas terminadas para un casco touring o all-around estándar. Correr rollos completos elimina empalmes de tela, mantiene uniforme la tensión de las fibras y amortiza las 2 horas de calibración de las líneas de soldadura y laminación — logrando el menor costo unitario posible.'
    - q: '¿Una cantidad mayor reduce el costo unitario?'
      a: 'En la mayoría de los proyectos, sí. Las cantidades mayores mejoran el rendimiento del material, distribuyen los costos fijos de preparación de la línea entre más tablas y reducen los costos unitarios de empaque.'
    - q: '¿Las tarifas de molde del co-branding se aplican de nuevo en los re-pedidos?'
      a: 'No. Las tarifas de molde de serigrafía se cobran una sola vez en la configuración inicial y se eximen en re-pedidos que usen la misma dimensión de arte. Solo pagas la tarifa de manejo e impresión de $1.00 USD por tabla.'
    - q: '¿Solicitar orientación de MOQ me compromete con un pedido?'
      a: 'No. Solicitar orientación de MOQ simplemente permite que nuestro equipo de ingeniería en Qingdao Vatrad Group Co., Ltd. revise tu brief técnico y aconseje la ruta de producción más rentable. Hay disponible un Acuerdo de No Divulgación (NDA) antes de compartir especificaciones técnicas o arte propietario.'

