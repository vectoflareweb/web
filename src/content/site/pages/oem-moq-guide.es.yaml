moq_stages:
  tagline: Muestra · Piloto · Volumen
  title: 'Tres Etapas de Cantidad Distintas'
  subtitle: 'Las cantidades de muestra, piloto y producción de volumen son diferentes. Cada proyecto se clasifica en tres niveles distintos para que valides antes de comprometerte.'
  steps:
    - step: '01'
      title: 'Desarrollo de Muestra (1–2 unidades)'
      desc: 'Confirmación física de la rigidez del casco, la textura de la alfombrilla EVA, la precisión gráfica y el ajuste de accesorios antes de cualquier compromiso financiero. Se aplican tarifas de muestra que se acreditan a tu pedido de producción al firmar el contrato.'
    - step: '02'
      title: 'Pedido Piloto (20–50 unidades)'
      desc: 'Pruebas comerciales de pretemporada y validación de mercado regional usando plataformas de casco existentes, materiales de stock y empaque simplificado para minimizar la fricción de preparación.'
    - step: '03'
      title: 'Producción de Volumen (90–100+ unidades)'
      desc: 'Confirmada tras la BOM congelada, el arte finalizado, el empaque personalizado y los planes de entrega programados — rollos completos de 150 m, telas Pantone a medida, empaque exclusivo, descuentos por volumen y trazabilidad completa de lote.'

moq_factors:
  tagline: Qué Define Tu MOQ
  title: 'Por Qué el MOQ Totalmente Personalizado Siempre Es Específico del Proyecto'
  subtitle: 'Para la fabricación 100% a medida, el MOQ se calcula a partir de la arquitectura completa del producto — estos cuatro componentes se evalúan juntos antes de cotizar.'
  headers:
    component: Componente del Proyecto
    driver: Factor de Fabricación
    impact: Impacto en la Cantidad Mínima
  rows:
    - component: 'Forma del Casco y Herramientas'
      driver: 'Moldes de rocker existentes vs matrices de corte CAD a medida y herramientas de prensa en caliente EVA'
      impact: 'Plataformas existentes: pedidos piloto desde 20 pcs. Cascos a medida: requiere amortización de herramientas dedicadas.'
    - component: 'Colores y PVC'
      driver: 'Colores estándar de stock vs láminas de PVC teñidas en Pantone propio'
      impact: 'El PVC Pantone personalizado requiere corridas de teñido químico dedicadas con MOQs independientes de materia prima.'
    - component: 'Empaque con Marca'
      driver: 'Cajas genéricas con etiquetas de código de barras vs cajas minoristas de regalo de 5 capas y manuales con marca'
      impact: 'Las cajas de color personalizadas tienen un mínimo independiente de impresión offset (típicamente más de 500 cajas).'
    - component: 'Paquetes de Accesorios'
      driver: 'Paddles estándar de aluminio o nailon vs paddles de carbono a juego y bombas con marca'
      impact: 'Los accesorios totalmente personalizados siguen los lotes de producción de los proveedores de nivel inferior.'

