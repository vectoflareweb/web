customization:
  tagline: Hecho a tu especificación
  title: Puntos de especificación OEM
  subtitle: 'Estos son los puntos de especificación que controlas en un proyecto OEM — tu documento de especificación es el contrato de producción:'
  items:
    - 'Dimensiones de la tabla — largo, ancho, grosor, rocker y volumen según tus planos o tus riders objetivo'
    - 'Estructura del material — número y calidad de capas de PVC, densidad del drop-stitch, rigidizadores y refuerzos de raíl'
    - 'Gráfica y colores — tu arte aplicado con paletas ilimitadas, o soporte de nuestro equipo de diseño interno'
    - 'Plataforma de agarre EVA — deck pads cortados a medida, logotipos y colores en cada tabla'
    - 'Asas y anillas D — posición, cantidad y especificación de herrajes según tu uso'
    - 'Sistemas de quillas — configuraciones de una, dos o tres quillas y cajas de quilla a tu especificación'
    - 'Palas, bombas, correas y accesorios — tu paquete, tu marca'
    - 'Embalaje y presentación retail — cajas retail, embalaje marítimo y displays para punto de venta bajo tu marca'
    - 'Etiquetas y marcas de cumplimiento — etiquetas de serie, logotipos y documentación por mercado preparada para tu región de exportación'

faq_section:
  tagline: FAQ
  title: Preguntas sobre fabricación OEM
  questions:
    - q: '¿Cómo inicio un proyecto OEM con mi propio diseño?'
      a: 'Envía tus planos, una tabla de referencia o una especificación escrita. Nuestra revisión de ingeniería confirma la fabricabilidad y devuelve un presupuesto en un día laborable — es nuestro compromiso estándar, y se firma un NDA antes de cualquier intercambio de archivos cuando sea necesario.'
    - q: '¿Cuál es el MOQ para un SUP OEM hinchable?'
      a: 'El MOQ se confirma por configuración del proyecto — casco y utillaje, colores y PVC, arte, embalaje y accesorios. La producción de volumen estándar corre de 90–100 unidades por lote (un rollo de drop-stitch de 150 m), y los pilotos parten de 20–50 unidades sobre plataformas existentes. Consulta la lógica completa en nuestra Guía de MOQ y branding flexible.'
    - q: '¿Cuál es el plazo típico de un pedido OEM?'
      a: 'La producción corre en 25–35 días desde el pedido confirmado y el depósito. El desarrollo de moldes a medida añade 15–20 días de utillaje. Las muestras de prototipo suelen enviarse en 7–12 días.'
    - q: '¿Podéis fabricar solo a partir de mis planos?'
      a: 'Sí. OEM construye desde tu especificación tal cual — tú eres dueño del diseño. Nuestros ingenieros revisan los planos para viabilidad de producción, señalan cualquier conflicto de especificación antes de empezar el utillaje o el corte, y la muestra aprobada se convierte en la referencia de producción.'
    - q: '¿Proporcionáis muestras antes de la producción?'
      a: 'Sí. Se produce y aprueba una muestra física antes de cualquier tirada, normalmente en 7–12 días, y es la referencia para todos los controles de calidad posteriores.'
    - q: '¿Qué certificaciones tiene la fábrica?'
      a: 'CE, ISO 9001, BSCI, REACH y RoHS. Con cada envío OEM se entrega documentación completa de cumplimiento, preparada para tus mercados objetivo.'
    - q: '¿Cómo se controla la calidad en una tirada OEM?'
      a: 'La producción corre bajo control de calidad multipunto — material entrante, proceso y inspección final — con prueba de retención de presión de 24 horas a 18.0 PSI (auto-rechazo por encima de 0.50 PSI de caída), lista de comprobación de 100 puntos y trazabilidad ERP de 10 años por número de serie.'
    - q: '¿Cuáles son vuestros términos de envío?'
      a: 'FOB Qingdao, CIF a los principales puertos globales, o DDP para socios cualificados. Enviamos a más de 50 países en los mercados de la UE, EE. UU., AU y Asia.'

process:
  title: 'El proceso OEM — De la especificación al contenedor enviado'
  subtitle: 'Siete fases controladas dirigidas por un solo equipo de fábrica, para que cada paso desde tu primera especificación hasta el contenedor embalado quede documentado y a tiempo.'
  steps:
    - phase: '01'
      title: Revisión de especificación y presupuesto
      period: 1 día laborable
      items:
        - 'Comparte tus planos, especificación o tablas de referencia — nuestros ingenieros comprueban la fabricabilidad.'
        - 'Recibes un presupuesto detallado y un plan de proyecto en un día laborable.'
    - phase: '02'
      title: Confirmación de ingeniería
      period: Semana 1
      items:
        - 'Las dimensiones del casco, la calidad del drop-stitch, las especificaciones de PVC y la construcción del raíl se confirman contra tu documento.'
        - 'Se cierran las decisiones de molde o plataforma — el utillaje del molde a medida empieza aquí cuando se requiere.'
    - phase: '03'
      title: Prototipo y muestra
      period: 7–12 días
      items:
        - 'Se produce una muestra física y se envía para tu revisión — pruebas en el agua incluidas para formas nuevas.'
        - 'La muestra (1–2 unidades) valida tu especificación antes de cualquier compromiso de volumen.'
    - phase: '04'
      title: Ensayos y validación
      period: En paralelo
      items:
        - 'Controles de retención de aire, presión, resistencia de costuras, carga y UV por línea de producción.'
        - 'Documentación CE, ISO 9001, BSCI, REACH y RoHS preparada para tus mercados de exportación.'
    - phase: '05'
      title: Aprobación y confirmación
      period: Tras el visto bueno de la muestra
      items:
        - 'Apruebas la muestra y el arte; el pedido y el depósito bloquean el cupo de producción.'
        - 'Un plan de preproducción confirma fechas, cantidades, embalaje y puerto de carga.'
    - phase: '06'
      title: Producción
      period: 25–35 días
      items:
        - 'La producción corre bajo control de calidad multipunto — material entrante, proceso e inspección final.'
        - 'Desde pedidos piloto (20–50 unidades) sobre plataformas existentes hasta lotes completos de 150 m (90–100+ unidades) para volumen estándar.'
    - phase: '07'
      title: Embalaje y envío
      period: 1 día + tránsito
      items:
        - 'Embalaje de exportación con etiquetas de serie por modelo, luego FOB Qingdao, CIF o DDP a más de 50 países.'
        - 'Documentación aduanera, seguimiento y soporte para reordenes incluidos en cada fase.'

