hero:
  tagline: Fabricación OEM
  title: 'Fabricación OEM de SUP a medida — Tu especificación, nuestra fábrica'
  subtitle: 'Tú aportas el diseño, los planos o una plataforma probada — nosotros fabricamos a escala de contenedor. Revisión de ingeniería en un día laborable, muestras en 7–12 días y producción en 25–35 días tras confirmar el pedido y el depósito, enviada bajo tu marca.'

answer:
  label: 'Respuesta directa'
  text: 'La producción OEM parte de tu especificación. El MOQ se confirma por configuración del proyecto y no es un número fijo: la producción de volumen estándar corre de 90–100 unidades por lote a partir de un rollo de drop-stitch de 150 m, los lotes piloto parten de 20–50 unidades sobre plataformas existentes y cada proyecto pasa por una muestra (1–2 unidades) antes del volumen. Las muestras salen en 7–12 días; la producción corre en 25–35 días tras confirmar el pedido y el depósito, más 15–20 días cuando se requiere utillaje nuevo.'
  verified: '2026-08'

