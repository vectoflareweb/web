intro: |
  <p><strong>Vectoflare</strong> es la división de fabricación náutica de <strong>Qingdao Vatrad Group Co., Ltd.</strong>, con sede en la Zona de Desarrollo Económico de Laixi, Qingdao, Shandong (China). Fundada en 2012, la empresa empezó como un taller especializado de embarcaciones dedicado a la artesanía náutica, y se ha convertido en una fábrica certificada que da servicio a clientes OEM y ODM en más de 50 países.</p>
  <p>Vectoflare es la división B2B de desarrollo personalizado de la fábrica de Vectoflare. Cada proyecto de Vectoflare — desde una primera muestra o una tirada pequeña de co-branding hasta una línea de producto completa de marca privada — se fabrica en las mismas instalaciones, con los mismos equipos y bajo el mismo sistema de calidad que se describe aquí.</p>
  <p>La fábrica ocupa 12,500 m² con talleres dedicados al corte de PVC, al montaje del núcleo drop-stitch, a la soldadura de alta frecuencia, al ensamblaje de las tablas y a una zona de pruebas para las comprobaciones de retención de aire, mantenimiento de la presión y resistencia de las costuras. La capacidad de producción supera las 120,000 unidades inflables al año, y las instalaciones operan bajo un sistema de gestión de calidad ISO 9001 con cumplimiento certificado CE, BSCI, REACH y aprobación USCG para los productos exportados.</p>
  <p>Más de 200 trabajadores cualificados y más de 14 ingenieros de I+D respaldan las dos líneas de trabajo que importan a las marcas de SUP: la ingeniería (diseño de casco, selección de materiales, creación de prototipos) y la producción (aplicación de gráficos, ensamblaje, inspección, embalaje de exportación). Un centro de I+D interno con laboratorio de tejido PVC y tanque de pruebas se ocupa de los moldes personalizados y de la validación estructural antes de empezar la producción en masa.</p>
