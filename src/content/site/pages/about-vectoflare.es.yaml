values_section:
  title: Cómo trabaja la fábrica con las marcas
  subtitle: 'Tres principios que configuran cada proyecto construido por la fábrica de Vectoflare.'
  columns: 3
  items:
    - title: Ingeniería antes que producción
      description: 'Cada proyecto comienza con los requisitos, los planos y una muestra física: la forma del casco, la calidad del drop-stitch, la colocación de los gráficos y el embalaje se validan antes de cualquier tirada de producción, no se descubren en la línea.'
      icon: 'tabler:settings'
    - title: Un solo equipo, una sola fábrica
      description: 'El diseño, el corte, la soldadura, el ensamblaje y las pruebas ocurren en unas instalaciones de 12,500 m². Sin reenvíos de casas comerciales: las personas que responden a tus preguntas son las que construyen tus tablas.'
      icon: 'tabler:building-factory-2'
    - title: Primeras tiradas pequeñas
      description: 'El co-branding de lotes pequeños parte de menos de 20 unidades y la producción de volumen estándar corre en lotes de 90–100+ unidades (un rollo de drop-stitch de 150 m), de modo que las marcas validan el mercado antes de escalar — con las herramientas y los diseños conservados para los pedidos repetidos.'
      icon: 'tabler:layers-intersect'
services_section:
  title: Lo que entrega la fábrica
  subtitle: 'Los servicios de fabricación disponibles para los clientes de Vectoflare.'
  columns: 2
  items:
    - title: Desarrollo de SUP personalizado
      description: 'Evaluación de requisitos, especificaciones, selección de materiales, gráficos, prototipado, aprobación de la muestra y producción de productos de SUP hinchables a medida.'
      icon: 'tabler:bulb'
    - title: Producción de marca privada
      description: 'Tu logotipo, tus colores y tu embalaje sobre plataformas comerciales probadas: la tabla, la cubierta de agarre, los accesorios y los cartones llevan tu identidad, sin ningún uso de la marca de fábrica.'
      icon: 'tabler:tag'
    - title: Fabricación OEM / ODM
      description: 'Fabricación completa de SUP hinchables OEM y ODM a partir de los diseños del cliente o de diseños desarrollados en conjunto, incluidos los moldes personalizados para las nuevas formas de las tablas.'
      icon: 'tabler:package'
    - title: Suministro de flotas
      description: 'Flotas de tablas personalizadas para resorts, clubes, escuelas y operadores de alquiler, con accesorios a juego y series de producción pensadas para flotas.'
      icon: 'tabler:users-group'
certifications_section:
  title: Certificación y cumplimiento
  subtitle: 'La fábrica envía a la UE, Estados Unidos y Asia-Pacífico con un sistema de cumplimiento documentado.'
  columns: 2
  items:
    - title: Certificación CE
      description: 'Las líneas de producto de SUP hinchable y embarcaciones cumplen las directivas de seguridad de la UE, con toda la documentación para cada mercado.'
      icon: 'tabler:certificate'
    - title: Sistema de calidad ISO 9001
      description: 'La instalación de fabricación opera bajo un sistema de gestión de la calidad ISO 9001 que cubre el material entrante, el proceso y la inspección final.'
      icon: 'tabler:badge-check'
    - title: Conformidad social BSCI
      description: 'La responsabilidad social se evalúa según BSCI, que cubre las condiciones de trabajo y el cumplimiento de la fábrica.'
      icon: 'tabler:shield-check'
    - title: Conformidad de materiales REACH
      description: 'Los materiales cumplen el Reglamento REACH de la UE en materia de seguridad química.'
      icon: 'tabler:flask'
    - title: Aprobación USCG
      description: 'Fabricación aprobada por la Guardia Costera de Estados Unidos para las líneas de embarcaciones hinchables.'
      icon: 'tabler:anchor'
    - title: Pruebas de producto
      description: 'Flotabilidad, capacidad de carga, resistencia de las costuras, resistencia a los rayos UV, resistencia a la abrasión y pruebas de mantenimiento de la presión en cada línea de producción.'
      icon: 'tabler:test-pipe'
