name: AI Index (Vectorize)
on:
  # 手动触发：首次搭建 / 事后补建 3 个索引。
  workflow_dispatch:
  # 每次生产部署成功后自动跑：确保索引存在 → 重建知识索引 → 冒烟验证。
  # Deploy 失败（conclusion 非 success）时跳过。
  # 注意：AI/Vectorize 绑定默认注释掉（免费层兼容），未配置时整个 workflow 优雅跳过。
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  ensure-and-rebuild:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # secrets 不能直接用于 if，先探测并暴露为 step output，缺失时优雅跳过
      # （与 deploy.yml 的 guard 同一模式，避免每次运行都留红叉）。
      - name: Check for Cloudflare credentials
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN 未配置，跳过 AI 索引步骤。"
          fi
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.4.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      # 索引是账号级资源，--env 只影响绑定的 index_name 命名（wrangler.example.jsonc
      # 里三个环境已声明）；用模板配置即可，placeholders 不影响 vectorize 命令。
      # create 幂等：已存在时报 "already exists"/duplicate_name，识别后跳过。
      - if: steps.guard.outputs.enabled == 'true'
        name: Ensure Vectorize indexes exist (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_VECTORIZE_INDEX: ${{ vars.CF_VECTORIZE_INDEX }}
        run: |
          set -e
          create_index() {
            local name="$1"; shift
            if npx wrangler vectorize create "$name" --dimensions=1024 --metric=cosine \
              --config wrangler.example.jsonc "$@" > /tmp/vz.log 2>&1; then
              echo "created $name"
            elif grep -qiE 'already exists|duplicate_name' /tmp/vz.log; then
              echo "exists (skip) $name"
            else
              cat /tmp/vz.log
              exit 1
            fi
          }
          IDX="${CF_VECTORIZE_INDEX:-vectoflare-knowledge}"
          create_index "$IDX"
          create_index "$IDX-staging"
          create_index "$IDX-prod"
      # 部署后立刻重建索引（/api/reindex 由 worker 内的 REINDEX_TOKEN 门禁；
      # deploy.yml 的 secret sync 步骤已把该 token 同步到 Worker）。
      # 未配置 token 时优雅跳过 —— 每日 03:00 cron 仍会兜底重建。
      - if: steps.guard.outputs.enabled == 'true'
        name: Rebuild AI index on production
        env:
          REINDEX_TOKEN: ${{ secrets.REINDEX_TOKEN }}
          CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
        run: |
          if [ -z "$REINDEX_TOKEN" ]; then
            echo "::notice::REINDEX_TOKEN 未配置，跳过索引重建（每日 03:00 cron 会自动重建）。"
            exit 0
          fi
          DOMAIN="${CF_PROD_DOMAIN:-vectoflare.com}"
          HTTP=$(curl -sS -o /tmp/reindex.json -w '%{http_code}' -X POST \
            "https://$DOMAIN/api/reindex" \
            -H "Authorization: Bearer $REINDEX_TOKEN")
          if [ "$HTTP" != "200" ]; then
            echo "::error::reindex failed (HTTP $HTTP): $(cat /tmp/reindex.json)"
            exit 1
          fi
          echo "reindex stats: $(cat /tmp/reindex.json)"
          jq -e '.ok == true and (.stats | type == "array" and length > 0)' /tmp/reindex.json
      # 端到端冒烟：公开端点无论走 AI 还是 FAQ 降级都应返回 ok=true。
      - if: steps.guard.outputs.enabled == 'true'
        name: Smoke-test the assistant endpoint
        env:
          CF_PROD_DOMAIN: ${{ vars.CF_PROD_DOMAIN }}
        run: |
          DOMAIN="${CF_PROD_DOMAIN:-vectoflare.com}"
          HTTP=$(curl -sS -o /tmp/ask.json -w '%{http_code}' -X POST \
            "https://$DOMAIN/api/ask" \
            -H 'content-type: application/json' \
            -d '{"question":"What is your MOQ?","locale":"en"}')
          if [ "$HTTP" != "200" ] || ! jq -e '.ok == true' /tmp/ask.json >/dev/null; then
            echo "::error::ask smoke test failed (HTTP $HTTP): $(cat /tmp/ask.json)"
            exit 1
          fi
          echo "ask mode: $(jq -r '.mode' /tmp/ask.json)"